name: Apply the task patch to a fresh application base
description: >-
  Check out the verified application base, download the small factory-patch-N
  copy of the Code Agent patch (falling back to the complete factory-agent-N
  record) and apply it to the task branch. The pinned control plane must
  already be checked out at control/: the apply script comes from it, so the
  composite only arranges the steps the workflow used to repeat per job.
inputs:
  base-sha:
    description: The verified application base commit the patch was created against.
    required: true
  issue-number:
    description: The task Issue number, which names the patch artifacts.
    required: true
  work-branch:
    description: The task branch the patch is applied onto.
    required: true
  persist-credentials:
    description: >-
      Keep the checkout token in the workspace. Only the publication job, which
      pushes the task branch, passes 'true'.
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    # The patch carries full blob ids against this commit, so applying it
    # needs the base tree only, not the repository history.
    - name: Check out fresh application base
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.base-sha }}
        path: workspace
        persist-credentials: ${{ inputs.persist-credentials }}

    - name: Download Code Agent patch
      id: patch_copy
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: factory-patch-${{ inputs.issue-number }}
        path: agent-artifacts

    # The agent job tolerates a failed upload of the small copy; the complete
    # factory-agent-N record carries the same files.
    - name: Fall back to the complete Code Agent artifact
      if: steps.patch_copy.outcome == 'failure'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: factory-agent-${{ inputs.issue-number }}
        path: agent-artifacts

    - name: Apply patch to the task branch
      shell: bash
      env:
        WORK_BRANCH: ${{ inputs.work-branch }}
      run: |
        node control/.github/scripts/apply-patch.mjs \
          --workspace workspace \
          --patch agent-artifacts/agent.patch \
          --branch "$WORK_BRANCH"
