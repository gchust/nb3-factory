name: Verify protected path fix

on:
  push:
    branches: [fix/protected-path-sanitization]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - run: node --test .github/scripts/tests/patch-flow.test.mjs
