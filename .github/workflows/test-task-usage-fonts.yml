name: Test task usage and Chinese fonts
on:
  push:
    branches: [feat/task-usage-and-cjk-fonts]
permissions: {}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Factory regression tests
        run: node --test .github/scripts/tests/*.test.mjs
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Lint new scripts
        run: pnpm exec eslint .github/scripts/task-usage.mjs .github/scripts/report-task-usage.mjs .github/scripts/tests/task-usage.test.mjs .github/scripts/tests/browser-fonts-smoke.mjs --max-warnings 0
      - name: Install Chinese fonts on real Ubuntu runner
        run: bash .github/scripts/install-browser-fonts.sh
      - name: Verify real rendered Chinese glyphs
        run: node .github/scripts/tests/browser-fonts-smoke.mjs . "$RUNNER_TEMP/chinese-font-smoke.png"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chinese-font-smoke
          path: ${{ runner.temp }}/chinese-font-smoke.png
          retention-days: 7
          if-no-files-found: warn
  backfill:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Select completed Issue 21 task
        id: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/report-task-usage.mjs select --run-id 34100552921 --source "$RUNNER_TEMP/usage-source.json"
      - uses: actions/download-artifact@v4
        if: steps.source.outputs.ready == 'true'
        with:
          name: ${{ steps.source.outputs.artifact }}
          run-id: 34100552921
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/usage-evidence
      - name: Publish and replay real numeric report without invoking a model
        if: steps.source.outputs.ready == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for replay in 1 2; do
            node .github/scripts/report-task-usage.mjs publish --run-id 34100552921 \
              --source "$RUNNER_TEMP/usage-source.json" --artifacts "$RUNNER_TEMP/usage-evidence" \
              --summary "$RUNNER_TEMP/task-usage.json"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-task-usage
          path: ${{ runner.temp }}/task-usage.json
          retention-days: 7
          if-no-files-found: warn
