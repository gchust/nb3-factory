name: Verify pinned NocoBase source baseline

on:
  pull_request:
    # Only pull requests that can land on develop; stacked PRs are checked
    # when they retarget it.
    branches: [develop]
    paths:
      - '.github/workflows/source-baseline.yml'
      - '.github/scripts/source-*.mjs'
      - '.github/scripts/restore-source-dist.mjs'
      - '.github/scripts/baseline-record.mjs'
      - '.github/scripts/publish-source-baseline.sh'
      # Run by the jobs below, directly or through verify.sh.
      - '.github/scripts/assert-current-template.mjs'
      - '.github/scripts/overlay-factory.mjs'
      - '.github/scripts/template-guidance.mjs'
      - '.github/scripts/create-runtime-config.mjs'
      - '.github/scripts/install-browser-fonts.sh'
      - '.github/scripts/verify.sh'
      - '.github/scripts/apply-database.sh'
      - '.github/scripts/browser-smoke.mjs'
      - '.github/scripts/factory-eslint.mjs'
      - '.github/scripts/format-changes.mjs'
      - '.github/scripts/integration-checks.mjs'
      - '.github/scripts/required-checks.mjs'
      - '.github/scripts/stop-stale-app.sh'
      - '.github/scripts/timed-command.mjs'
      - '.github/scripts/timing.mjs'
      # overlay-factory.mjs reads these from the control checkout. It also
      # copies docs/ into the portable application, whose verify.sh then
      # format-checks it.
      - '.npmrc'
      - 'README.MD'
      - 'package.json'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact nocobase/nocobase3 source SHA (not a moving branch)
        required: true
        # SOURCE_BASELINE_DEFAULT in .github/scripts/source-baseline-ref.mjs;
        # an input default cannot read it, so a test keeps the two equal.
        default: 28c7522b3ddb384b05745715e94f7f985d09a67e
        type: string
      publish:
        description: Publish an isolated source baseline branch after both runners pass
        type: boolean
        default: false

permissions: {}

# The release and the baseline branch are named per run attempt
# (source-baseline-<sha12>-<run>-<attempt>), so runs never share them; the
# check-then-create in publish-source-baseline.sh only matters when the same
# descriptor is replayed. The group serializes runs of one PR or source SHA so
# they don't build and publish side by side.
concurrency:
  group: factory-source-baseline-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || inputs.source_sha }}
  queue: max

jobs:
  # queue: max cannot be combined with cancel-in-progress, so a pull request
  # run that a newer push already superseded still reaches a runner. Stop it
  # before the 20 minutes of source build and verification; the run for the
  # newer head reports on it. An API failure fails open. Build task PRs
  # (agent/issue-N) change only the application and are verified by the task
  # itself before a maintainer merges them into develop, so they skip the
  # check entirely. Nothing enforces that: develop has no branch protection
  # or rulesets today.
  #
  # It also skips a run whose inputs an earlier run of the same pull request
  # already verified. The path filter compares the whole pull request with
  # develop, so every push re-runs the check, including the pushes that change
  # none of its files: about a third of the pull request runs (18 of 50 from
  # 2026-09-28 to 2026-10-07 had the inputs of the previous green run of their
  # branch), ~13 minutes each. The fingerprint covers exactly the files of the
  # path filter, at the merge commit this run checks, so a change on develop
  # counts too; `record` below saves it once both jobs pass. It does not cover
  # Node.js, the runner image, the registry or the overlay's unlocked
  # dependencies, which a re-run picks up again.
  #
  # Nothing the pull request controls decides the skip on its own:
  # - the fingerprint script runs from the default branch (trusted/), reading
  #   the merge commit's files as data;
  # - a cache entry, which any run of this pull request could have saved,
  #   only names a run; the API must confirm that run is this workflow, on
  #   pull_request, for this same pull request, with both source-baseline and
  #   portable successful. A fork's pull request lists no pull request on its
  #   runs, so it always runs in full.
  # A pull request's cache is visible to that pull request alone, and the key
  # names the pull request as well. A re-run attempt always runs in full.
  # Every step of the lookup fails open: no confirmed run, no skip.
  supersede:
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'agent/issue-')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # The recorded run and its jobs.
      actions: read
      contents: read
      pull-requests: read
    outputs:
      superseded: ${{ steps.check.outputs.superseded }}
      inputs: ${{ steps.inputs.outputs.fingerprint }}
      verified: ${{ steps.verified.outputs.verified }}
    steps:
      - name: Stop when a newer push superseded this pull request run
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          live_head="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha || true)"
          if [[ -n "$live_head" && "$live_head" != "$RUN_HEAD_SHA" ]]; then
            echo "::notice::Pull request #$PR_NUMBER moved from $RUN_HEAD_SHA to $live_head; the run for that head verifies it. Skipping the rest of this run."
            echo "superseded=true" >> "$GITHUB_OUTPUT"
          else
            echo "superseded=false" >> "$GITHUB_OUTPUT"
          fi
      # The fingerprint script, from the default branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.check.outputs.superseded != 'true'
        continue-on-error: true
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
          sparse-checkout: .github/scripts
      # The files it fingerprints, from the merge commit; never executed here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.check.outputs.superseded != 'true'
        continue-on-error: true
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.check.outputs.superseded != 'true'
        continue-on-error: true
        with:
          node-version: 24.x
      - name: Fingerprint the files this check verifies
        id: inputs
        if: steps.check.outputs.superseded != 'true'
        continue-on-error: true
        run: |
          fingerprint="$(node trusted/.github/scripts/source-baseline-inputs.mjs control)"
          [[ "$fingerprint" =~ ^[0-9a-f]{64}$ ]]
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Look for an earlier run of this pull request that verified them
        id: lookup
        if: steps.inputs.outputs.fingerprint != '' && github.run_attempt == '1'
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/source-baseline-verified
          key: source-baseline-verified-v1-pr${{ github.event.pull_request.number }}-${{ steps.inputs.outputs.fingerprint }}
      - name: Skip inputs an earlier run already verified
        id: verified
        if: steps.lookup.outputs.cache-hit == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          run_id="$(head -n 1 "$RUNNER_TEMP/source-baseline-verified/run-id" 2>/dev/null || true)"
          if [[ ! "$run_id" =~ ^[1-9][0-9]*$ || "$run_id" == "$GITHUB_RUN_ID" ]]; then
            echo "::notice::The verified-inputs record names no earlier run; verifying in full."
            exit 0
          fi
          # Confirm the named run from the API, not from the cache entry.
          if ! run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"; then
            echo "::notice::Could not read run $run_id; verifying in full."
            exit 0
          fi
          run_ok="$(jq --argjson pr "$PR_NUMBER" \
            '.path == ".github/workflows/source-baseline.yml" and .event == "pull_request" and any(.pull_requests[]?; .number == $pr)' \
            <<<"$run_json" || true)"
          if ! passed="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=latest&per_page=100" --jq \
            '[.jobs[] | select((.name == "source-baseline" or .name == "portable") and .conclusion == "success") | .name] | unique | length')"; then
            echo "::notice::Could not read the jobs of run $run_id; verifying in full."
            exit 0
          fi
          if [[ "$run_ok" != true || "$passed" != 2 ]]; then
            echo "::notice::Run $run_id is not a passed source baseline check of pull request #$PR_NUMBER; verifying in full."
            exit 0
          fi
          echo "::notice::Run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run_id of pull request #$PR_NUMBER verified these exact inputs; skipping the source build. Re-run this workflow to verify again."
          echo "verified=true" >> "$GITHUB_OUTPUT"

  source-baseline:
    needs: supersede
    # A dispatch reaches the contents: write publish job, so it must run the
    # workflow file from develop, like refresh-template.yml. supersede is
    # skipped for a dispatch, hence !cancelled() instead of the implied success().
    # It fails safe: only a supersede job that ran and found a newer head, or
    # an earlier green run of the same inputs, skips this check. A failed supersede job (lost runner, API or output error)
    # leaves the output empty and the check runs, since a skipped check shows
    # as passed. develop has no required checks today, so this keeps the PR's
    # status honest rather than enforcing a merge rule.
    if: >-
      !cancelled() && (
      (github.event_name == 'pull_request' && !startsWith(github.head_ref, 'agent/issue-') &&
       needs.supersede.outputs.superseded != 'true' && needs.supersede.outputs.verified != 'true') ||
      (github.event_name != 'pull_request' &&
       github.actor == github.repository_owner &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch)))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.pin.outputs.source_sha }}
      control_sha: ${{ steps.pin.outputs.control_sha }}
      snapshot: ${{ steps.snapshot.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || github.event.repository.default_branch }}
          path: control
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
      - name: Validate the explicit source pin
        id: pin
        env:
          REQUESTED_SHA: ${{ inputs.source_sha }}
        run: |
          # A pull request has no input; it verifies the shared default.
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {appendFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {SOURCE_BASELINE_DEFAULT} from './control/.github/scripts/source-baseline-ref.mjs';
          const sha=process.env.REQUESTED_SHA||SOURCE_BASELINE_DEFAULT;
          assert.match(sha,/^[a-f0-9]{40}$/u);
          const control=execFileSync('git',['-C','control','rev-parse','HEAD'],{encoding:'utf8'}).trim();
          appendFileSync(process.env.GITHUB_ENV,`SOURCE_SHA=${sha}\nFACTORY_CONTROL_SHA=${control}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT,`source_sha=${sha}\ncontrol_sha=${control}\n`);
          NODE
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: source
        with:
          repository: nocobase/nocobase3
          ref: ${{ steps.pin.outputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.7.0
          run_install: false
      # Only the monorepo install from the public registry is cached. The store
      # is saved right after it, before the loopback registry and the smoke
      # application can add locally built package bytes to it.
      # A cache saved by a pull_request run is scoped to that PR's merge ref and
      # no other PR can restore it, so only develop runs (workflow_dispatch,
      # which this workflow requires to run from develop) save. framework-fix.yml
      # saves the same key prefix on develop as well; PRs restore either.
      - name: Locate the pnpm store
        id: pnpm-store
        working-directory: source
        run: |
          echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
          echo "version=$(pnpm --version)" >> "$GITHUB_OUTPUT"
      - name: Restore the nocobase3 pnpm store
        id: pnpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: nocobase3-pnpm-store-${{ runner.os }}-pnpm${{ steps.pnpm-store.outputs.version }}-${{ hashFiles('source/pnpm-lock.yaml') }}
          restore-keys: nocobase3-pnpm-store-${{ runner.os }}-pnpm${{ steps.pnpm-store.outputs.version }}-
      - name: Verify checkout identity and install source dependencies
        timeout-minutes: 15
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          node ../control/.github/scripts/assert-current-template.mjs packages/templates/app-template-default
          pnpm install --frozen-lockfile
          echo "FACTORY_CREATOR_VERSION=$(node -p 'JSON.parse(require("node:fs").readFileSync("packages/tools/create-app/package.json", "utf8")).version')" >> "$GITHUB_ENV"
      - name: Drop store entries the current lockfile no longer uses
        if: github.event_name != 'pull_request' && steps.pnpm-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        working-directory: source
        run: pnpm store prune
      - name: Save the nocobase3 pnpm store before the loopback registry starts
        if: github.event_name != 'pull_request' && steps.pnpm-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}
      # Usually 5-9 and 2-4 minutes. The limits stop a hung build or registry
      # fetch well before the 90-minute job limit, which would otherwise hold
      # this PR's (or this source SHA's) concurrency group that long.
      - name: Build and publish only to an isolated loopback registry
        working-directory: source
        timeout-minutes: 25
        run: pnpm unreleased:prepare
      - name: Verify an application made from these exact source packages
        working-directory: source
        timeout-minutes: 15
        run: pnpm unreleased:smoke --template default --dialect sqlite --workdir "$RUNNER_TEMP/source-smoke"
      - name: Install browser fonts
        timeout-minutes: 10
        run: bash control/.github/scripts/install-browser-fonts.sh
      # Several CLI commands (90 s each at most in source-config-check.mjs), a
      # startup wait and a real browser login (2 minutes at most). The limit
      # stops a hang outside those bounds well before the 90-minute job limit.
      - name: Verify first configuration, idempotence and real browser login
        timeout-minutes: 15
        run: node control/.github/scripts/source-config-check.mjs "$RUNNER_TEMP/source-smoke/crm" "$RUNNER_TEMP/source-evidence" "$SOURCE_SHA"
      - name: Export only verified package bytes and clean application source
        run: |
          mkdir -p "$RUNNER_TEMP/source-export"
          node control/.github/scripts/source-snapshot.mjs export source "$RUNNER_TEMP/snapshot-packages" "$SOURCE_SHA" "$RUNNER_TEMP/source-smoke/crm"
          tar -czf "$RUNNER_TEMP/source-export/packages.tar.gz" -C "$RUNNER_TEMP/snapshot-packages" manifest.json packages
          node control/.github/scripts/source-candidate.mjs copy "$RUNNER_TEMP/source-smoke/crm" "$RUNNER_TEMP/clean-source-app"
          tar -czf "$RUNNER_TEMP/source-export/application.tar.gz" -C "$RUNNER_TEMP/clean-source-app" .
          cp "$RUNNER_TEMP/snapshot-packages/manifest.json" "$RUNNER_TEMP/source-export/packages.json"
          cd "$RUNNER_TEMP/source-export"
          sha256sum packages.tar.gz application.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: snapshot
        with:
          name: source-packages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-export
          if-no-files-found: error
          retention-days: 14
      - name: Write an explicit source verification receipt
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          mkdir -p "$RUNNER_TEMP/source-evidence"
          node -e 'require("node:fs").writeFileSync(process.argv[1], JSON.stringify({version:1, source:{repository:"nocobase/nocobase3",sha:process.env.SOURCE_SHA}, controlSha:process.env.FACTORY_CONTROL_SHA,runId:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,status:process.env.RESULT,scope:"source registry, create, dev, production archive and first configuration; not business Agent or Hub deployment"},null,2))' "$RUNNER_TEMP/source-evidence/source-run.json"
      - name: Preserve safe evidence, not configuration or registry credentials
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-evidence
          if-no-files-found: error
          retention-days: 14
      - name: Remove this run's registry and its credentials
        # Without a source checkout there is no registry, and this step would
        # only add a second, misleading failure.
        if: always() && steps.source.outcome == 'success'
        working-directory: source
        run: pnpm unreleased:clean

  portable:
    needs: source-baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    env:
      SOURCE_SHA: ${{ needs.source-baseline.outputs.source_sha }}
      FACTORY_CONTROL_SHA: ${{ needs.source-baseline.outputs.control_sha }}
    outputs:
      candidate: ${{ steps.candidate.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source-baseline.outputs.control_sha }}
          path: control
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.source-baseline.outputs.snapshot }}
          merge-multiple: true
          path: ${{ runner.temp }}/portable-input
      - name: Restore the package snapshot on a different clean runner
        run: |
          cd "$RUNNER_TEMP/portable-input"
          sha256sum --check SHA256SUMS
          mkdir -p "$RUNNER_TEMP/portable-registry" "$RUNNER_TEMP/portable-app"
          tar -xzf packages.tar.gz -C "$RUNNER_TEMP/portable-registry"
          tar -xzf application.tar.gz -C "$RUNNER_TEMP/portable-app"
          node "$GITHUB_WORKSPACE/control/.github/scripts/overlay-factory.mjs" "$GITHUB_WORKSPACE/control" "$RUNNER_TEMP/portable-app" "$FACTORY_CONTROL_SHA"
          node "$GITHUB_WORKSPACE/control/.github/scripts/source-snapshot.mjs" start "$RUNNER_TEMP/portable-registry" "$RUNNER_TEMP/portable-app"
          echo "FACTORY_CREATOR_VERSION=$(node -p 'JSON.parse(require("fs").readFileSync("packages.json")).packages.find(p=>p.name==="@nocobase/create-app").version')" >> "$GITHUB_ENV"
      - name: Lock the factory overlay against only the frozen source packages
        timeout-minutes: 15
        working-directory: ${{ runner.temp }}/portable-app
        run: |
          pnpm install --no-frozen-lockfile
          pnpm exec nocobase skills sync
          node "$GITHUB_WORKSPACE/control/.github/scripts/source-candidate.mjs" describe . "$RUNNER_TEMP/source-candidate" "$RUNNER_TEMP/portable-input/packages.tar.gz"
          pnpm exec prettier --write package.json factory-template.json factory-source.json eslint.config.js README.MD
          node "$GITHUB_WORKSPACE/control/.github/scripts/template-guidance.mjs" check .
      - name: Install browser fonts
        timeout-minutes: 10
        run: bash control/.github/scripts/install-browser-fonts.sh
      # The factory checks, `pnpm build`, a clean database and the browser
      # login: 96-162 s in refresh-template, bounded the same way there.
      - name: Verify the restored source as a normal factory application
        timeout-minutes: 20
        run: |
          node control/.github/scripts/create-runtime-config.mjs --output "$RUNNER_TEMP/portable.yml" --database "$RUNNER_TEMP/portable-db/database.sqlite"
          set -o pipefail
          bash control/.github/scripts/verify.sh "$RUNNER_TEMP/portable-app" "$RUNNER_TEMP/portable.yml" "$RUNNER_TEMP/portable-evidence" 2>&1 | tee "$RUNNER_TEMP/portable-verify.log"
          node control/.github/scripts/baseline-record.mjs "$RUNNER_TEMP/portable-app" "$RUNNER_TEMP/portable-evidence/baseline.json" "$SOURCE_SHA"
          node control/.github/scripts/source-candidate.mjs bundle "$RUNNER_TEMP/portable-app" "$RUNNER_TEMP/source-candidate" "$RUNNER_TEMP/portable-input/packages.tar.gz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: candidate
        with:
          name: source-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-candidate
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: source-portability-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/portable-evidence
            ${{ runner.temp }}/portable-verify.log
          retention-days: 14

  # Records that this pull request's inputs passed both jobs, for the lookup in
  # supersede. Only after both: a failed or partial run is checked again.
  # Never turns a verified run red: losing the record only costs a later skip.
  record:
    needs: [supersede, source-baseline, portable]
    if: github.event_name == 'pull_request' && needs.supersede.outputs.inputs != ''
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Name the run that verified these inputs
        run: |
          mkdir -p "$RUNNER_TEMP/source-baseline-verified"
          printf '%s\n' "$GITHUB_RUN_ID" > "$RUNNER_TEMP/source-baseline-verified/run-id"
      - name: Record the verified inputs
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/source-baseline-verified
          key: source-baseline-verified-v1-pr${{ github.event.pull_request.number }}-${{ needs.supersede.outputs.inputs }}

  publish:
    needs: [source-baseline, portable]
    if: github.actor == github.repository_owner && github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      actions: read
    env:
      FACTORY_CONTROL_SHA: ${{ needs.source-baseline.outputs.control_sha }}
      TRACKING_ISSUE: '210'
    steps:
      # Only the control commit (the default depth of one): publishing reads
      # its tree and makes it the parent of the baseline commit; no history is
      # walked. The full history is ~217 MB; at worst the push sends one
      # application tree when the control commit is no longer a branch head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source-baseline.outputs.control_sha }}
          path: control
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.source-baseline.outputs.snapshot }}
          merge-multiple: true
          path: snapshot
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.portable.outputs.candidate }}
          merge-multiple: true
          path: candidate
      - name: Publish only the verified source branch and immutable package archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash control/.github/scripts/publish-source-baseline.sh control candidate snapshot/packages.tar.gz
