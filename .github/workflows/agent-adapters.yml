name: Agent CLI compatibility

on:
  pull_request:
    paths:
      - '.github/scripts/agents/**'
      - '.github/scripts/agent-*.mjs'
      - '.github/scripts/install-agent.mjs'
      - '.github/scripts/run-agent.mjs'
      # Imported by the adapters and runner above.
      - '.github/scripts/acceptance-criteria.mjs'
      - '.github/scripts/factory-lib.mjs'
      - '.github/scripts/history-redaction.mjs'
      - '.github/scripts/task-compat.mjs'
      - '.github/scripts/timing.mjs'
      - '.github/scripts/visual-report.mjs'
      - '.github/scripts/tests/codex-agent.integration.mjs'
      - '.github/workflows/agent-adapters.yml'
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request supersedes its earlier checks. Manual runs always
# finish: a shared group without a queue would let a third dispatch replace a
# pending second one, and queue: max cannot be combined with
# cancel-in-progress, so each of them gets a group of its own.
concurrency:
  group: agent-adapters-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cli-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        engine: [pi, codebuddy, claude-code, codex, opencode]
    env:
      CODE_AGENT_ENGINE: ${{ matrix.engine }}
      # Repository overrides, exactly as build tasks pass them to
      # install-agent.mjs. Changing a variable starts no run by itself: dispatch
      # this workflow after changing a *_VERSION variable to check the override
      # before a build installs it. Each engine reads only its own (Pi also
      # reads CODE_AGENT_VERSION).
      CODE_AGENT_VERSION: ${{ vars.CODE_AGENT_VERSION }}
      PI_VERSION: ${{ vars.PI_VERSION }}
      CODEBUDDY_VERSION: ${{ vars.CODEBUDDY_VERSION }}
      CLAUDE_CODE_VERSION: ${{ vars.CLAUDE_CODE_VERSION }}
      CODEX_VERSION: ${{ vars.CODEX_VERSION }}
      OPENCODE_VERSION: ${{ vars.OPENCODE_VERSION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
      # The npm cache, per engine, in a directory of its own as the task
      # workflow keeps the Agent Browser's (agent-browser-npm-v2-*). Keyed on
      # the adapters, which pin the default versions, and on the overrides, so
      # a version change starts a new entry. Saved only by dispatched runs,
      # which run from the default branch: a pull request's cache would serve
      # that pull request alone. No agent-browser is installed here.
      - name: Restore the Agent CLI npm cache
        id: cli_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/agent-cli-npm
          key: agent-cli-npm-v1-${{ runner.os }}-${{ matrix.engine }}-${{ hashFiles('.github/scripts/agents/**', '.github/scripts/agent-registry.mjs') }}-${{ vars.CODE_AGENT_VERSION }}-${{ vars.PI_VERSION }}-${{ vars.CODEBUDDY_VERSION }}-${{ vars.CLAUDE_CODE_VERSION }}-${{ vars.CODEX_VERSION }}-${{ vars.OPENCODE_VERSION }}
      - name: Install and verify the pinned CLI
        timeout-minutes: 5
        env:
          npm_config_cache: ${{ runner.temp }}/agent-cli-npm
          npm_config_prefer_offline: 'true'
        run: node .github/scripts/install-agent.mjs
      - name: Save the Agent CLI npm cache
        if: github.event_name != 'pull_request' && steps.cli_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/agent-cli-npm
          key: ${{ steps.cli_cache.outputs.cache-primary-key }}
      - name: Check headless CLI flags without calling a model
        run: node .github/scripts/agent-cli-smoke.mjs
      - name: Run real Codex in a non-Git QA workspace against a local Responses fixture
        if: matrix.engine == 'codex'
        run: node --test .github/scripts/tests/codex-agent.integration.mjs
