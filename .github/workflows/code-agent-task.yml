name: Code Agent NocoBase Task
run-name: "Factory issue #${{ github.event.issue.number || github.event.client_payload.issue_number || inputs.issue_number }} build ${{ github.event.client_payload.build_comment_id || '0' }} from ${{ github.event.client_payload.previous_run_id || inputs.recovery_run_id || '0' }}${{ inputs.external_run_id && format(' request {0}', inputs.external_run_id) || '' }}"

on:
  issues:
    types: [opened, reopened]
  repository_dispatch:
    types: [code-agent-task, code-agent-continue]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to run (closed external submissions are supported)
        required: true
        type: number
      # factory:external-closed-v1: explicit external runs use archived Issues.
      external_run_id:
        description: External system request identity for dispatch reconciliation
        required: false
        type: string
      failure_smoke:
        description: Maintainer-only controlled failure using the pinned counter fixture (no model or QA)
        required: false
        default: false
        type: boolean
      recovery_run_id:
        description: Recover a failed run's saved work (blank starts a normal build)
        required: false
        type: string
      recovery_base_sha:
        description: Original application base SHA (required only for legacy checkpoints)
        required: false
        type: string

env:
  # Only the public Agent settings agent-configuration.mjs reads. Never pass
  # the whole vars context: each step prints its env in the public log, so
  # every repository variable would reach every step, model runs included.
  FACTORY_AGENT_CONFIG_JSON: >-
    {
    "CODE_AGENT_ENGINE": ${{ toJSON(vars.CODE_AGENT_ENGINE) }},
    "CODE_AGENT_VERSION": ${{ toJSON(vars.CODE_AGENT_VERSION) }},
    "PI_VERSION": ${{ toJSON(vars.PI_VERSION) }},
    "CODEBUDDY_VERSION": ${{ toJSON(vars.CODEBUDDY_VERSION) }},
    "CLAUDE_CODE_VERSION": ${{ toJSON(vars.CLAUDE_CODE_VERSION) }},
    "CODEX_VERSION": ${{ toJSON(vars.CODEX_VERSION) }},
    "OPENCODE_VERSION": ${{ toJSON(vars.OPENCODE_VERSION) }},
    "CODE_AGENT_MODEL": ${{ toJSON(vars.CODE_AGENT_MODEL) }},
    "PI_MODEL": ${{ toJSON(vars.PI_MODEL) }},
    "CODEBUDDY_MODEL": ${{ toJSON(vars.CODEBUDDY_MODEL) }},
    "CLAUDE_CODE_MODEL": ${{ toJSON(vars.CLAUDE_CODE_MODEL) }},
    "CODEX_MODEL": ${{ toJSON(vars.CODEX_MODEL) }},
    "OPENCODE_MODEL": ${{ toJSON(vars.OPENCODE_MODEL) }},
    "CODE_AGENT_API_TYPE": ${{ toJSON(vars.CODE_AGENT_API_TYPE) }},
    "PI_API_TYPE": ${{ toJSON(vars.PI_API_TYPE) }},
    "CODE_AGENT_THINKING": ${{ toJSON(vars.CODE_AGENT_THINKING) }},
    "PI_THINKING": ${{ toJSON(vars.PI_THINKING) }},
    "CODEBUDDY_THINKING": ${{ toJSON(vars.CODEBUDDY_THINKING) }},
    "CODE_AGENT_AUTH_HEADER": ${{ toJSON(vars.CODE_AGENT_AUTH_HEADER) }},
    "PI_AUTH_HEADER": ${{ toJSON(vars.PI_AUTH_HEADER) }},
    "CODE_AGENT_SUPPORTS_DEVELOPER_ROLE": ${{ toJSON(vars.CODE_AGENT_SUPPORTS_DEVELOPER_ROLE) }},
    "PI_SUPPORTS_DEVELOPER_ROLE": ${{ toJSON(vars.PI_SUPPORTS_DEVELOPER_ROLE) }},
    "CODE_AGENT_SUPPORTS_REASONING_EFFORT": ${{ toJSON(vars.CODE_AGENT_SUPPORTS_REASONING_EFFORT) }},
    "PI_SUPPORTS_REASONING_EFFORT": ${{ toJSON(vars.PI_SUPPORTS_REASONING_EFFORT) }},
    "CODE_AGENT_MODEL_REASONING": ${{ toJSON(vars.CODE_AGENT_MODEL_REASONING) }},
    "CODE_AGENT_INVOCATION_TIMEOUT_SECONDS": ${{ toJSON(vars.CODE_AGENT_INVOCATION_TIMEOUT_SECONDS) }},
    "PI_INVOCATION_TIMEOUT_SECONDS": ${{ toJSON(vars.PI_INVOCATION_TIMEOUT_SECONDS) }},
    "CODE_AGENT_IDLE_TIMEOUT_SECONDS": ${{ toJSON(vars.CODE_AGENT_IDLE_TIMEOUT_SECONDS) }},
    "CLAUDE_CODE_EFFORT": ${{ toJSON(vars.CLAUDE_CODE_EFFORT) }},
    "CLAUDE_CODE_QA_EFFORT": ${{ toJSON(vars.CLAUDE_CODE_QA_EFFORT) }},
    "CODEX_REASONING_EFFORT": ${{ toJSON(vars.CODEX_REASONING_EFFORT) }},
    "CODEX_QA_REASONING_EFFORT": ${{ toJSON(vars.CODEX_QA_REASONING_EFFORT) }},
    "OPENCODE_VARIANT": ${{ toJSON(vars.OPENCODE_VARIANT) }},
    "OPENCODE_QA_VARIANT": ${{ toJSON(vars.OPENCODE_QA_VARIANT) }},
    "CODEBUDDY_BASE_URL": ${{ toJSON(vars.CODEBUDDY_BASE_URL) }},
    "CODEBUDDY_INTERNET_ENVIRONMENT": ${{ toJSON(vars.CODEBUDDY_INTERNET_ENVIRONMENT) }},
    "ANTHROPIC_BASE_URL": ${{ toJSON(vars.ANTHROPIC_BASE_URL) }},
    "CODEX_BASE_URL": ${{ toJSON(vars.CODEX_BASE_URL) }},
    "OPENCODE_BASE_URL": ${{ toJSON(vars.OPENCODE_BASE_URL) }},
    "CODE_AGENT_PROVIDER_ID": ${{ toJSON(vars.CODE_AGENT_PROVIDER_ID) }},
    "FACTORY_QA_THINKING": ${{ toJSON(vars.FACTORY_QA_THINKING) }},
    "FACTORY_REVIEW_THINKING": ${{ toJSON(vars.FACTORY_REVIEW_THINKING) }},
    "FACTORY_BUILD_REVIEW": ${{ toJSON(vars.FACTORY_BUILD_REVIEW) }},
    "FACTORY_BUILD_REVIEW_TIMEOUT_SECONDS": ${{ toJSON(vars.FACTORY_BUILD_REVIEW_TIMEOUT_SECONDS) }},
    "FACTORY_BUILD_REVIEW_IDLE_TIMEOUT_SECONDS": ${{ toJSON(vars.FACTORY_BUILD_REVIEW_IDLE_TIMEOUT_SECONDS) }},
    "AGENT_BROWSER_VERSION": ${{ toJSON(vars.AGENT_BROWSER_VERSION) }}
    }

permissions: {}

# Retries and cross-run handoffs for one Issue must stay serialized, but
# independent application tasks should not block each other.
concurrency:
  group: code-agent-task-${{ github.event.issue.number || github.event.client_payload.issue_number || inputs.issue_number || github.run_id }}
  queue: max

jobs:
  prepare:
    # External task managers save an Issue snapshot, then explicitly dispatch.
    # Read the event's labels so a later Issue update cannot create a second run.
    # The repository is public: an Issue only starts a model run when its author
    # has repository access. Maintainers can still dispatch any Issue manually.
    if: >-
      github.event_name != 'issues' ||
      (!contains(github.event.issue.labels.*.name, 'factory:external') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: read
    outputs:
      control_sha: ${{ steps.baseline.outputs.sha }}
      status: ${{ steps.prepare.outputs.status }}
      build_comment_id: ${{ steps.prepare.outputs.build_comment_id }}
      comment_kind: ${{ steps.prepare.outputs.comment_kind }}
      issue_number: ${{ steps.prepare.outputs.issue_number }}
      target_branch: ${{ steps.prepare.outputs.target_branch }}
      work_branch: ${{ steps.prepare.outputs.work_branch }}
      default_branch: ${{ steps.prepare.outputs.default_branch }}
      base_ref: ${{ steps.prepare.outputs.base_ref }}
      base_sha: ${{ steps.prepare.outputs.base_sha }}
      evaluation_sample: ${{ steps.prepare.outputs.evaluation_sample }}
    steps:
      # repository_dispatch loads the entry workflow from the default branch.
      # Only this small handoff protocol follows that revision; task code is pinned.
      - name: Check out handoff bootstrap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: bootstrap
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/handoff.mjs
            /.github/scripts/handoff-control.mjs
            /.github/scripts/handoff-recovery.mjs
            /.github/scripts/pipeline-state.mjs
            /.github/scripts/task-policy.mjs
            /.github/scripts/acceptance-criteria.mjs
            /.github/scripts/review-history.mjs
            /.github/scripts/history-redaction.mjs
            /.github/scripts/evaluation-sample.mjs
          persist-credentials: false

      - name: Download source task control pin
        if: (github.event_name == 'repository_dispatch' && github.event.action == 'code-agent-continue') || inputs.recovery_run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: factory-task-${{ inputs.recovery_run_id != '' && inputs.issue_number || github.event.client_payload.issue_number }}
          path: previous-task
          run-id: ${{ inputs.recovery_run_id || github.event.client_payload.previous_run_id }}
          github-token: ${{ github.token }}

      # New continuations carry a SHA bound to the small source task artifact:
      # do not download the large checkpoint twice per run.
      # This one-time fallback adopts pre-pin tasks.
      - name: Download legacy handoff control metadata
        if: github.event_name == 'repository_dispatch' && github.event.action == 'code-agent-continue' && !github.event.client_payload.control_sha
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: factory-handoff-${{ github.event.client_payload.issue_number }}
          path: legacy-handoff
          run-id: ${{ github.event.client_payload.previous_run_id }}
          github-token: ${{ github.token }}

      - name: Download failed-run checkpoint
        if: inputs.recovery_run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: factory-handoff-${{ inputs.issue_number }}
          path: recovery
          run-id: ${{ inputs.recovery_run_id }}
          github-token: ${{ github.token }}

      - name: Validate and normalize explicit recovery
        id: recovery
        if: inputs.recovery_run_id != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node bootstrap/.github/scripts/handoff-recovery.mjs normalize \
            --event "$GITHUB_EVENT_PATH" --task previous-task/task-metadata.json \
            --checkpoint recovery --output "$GITHUB_OUTPUT"

      # An evaluation-batch sample starts on its batch's frozen control plane,
      # proven by bot receipts and the checksummed batch manifest (not by any
      # dispatch field). Ordinary Issues output nothing and keep the default.
      - name: Resolve a frozen evaluation sample control plane
        id: sample
        if: github.event.action != 'code-agent-continue' && inputs.recovery_run_id == ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SAMPLE_ISSUE: ${{ github.event.issue.number || github.event.client_payload.issue_number || inputs.issue_number }}
        run: node bootstrap/.github/scripts/evaluation-sample.mjs pin --issue "$SAMPLE_ISSUE" --output "$GITHUB_OUTPUT"

      - name: Pin the task chain's control plane
        id: baseline
        env:
          SAMPLE_CONTROL_SHA: ${{ steps.sample.outputs.control_sha }}
        run: |
          node bootstrap/.github/scripts/handoff-control.mjs resolve \
            --event "${{ steps.recovery.outputs.event_path || github.event_path }}" \
            --current-sha "${SAMPLE_CONTROL_SHA:-$(git -C bootstrap rev-parse HEAD)}" \
            --checkpoint "${{ inputs.recovery_run_id != '' && 'recovery' || 'legacy-handoff' }}" \
            --previous-task previous-task/task-metadata.json \
            --output "$GITHUB_OUTPUT"

      - name: Check out factory control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.baseline.outputs.sha }}
          path: control
          persist-credentials: false

      - name: Validate explicit failure smoke request
        if: inputs.failure_smoke == true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node control/.github/scripts/failure-smoke.mjs validate

      - name: Resolve Issue and target branch
        id: prepare
        env:
          FACTORY_CONTROL_SHA: ${{ steps.baseline.outputs.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node control/.github/scripts/prepare-task.mjs \
            --event "${{ steps.recovery.outputs.event_path || github.event_path }}" \
            --metadata "$RUNNER_TEMP/task-metadata.json" \
            --output "$GITHUB_OUTPUT"

      - name: Reject changed recovery input or application base
        if: inputs.recovery_run_id != '' && steps.prepare.outputs.status == 'ready'
        env:
          BASE_REF: ${{ steps.prepare.outputs.base_ref }}
          BASE_SHA: ${{ steps.prepare.outputs.base_sha }}
        run: |
          node bootstrap/.github/scripts/handoff-recovery.mjs check-base \
            --checkpoint recovery --metadata "$RUNNER_TEMP/task-metadata.json" \
            --base-ref "$BASE_REF" --base-sha "$BASE_SHA"

      - name: Save normalized recovery checkpoint
        if: inputs.recovery_run_id != '' && steps.prepare.outputs.status == 'ready'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: factory-recovery-${{ steps.prepare.outputs.issue_number }}
          path: recovery
          if-no-files-found: error
          retention-days: 14

      # Use the bootstrap even when an older pinned prepare-task predates this
      # field, so its next continuation can use the small artifact as provenance.
      - name: Record the task chain control pin
        if: steps.prepare.outputs.status == 'ready'
        env:
          FACTORY_CONTROL_SHA: ${{ steps.baseline.outputs.sha }}
          FACTORY_ENTRY_SHA: ${{ github.sha }}
          FACTORY_APPLICATION_BASE_REF: ${{ steps.prepare.outputs.base_ref }}
          FACTORY_APPLICATION_BASE_SHA: ${{ steps.prepare.outputs.base_sha }}
        run: node bootstrap/.github/scripts/handoff-control.mjs record --metadata "$RUNNER_TEMP/task-metadata.json"

      - name: Save normalized task metadata
        if: steps.prepare.outputs.status == 'ready'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: factory-task-${{ steps.prepare.outputs.issue_number }}
          path: ${{ runner.temp }}/task-metadata.json
          if-no-files-found: error
          retention-days: 14

      # prepare-task.mjs has already set agent:running once status is ready,
      # and report-failure is skipped when this job fails, so any later
      # failure here (a rejected recovery, a failed artifact upload) must
      # clear the label itself. Replies never set it.
      - name: Report a failure after task preparation
        if: failure() && steps.prepare.outputs.status == 'ready' && steps.prepare.outputs.comment_kind != 'reply'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node control/.github/scripts/mark-failure.mjs "${{ steps.prepare.outputs.issue_number }}"

  agent:
    needs: prepare
    env:
      FACTORY_CONTROL_SHA: ${{ needs.prepare.outputs.control_sha }}
      FACTORY_TASK_CONTINUATION: ${{ github.event.client_payload.continuation || '0' }}
      FACTORY_QA_THINKING: ${{ vars.FACTORY_QA_THINKING }}
      FACTORY_BUILD_REVIEW: ${{ vars.FACTORY_BUILD_REVIEW || 'full' }}
      FACTORY_REVIEW_THINKING: ${{ vars.FACTORY_REVIEW_THINKING || 'medium' }}
      FACTORY_BUILD_REVIEW_TIMEOUT_SECONDS: ${{ vars.FACTORY_BUILD_REVIEW_TIMEOUT_SECONDS || '3600' }}
      FACTORY_BUILD_REVIEW_IDLE_TIMEOUT_SECONDS: ${{ vars.FACTORY_BUILD_REVIEW_IDLE_TIMEOUT_SECONDS || '600' }}
      CODE_AGENT_ENGINE: ${{ vars.CODE_AGENT_ENGINE }}
    if: needs.prepare.outputs.status == 'ready' && needs.prepare.outputs.comment_kind != 'reply'
    runs-on: ubuntu-24.04
    # GitHub-hosted runners allow at most six hours per job. The factory uses
    # five hours as a soft runner budget, then checkpoints and continues in a
    # new run at most once. Task-wide repair/failure counters survive Handoff.
    timeout-minutes: 360
    permissions:
      actions: read
      contents: write
      # Read-only: re-checks a batch sample's live state before any model call.
      issues: read
    outputs:
      handoff: ${{ steps.outcome.outputs.handoff }}
      timed_out: ${{ steps.outcome.outputs.timed_out }}
      checkpoint_available: ${{ steps.checkpoint.outcome == 'success' }}
      patch_available: ${{ steps.patch.outcome == 'success' }}
    steps:
      - name: Check out factory control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.control_sha }}
          path: control
          persist-credentials: false

      # Keep the handoff protocol available even when the pinned task scripts
      # predate control_sha propagation. Never use this checkout for task code.
      - name: Check out handoff bootstrap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: bootstrap
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/handoff.mjs
            /.github/scripts/handoff-control.mjs
            /.github/scripts/handoff-recovery.mjs
            /.github/scripts/pipeline-state.mjs
            /.github/scripts/task-policy.mjs
            /.github/scripts/acceptance-criteria.mjs
            /.github/scripts/review-history.mjs
            /.github/scripts/history-redaction.mjs
          persist-credentials: false

      - name: Start five-hour runner budget
        run: |
          echo "FACTORY_JOB_STARTED_EPOCH_SECONDS=$(date +%s)" >> "$GITHUB_ENV"
          echo "FACTORY_RUN_DEADLINE_EPOCH_SECONDS=$(($(date +%s) + 18000 - 120))" >> "$GITHUB_ENV"
          echo "FACTORY_TIMINGS_FILE=$RUNNER_TEMP/agent-artifacts/timings.jsonl" >> "$GITHUB_ENV"

      # Only the Agent sees full history: it may read `git log` to locate how the
      # template and earlier task rounds changed a file. Later jobs apply the
      # sealed patch to the base tree and check out a single commit.
      - name: Check out application base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          path: workspace
          fetch-depth: 0
          persist-credentials: false

      - name: Download handoff checkpoint
        if: github.event_name == 'repository_dispatch' && github.event.action == 'code-agent-continue'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: factory-handoff-${{ needs.prepare.outputs.issue_number }}
          path: handoff
          run-id: ${{ github.event.client_payload.previous_run_id }}
          github-token: ${{ github.token }}

      - name: Download normalized recovery checkpoint
        if: inputs.recovery_run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: factory-recovery-${{ needs.prepare.outputs.issue_number }}
          path: handoff

      - name: Verify the pinned handoff control plane
        if: (github.event_name == 'repository_dispatch' && github.event.action == 'code-agent-continue') || inputs.recovery_run_id != ''
        run: |
          node bootstrap/.github/scripts/handoff-control.mjs verify \
            --event "${{ inputs.recovery_run_id != '' && 'handoff/task-event.json' || github.event_path }}" --checkpoint handoff

      - name: Restore handoff checkpoint
        if: (github.event_name == 'repository_dispatch' && github.event.action == 'code-agent-continue') || inputs.recovery_run_id != ''
        run: |
          node control/.github/scripts/apply-patch.mjs \
            --workspace workspace \
            --patch handoff/agent.patch \
            --branch "${{ needs.prepare.outputs.work_branch }}"
          # Restore retrospective only here; stage state is validated after task download.
          mkdir -p "$RUNNER_TEMP/agent-artifacts"
          if [[ -f handoff/retro.json && ! -L handoff/retro.json ]]; then
            cp handoff/retro.json "$RUNNER_TEMP/agent-artifacts/retro.json"
          fi

      - name: Download normalized task
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: factory-task-${{ needs.prepare.outputs.issue_number }}
          path: task

      # "Re-run failed jobs" reuses prepare's outputs, so a batch sample is admitted
      # again here: a cancelled/released sample or a spent budget starts no model.
      - name: Admit the evaluation sample for this execution
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [[ -f control/.github/scripts/evaluation-sample.mjs ]]; then
            node control/.github/scripts/evaluation-sample.mjs admit --metadata task/task-metadata.json --output "$GITHUB_ENV"
          fi

      - name: Restore pipeline progress
        id: resume
        env:
          CONTINUATION_RUN: ${{ (github.event_name == 'repository_dispatch' && github.event.action == 'code-agent-continue') || inputs.recovery_run_id != '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/agent-artifacts"
          if [[ "$CONTINUATION_RUN" == true ]]; then
            node control/.github/scripts/pipeline-state.mjs restore handoff "$RUNNER_TEMP/agent-artifacts" task/task-metadata.json
          else
            node control/.github/scripts/pipeline-state.mjs init "$RUNNER_TEMP/agent-artifacts/pipeline-state.json" task/task-metadata.json
          fi
          echo "phase=$(node control/.github/scripts/pipeline-state.mjs phase "$RUNNER_TEMP/agent-artifacts/pipeline-state.json")" >> "$GITHUB_OUTPUT"

      - name: Check independent evaluation prerequisites before model work
        env:
          FACTORY_TEST_API_KEY_PRESENT: ${{ secrets.FACTORY_TEST_API_KEY != '' }}
          FACTORY_TEST_ADMIN_KEY_PRESENT: ${{ secrets.FACTORY_TEST_ADMIN_KEY != '' }}
          FACTORY_BUSINESS_MODEL_PRESENT: ${{ vars.FACTORY_BUSINESS_MODEL != '' }}
          FACTORY_BUSINESS_API_KEY_PRESENT: ${{ secrets.FACTORY_BUSINESS_API_KEY != '' }}
          FACTORY_BUSINESS_MODEL_ENDPOINT_PRESENT: ${{ vars.FACTORY_BUSINESS_MODEL_ENDPOINT != '' }}
          FACTORY_TEST_CHANNEL_PRESENT: ${{ vars.FACTORY_TEST_CHANNEL != '' }}
          FACTORY_TEST_RECEIVER_URL_PRESENT: ${{ vars.FACTORY_TEST_RECEIVER_URL != '' }}
        run: |
          if [[ -f control/.github/scripts/required-checks.mjs ]]; then
            node control/.github/scripts/required-checks.mjs preflight task/task-metadata.json "$RUNNER_TEMP/agent-artifacts/required-checks.preflight.json" || {
              status=$?
              node control/.github/scripts/pipeline-state.mjs outcome "$RUNNER_TEMP/agent-artifacts/pipeline-state.json" blocked
              exit "$status"
            }
          fi

      # Every task is bounded; a batch plan can tighten the factory ceilings.
      - name: Apply the task and evaluation budgets
        run: |
          if [[ -f control/.github/scripts/evaluation-budget.mjs ]]; then
            node control/.github/scripts/evaluation-budget.mjs deadline "$RUNNER_TEMP/agent-artifacts/pipeline-state.json" >> "$GITHUB_ENV"
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          # Source tarballs use an isolated local store, not the shared registry cache.
          # Check the already checked-out descriptor before setup-node arms its post step.
          cache: ${{ hashFiles('workspace/factory-source.json') == '' && 'pnpm' || '' }}
          cache-dependency-path: workspace/pnpm-lock.yaml

      # The official CLI installs dist/ as its own pnpm root, which never reads the
      # application's .npmrc, and pnpm 11 ignores scoped registries passed in
      # the environment. Only the user-level file reaches that nested install.
      - name: Expose the factory registry to nested pnpm roots
        run: cat control/.npmrc >> ~/.npmrc

      - name: Install Chinese browser fonts
        timeout-minutes: 10
        run: bash control/.github/scripts/install-browser-fonts.sh

      - name: Restore the selected source baseline packages
        run: |
          if [[ -f control/.github/scripts/source-snapshot.mjs ]]; then
            node control/.github/scripts/source-snapshot.mjs restore workspace task/task-metadata.json
          elif [[ -f workspace/factory-source.json ]]; then
            echo "Pinned control plane cannot restore the selected source baseline." >&2
            exit 1
          fi

      - name: Install application dependencies
        timeout-minutes: 15
        working-directory: workspace
        run: |
          node ../control/.github/scripts/assert-current-template.mjs .
          node ../control/.github/scripts/timed-command.mjs install pnpm install --frozen-lockfile
          node ../control/.github/scripts/timed-command.mjs skills-sync pnpm exec nocobase skills sync

      - name: Capture the actual installed package and Skill baseline
        run: |
          if [[ -f control/.github/scripts/baseline-record.mjs ]]; then
            node control/.github/scripts/baseline-record.mjs workspace "$RUNNER_TEMP/agent-artifacts/baseline.json"
          fi

      - name: Build the implementation prompt
        run: |
          mkdir -p "$RUNNER_TEMP/agent-artifacts"
          cp task/task-metadata.json "$RUNNER_TEMP/agent-artifacts/task-metadata.json"
          node control/.github/scripts/build-prompt.mjs \
            --metadata task/task-metadata.json \
            --template control/.github/prompts/implement.md \
            --retro-path "$RUNNER_TEMP/agent-artifacts/retro.json" \
            --output "$RUNNER_TEMP/implement.md"

      - name: Explain restored work without exposing QA context
        if: inputs.recovery_run_id != '' && steps.resume.outputs.phase == 'implementation'
        run: node bootstrap/.github/scripts/handoff-recovery.mjs context --checkpoint handoff --prompt "$RUNNER_TEMP/implement.md"

      - name: Install pinned Code Agent
        timeout-minutes: 10
        if: inputs.failure_smoke != true
        env: &agent-install-env
          CODE_AGENT_ENGINE: ${{ vars.CODE_AGENT_ENGINE }}
          CODE_AGENT_VERSION: ${{ vars.CODE_AGENT_VERSION }}
          PI_VERSION: ${{ vars.PI_VERSION }}
          CODEBUDDY_VERSION: ${{ vars.CODEBUDDY_VERSION }}
          CLAUDE_CODE_VERSION: ${{ vars.CLAUDE_CODE_VERSION }}
          CODEX_VERSION: ${{ vars.CODEX_VERSION }}
          OPENCODE_VERSION: ${{ vars.OPENCODE_VERSION }}
          FACTORY_AGENT_INSTALL_RECORD: ${{ runner.temp }}/agent-install.json
        run: node control/.github/scripts/install-agent.mjs

      # The npm cache is restored and saved again here, before any model call,
      # so what the model does to the runner never reaches a later run's cache.
      - name: Restore the Agent Browser npm cache
        id: browser_cache
        if: inputs.failure_smoke != true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: agent-browser-npm-${{ runner.os }}-${{ vars.AGENT_BROWSER_VERSION || '0.36.0' }}

      - name: Install pinned Agent Browser
        timeout-minutes: 10
        if: inputs.failure_smoke != true
        env:
          AGENT_BROWSER_VERSION: ${{ vars.AGENT_BROWSER_VERSION || '0.36.0' }}
        run: |
          npm install --global --prefer-offline "agent-browser@${AGENT_BROWSER_VERSION}"
          agent-browser --version

      - name: Save the Agent Browser npm cache
        if: inputs.failure_smoke != true && steps.browser_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ steps.browser_cache.outputs.cache-primary-key }}

      - name: Install optional video encoder
        if: inputs.failure_smoke != true
        continue-on-error: true
        timeout-minutes: 5
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=30
            sudo apt-get install --yes --no-install-recommends ffmpeg
          fi

      - name: Prepare and validate browser environment
        if: inputs.failure_smoke != true
        run: |
          mkdir -p "$RUNNER_TEMP/agent-artifacts/browser-environment"
          export AGENT_BROWSER_EXECUTABLE_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          python3 control/.github/scripts/prepare-browser-fixtures.py "$RUNNER_TEMP/agent-artifacts/browser-environment/fixtures"
          node control/.github/scripts/browser-preflight.mjs "$RUNNER_TEMP/agent-artifacts/browser-environment/preflight.json"
          echo "AGENT_BROWSER_EXECUTABLE_PATH=$AGENT_BROWSER_EXECUTABLE_PATH" >> "$GITHUB_ENV"
          echo "FACTORY_BROWSER_PREFLIGHT=$RUNNER_TEMP/agent-artifacts/browser-environment/preflight.json" >> "$GITHUB_ENV"
          echo "FACTORY_BROWSER_FIXTURES_MANIFEST=$RUNNER_TEMP/agent-artifacts/browser-environment/fixtures/manifest.json" >> "$GITHUB_ENV"

      - name: Start live progress observer
        if: inputs.failure_smoke != true
        continue-on-error: true
        env:
          # The observer starts before model credentials exist. It can dispatch
          # snapshots, but only the independent reporter can write Issue comments.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          nohup node control/.github/scripts/task-progress.mjs watch \
            "$RUNNER_TEMP/agent-artifacts" task/task-metadata.json \
            >"$RUNNER_TEMP/agent-artifacts/live-progress.log" 2>&1 < /dev/null &

      - name: Run Code Agent implementation
        id: implementation
        if: >-
          inputs.failure_smoke != true && (
          ((needs.prepare.outputs.base_ref != needs.prepare.outputs.work_branch || needs.prepare.outputs.build_comment_id != '') &&
          !(github.event_name == 'repository_dispatch' && github.event.action == 'code-agent-continue') && inputs.recovery_run_id == '') ||
          steps.resume.outputs.phase == 'implementation')
        env: &agent-run-env
          CODE_AGENT_ENGINE: ${{ vars.CODE_AGENT_ENGINE }}
          FACTORY_AGENT_INSTALL_RECORD: ${{ runner.temp }}/agent-install.json
          # Compatibility bridge for older pinned control code (before the shared normalizer).
          # Explicit engine selection; adding a CLI must not fall through to Pi.
          # This mapping is shared by implementation, repair/QA, and comment reply.
          CODE_AGENT_API_ENDPOINT: ${{ (vars.CODE_AGENT_ENGINE == '' || vars.CODE_AGENT_ENGINE == 'pi') && (secrets.CODE_AGENT_API_ENDPOINT || secrets.PI_API_ENDPOINT) || '' }}
          CODE_AGENT_API_KEY: ${{ (vars.CODE_AGENT_ENGINE == '' || vars.CODE_AGENT_ENGINE == 'pi') && (secrets.CODE_AGENT_API_KEY || secrets.PI_API_KEY) || '' }}
          CODEBUDDY_AUTH_TOKEN: ${{ vars.CODE_AGENT_ENGINE == 'codebuddy' && secrets.CODEBUDDY_AUTH_TOKEN || '' }}
          CODEBUDDY_API_KEY: ${{ vars.CODE_AGENT_ENGINE == 'codebuddy' && secrets.CODEBUDDY_API_KEY || '' }}
          CODEBUDDY_MODEL: ${{ vars.CODE_AGENT_ENGINE == 'codebuddy' && vars.CODEBUDDY_MODEL || '' }}
          CODEBUDDY_THINKING: ${{ vars.CODEBUDDY_THINKING || 'max' }}
          CODEBUDDY_BASE_URL: ${{ vars.CODE_AGENT_ENGINE == 'codebuddy' && vars.CODEBUDDY_BASE_URL || '' }}
          CODEBUDDY_INTERNET_ENVIRONMENT: ${{ vars.CODE_AGENT_ENGINE == 'codebuddy' && vars.CODEBUDDY_INTERNET_ENVIRONMENT || '' }}
          CODE_AGENT_API_TYPE: ${{ vars.CODE_AGENT_API_TYPE || vars.PI_API_TYPE || 'openai-completions' }}
          CODE_AGENT_MODEL: ${{ vars.CODE_AGENT_MODEL || vars.PI_MODEL }}
          CODE_AGENT_THINKING: ${{ vars.CODE_AGENT_THINKING || vars.PI_THINKING || 'max' }}
          CODE_AGENT_AUTH_HEADER: ${{ vars.CODE_AGENT_AUTH_HEADER || vars.PI_AUTH_HEADER || 'true' }}
          CODE_AGENT_SUPPORTS_DEVELOPER_ROLE: ${{ vars.CODE_AGENT_SUPPORTS_DEVELOPER_ROLE || vars.PI_SUPPORTS_DEVELOPER_ROLE }}
          CODE_AGENT_SUPPORTS_REASONING_EFFORT: ${{ vars.CODE_AGENT_SUPPORTS_REASONING_EFFORT || vars.PI_SUPPORTS_REASONING_EFFORT || 'true' }}
          CODE_AGENT_INVOCATION_TIMEOUT_SECONDS: ${{ vars.CODE_AGENT_INVOCATION_TIMEOUT_SECONDS || vars.PI_INVOCATION_TIMEOUT_SECONDS || '0' }}
          ANTHROPIC_API_KEY: ${{ vars.CODE_AGENT_ENGINE == 'claude-code' && secrets.ANTHROPIC_API_KEY || '' }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ vars.CODE_AGENT_ENGINE == 'claude-code' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          ANTHROPIC_BASE_URL: ${{ vars.CODE_AGENT_ENGINE == 'claude-code' && vars.ANTHROPIC_BASE_URL || '' }}
          CLAUDE_CODE_MODEL: ${{ vars.CLAUDE_CODE_MODEL }}
          CLAUDE_CODE_EFFORT: ${{ vars.CLAUDE_CODE_EFFORT }}
          CLAUDE_CODE_QA_EFFORT: ${{ vars.CLAUDE_CODE_QA_EFFORT }}
          CODEX_API_KEY: ${{ vars.CODE_AGENT_ENGINE == 'codex' && secrets.CODEX_API_KEY || '' }}
          CODEX_MODEL: ${{ vars.CODEX_MODEL }}
          CODEX_BASE_URL: ${{ vars.CODE_AGENT_ENGINE == 'codex' && vars.CODEX_BASE_URL || '' }}
          CODEX_REASONING_EFFORT: ${{ vars.CODEX_REASONING_EFFORT }}
          CODEX_QA_REASONING_EFFORT: ${{ vars.CODEX_QA_REASONING_EFFORT }}
          OPENCODE_API_KEY: ${{ vars.CODE_AGENT_ENGINE == 'opencode' && secrets.OPENCODE_API_KEY || '' }}
          OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL }}
          OPENCODE_BASE_URL: ${{ vars.CODE_AGENT_ENGINE == 'opencode' && vars.OPENCODE_BASE_URL || '' }}
          OPENCODE_VARIANT: ${{ vars.OPENCODE_VARIANT }}
          OPENCODE_QA_VARIANT: ${{ vars.OPENCODE_QA_VARIANT }}
          CODE_AGENT_IDLE_TIMEOUT_SECONDS: ${{ vars.CODE_AGENT_IDLE_TIMEOUT_SECONDS }}
        run: |
          node control/.github/scripts/pipeline-state.mjs set "$RUNNER_TEMP/agent-artifacts/pipeline-state.json" implementation
          set +e
          node control/.github/scripts/pipeline-state.mjs budget "$RUNNER_TEMP/agent-artifacts/pipeline-state.json" implementation
          status=$?
          if [[ "$status" -eq 0 ]]; then
            node control/.github/scripts/run-agent.mjs \
              --workspace workspace \
              --prompt "$RUNNER_TEMP/implement.md" \
              --log "$RUNNER_TEMP/agent-artifacts/agent-implement.jsonl" \
              --agentDir "$RUNNER_TEMP/code-agent"
            status=$?
          fi
          if [[ "$status" -eq 75 ]]; then
            if [[ -f control/.github/scripts/task-policy.mjs ]]; then
              node control/.github/scripts/pipeline-state.mjs handoff "$RUNNER_TEMP/agent-artifacts/pipeline-state.json"
              status=$?
            else
              # Older tasks keep their pinned control API; bootstrap still bounds dispatch.
              node control/.github/scripts/pipeline-state.mjs outcome "$RUNNER_TEMP/agent-artifacts/pipeline-state.json" handoff
            fi
          fi
          set -e
          if [[ "$status" -eq 75 ]]; then
            echo "handoff=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$status" -ne 0 && "$status" -ne 76 ]]; then
            node control/.github/scripts/pipeline-state.mjs outcome "$RUNNER_TEMP/agent-artifacts/pipeline-state.json" failed
          fi
          if [[ "$status" -eq 0 ]]; then
            node control/.github/scripts/pipeline-state.mjs set "$RUNNER_TEMP/agent-artifacts/pipeline-state.json" verify
          fi
          exit "$status"

      - name: Verify and repair within task limits
        id: verify
        if: inputs.failure_smoke != true && steps.implementation.outputs.handoff != 'true'
        env: *agent-run-env
        run: |
          set +e
          control/.github/scripts/verify-and-repair.sh \
            control \
            workspace \
            "$RUNNER_TEMP/implement.md" \
            task/task-metadata.json \
            "$RUNNER_TEMP/agent-artifacts" \
            "$RUNNER_TEMP/repair-state"
          status=$?
          set -e
          if [[ "$status" -eq 75 ]]; then
            echo "handoff=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$status"

      - name: Inject disclosed failure before business QA
        id: failure_smoke
        if: inputs.failure_smoke == true
        run: node control/.github/scripts/failure-smoke.mjs inject workspace "$RUNNER_TEMP/agent-artifacts" "${{ needs.prepare.outputs.work_branch }}"

      # A job timeout is a cancellation: success() and failure() are both false
      # then, so without the cancelled() clause hours of work left no patch and
      # no checkpoint. Only work that actually started is sealed.
      - name: Create deterministic patch
        id: patch
        if: >-
          success() ||
          failure() && (steps.implementation.outcome == 'failure' || steps.verify.outcome == 'failure' || steps.failure_smoke.outcome == 'failure') ||
          cancelled() && (steps.implementation.outcome != 'skipped' || steps.verify.outcome != 'skipped' || steps.failure_smoke.outcome != 'skipped') ||
          steps.implementation.outputs.handoff == 'true' ||
          steps.verify.outputs.handoff == 'true'
        env:
          ALLOW_EMPTY_PATCH: ${{ steps.implementation.outcome == 'failure' || steps.verify.outcome == 'failure' || steps.implementation.outcome == 'cancelled' || steps.verify.outcome == 'cancelled' || needs.prepare.outputs.base_ref == needs.prepare.outputs.work_branch || steps.implementation.outputs.handoff == 'true' || steps.verify.outputs.handoff == 'true' }}
        run: |
          node control/.github/scripts/create-patch.mjs \
            --workspace workspace \
            --patch "$RUNNER_TEMP/agent-artifacts/agent.patch" \
            --summary "$RUNNER_TEMP/agent-artifacts/change-summary.json" \
            --allow-empty "$ALLOW_EMPTY_PATCH"
          node control/.github/scripts/pipeline-state.mjs seal "$RUNNER_TEMP/agent-artifacts/pipeline-state.json" "$RUNNER_TEMP/agent-artifacts/agent.patch"

      - name: Review build quality and framework feedback
        # The patch is already sealed. A failed assessment never starts repair
        # or changes the independent final verification / publication verdict.
        if: >-
          !cancelled() && inputs.failure_smoke != true && steps.patch.outcome == 'success' &&
          steps.implementation.outputs.handoff != 'true' && steps.verify.outputs.handoff != 'true'
        continue-on-error: true
        # The runner accepts at most 60 minutes for the whole review, reruns and
        # their waits included, and saves a validated partial result on its own
        # timeout; leave time for snapshot setup and cleanup.
        timeout-minutes: 70
        env: *agent-run-env
        run: node control/.github/scripts/run-build-review.mjs workspace "$RUNNER_TEMP/agent-artifacts"

      - name: Prepare runner handoff metadata
        id: handoff
        if: steps.implementation.outputs.handoff == 'true' || steps.verify.outputs.handoff == 'true'
        env:
          CURRENT_CONTINUATION: ${{ inputs.recovery_run_id != '' && '1' || github.event.client_payload.continuation || '0' }}
        run: |
          # Bash arithmetic evaluates command substitutions, and this value comes
          # from the dispatch payload: accept digits only.
          if [[ ! "$CURRENT_CONTINUATION" =~ ^[0-9]{1,3}$ ]]; then
            echo "::error::Invalid continuation counter in the dispatch payload." >&2
            exit 1
          fi
          next_continuation=$((10#$CURRENT_CONTINUATION + 1))
          # A spent evaluation budget ends the chain here: the checkpoint is kept, no continuation is sent.
          if [[ -f control/.github/scripts/evaluation-budget.mjs ]] && \
            ! node control/.github/scripts/evaluation-budget.mjs handoff "$RUNNER_TEMP/agent-artifacts/pipeline-state.json" "$next_continuation"; then
            echo "::warning::Evaluation sample budget exhausted; facts are saved without an automatic continuation."
            exit 1
          fi
          node bootstrap/.github/scripts/handoff.mjs prepare \
            --issue "${{ needs.prepare.outputs.issue_number }}" \
            --run-id "${{ github.run_id }}" \
            --continuation "$next_continuation" \
            --phase "$(node control/.github/scripts/pipeline-state.mjs phase "$RUNNER_TEMP/agent-artifacts/pipeline-state.json")" \
            --output "$RUNNER_TEMP/agent-artifacts/handoff.json"
          echo "continuation=$next_continuation" >> "$GITHUB_OUTPUT"

      - name: Stop the task source registry
        if: always()
        continue-on-error: true
        run: |
          if [[ -f workspace/factory-source.json ]]; then
            node control/.github/scripts/source-snapshot.mjs stop
          fi

      - name: Flush and stop live progress observer
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        run: node control/.github/scripts/task-progress.mjs stop "$RUNNER_TEMP/agent-artifacts"

      - name: Upload Code Agent patch and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: factory-agent-${{ needs.prepare.outputs.issue_number }}
          path: ${{ runner.temp }}/agent-artifacts
          if-no-files-found: warn
          retention-days: 14

      # Final verification, publication, failed preview packaging and the
      # failure notice read only these files. They download this small copy;
      # factory-agent-N stays the complete record for reports and diagnosis.
      # Downstream jobs fall back to factory-agent-N when this copy is missing,
      # so a transient artifact error here must not fail the job or block the
      # handoff below.
      - name: Stage the patch for downstream jobs
        if: always()
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/patch-artifacts"
          [[ -d "$RUNNER_TEMP/agent-artifacts" ]] || exit 0
          cd "$RUNNER_TEMP/agent-artifacts"
          for file in agent.patch change-summary.json task-metadata.json pipeline-state.json; do
            if [[ -f "$file" && ! -L "$file" ]]; then
              cp "$file" "$RUNNER_TEMP/patch-artifacts/$file"
            fi
          done
          # mark-failure.mjs explains a stop from the invocation results.
          find . -type f -name 'agent*.jsonl.result.json' \
            -exec cp --parents {} "$RUNNER_TEMP/patch-artifacts" \;

      - name: Upload the patch for downstream jobs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: factory-patch-${{ needs.prepare.outputs.issue_number }}
          path: ${{ runner.temp }}/patch-artifacts
          if-no-files-found: warn
          retention-days: 14

      - name: Upload handoff checkpoint
        id: checkpoint
        # Preserve a recovery checkpoint on failure, without treating it as
        # successful verification or automatically retrying a broken runner.
        if: always() && steps.patch.outcome == 'success' && (steps.handoff.outcome == 'success' || failure() || cancelled())
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: factory-handoff-${{ needs.prepare.outputs.issue_number }}
          path: ${{ runner.temp }}/agent-artifacts
          if-no-files-found: error
          retention-days: 14

      - name: Dispatch continuation run
        id: dispatch
        # Explicit status function: without one, `success() &&` is implied and
        # any earlier always() upload failure would skip the dispatch silently.
        if: ${{ !cancelled() && steps.handoff.outcome == 'success' && steps.checkpoint.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUILD_COMMENT_ID: ${{ needs.prepare.outputs.build_comment_id }}
        run: |
          node bootstrap/.github/scripts/handoff.mjs dispatch \
            --issue "${{ needs.prepare.outputs.issue_number }}" \
            --previous-run-id "${{ github.run_id }}" \
            --continuation "${{ steps.handoff.outputs.continuation }}"

      - name: Record agent outcome
        id: outcome
        if: always()
        # A handoff only counts once its checkpoint is saved and the successor
        # was dispatched. Otherwise no continuation exists, so this run must
        # still report its failure and publish what it has.
        env:
          HANDOFF_OUTCOME: ${{ steps.handoff.outcome }}
          CHECKPOINT_OUTCOME: ${{ steps.checkpoint.outcome }}
          DISPATCH_OUTCOME: ${{ steps.dispatch.outcome }}
          # Keep in step with this job's timeout-minutes.
          JOB_TIMEOUT_SECONDS: '21600'
        run: |
          if [[ "$HANDOFF_OUTCOME" == "success" && "$CHECKPOINT_OUTCOME" == "success" && "$DISPATCH_OUTCOME" == "success" ]]; then
            echo "handoff=true" >> "$GITHUB_OUTPUT"
          else
            if [[ "$HANDOFF_OUTCOME" == "success" ]]; then
              echo "::error::Handoff was prepared but its checkpoint upload ($CHECKPOINT_OUTCOME) or continuation dispatch ($DISPATCH_OUTCOME) did not succeed; reporting this run as failed."
            fi
            echo "handoff=false" >> "$GITHUB_OUTPUT"
          fi
          # GitHub reports a job that hit timeout-minutes as cancelled, the same
          # as a manual cancel. Elapsed time tells them apart for the notice;
          # five minutes of slack covers the cancellation itself.
          timed_out=false
          if [[ "${FACTORY_JOB_STARTED_EPOCH_SECONDS:-}" =~ ^[0-9]+$ ]] && \
            (( $(date +%s) - FACTORY_JOB_STARTED_EPOCH_SECONDS >= JOB_TIMEOUT_SECONDS - 300 )); then
            timed_out=true
            echo "::error::The agent job reached its ${JOB_TIMEOUT_SECONDS}s runner limit before finishing."
          fi
          echo "timed_out=$timed_out" >> "$GITHUB_OUTPUT"

      - name: Summarize implementation and repair timings
        if: always()
        run: node control/.github/scripts/timing-summary.mjs

  verify-final:
    needs: [prepare, agent]
    if: needs.agent.result == 'success' && needs.agent.outputs.handoff != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      FACTORY_BUILD_TARGET: linux-x64
      FACTORY_BUILD_NODE_VERSION: '24'
      # Verification builds for the explicit deployment target and archives
      # that same build with `--tar`; nothing is rebuilt for the preview.
      FACTORY_BUILD_ARCHIVE: '1'
    permissions:
      contents: read
    steps:
      - name: Initialize final timing output
        run: echo "FACTORY_TIMINGS_FILE=$RUNNER_TEMP/final-artifacts/timings.jsonl" >> "$GITHUB_ENV"

      - name: Check out factory control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.control_sha }}
          path: control
          persist-credentials: false

      # The patch carries full blob ids against this commit, so applying it
      # needs the base tree only, not the repository history.
      - name: Check out fresh application base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          path: workspace
          persist-credentials: false

      - name: Download Code Agent patch
        id: patch_copy
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: factory-patch-${{ needs.prepare.outputs.issue_number }}
          path: agent-artifacts

      # The agent job tolerates a failed upload of the small copy; the complete
      # factory-agent-N record carries the same files.
      - name: Fall back to the complete Code Agent artifact
        if: steps.patch_copy.outcome == 'failure'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: factory-agent-${{ needs.prepare.outputs.issue_number }}
          path: agent-artifacts

      - name: Download trusted final verification task
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: factory-task-${{ needs.prepare.outputs.issue_number }}
          path: final-task

      - name: Apply patch to the task branch
        run: |
          node control/.github/scripts/apply-patch.mjs \
            --workspace workspace \
            --patch agent-artifacts/agent.patch \
            --branch "${{ needs.prepare.outputs.work_branch }}"

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          # Source tarballs use an isolated local store, not the shared registry cache.
          # Check the already checked-out descriptor before setup-node arms its post step.
          cache: ${{ hashFiles('workspace/factory-source.json') == '' && 'pnpm' || '' }}
          cache-dependency-path: workspace/pnpm-lock.yaml

      # The official CLI installs dist/ as its own pnpm root, which never reads the
      # application's .npmrc, and pnpm 11 ignores scoped registries passed in
      # the environment. Only the user-level file reaches that nested install.
      - name: Expose the factory registry to nested pnpm roots
        run: cat control/.npmrc >> ~/.npmrc

      - name: Install Chinese browser fonts
        timeout-minutes: 10
        run: bash control/.github/scripts/install-browser-fonts.sh

      - name: Restore the selected source baseline packages
        run: |
          if [[ -f control/.github/scripts/source-snapshot.mjs ]]; then
            node control/.github/scripts/source-snapshot.mjs restore workspace agent-artifacts/task-metadata.json
          elif [[ -f workspace/factory-source.json ]]; then
            echo "Pinned control plane cannot restore the selected source baseline." >&2
            exit 1
          fi

      - name: Install application dependencies
        timeout-minutes: 15
        working-directory: workspace
        run: node ../control/.github/scripts/timed-command.mjs install pnpm install --frozen-lockfile

      - name: Create clean final verification configuration
        run: |
          mkdir -p "$RUNNER_TEMP/final-artifacts"
          node control/.github/scripts/create-runtime-config.mjs \
            --output "$RUNNER_TEMP/final.yml" \
            --database "$RUNNER_TEMP/final/database.sqlite"

      - name: Independently verify the applied patch
        env:
          FACTORY_REQUIRED_CHECKS_METADATA: ${{ github.workspace }}/final-task/task-metadata.json
          FACTORY_REQUIRED_CHECKS_PATCH: ${{ github.workspace }}/agent-artifacts/agent.patch
          FACTORY_TEST_API_KEY: ${{ secrets.FACTORY_TEST_API_KEY }}
          FACTORY_TEST_ADMIN_KEY: ${{ secrets.FACTORY_TEST_ADMIN_KEY }}
        run: |
          set -o pipefail
          control/.github/scripts/verify.sh \
            workspace \
            "$RUNNER_TEMP/final.yml" \
            "$RUNNER_TEMP/final-artifacts/verify-final" \
            2>&1 | tee "$RUNNER_TEMP/final-artifacts/verify-final.log"

      # The preview workflow downloads this artifact and reads both files from its
      # root: `dist.tar.gz` to deploy and `task-metadata.json` to know which PR and
      # target branch the build belongs to. They are staged into one directory
      # first because `upload-artifact` keeps the structure below the paths' common
      # ancestor, and these two live in unrelated directories of the job.
      - name: Stage the deployable build and its metadata
        run: |
          mkdir -p "$RUNNER_TEMP/deployable"
          cp workspace/storage/exports/dist.tar.gz "$RUNNER_TEMP/deployable/dist.tar.gz"
          cp agent-artifacts/task-metadata.json "$RUNNER_TEMP/deployable/task-metadata.json"

      - name: Upload the deployable build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: factory-dist-${{ needs.prepare.outputs.issue_number }}
          path: ${{ runner.temp }}/deployable
          if-no-files-found: error
          retention-days: 14

      - name: Stop the final verifier source registry
        if: always()
        continue-on-error: true
        run: |
          if [[ -f workspace/factory-source.json ]]; then
            node control/.github/scripts/source-snapshot.mjs stop
          fi

      - name: Summarize final timings
        if: always()
        run: node control/.github/scripts/timing-summary.mjs

      - name: Upload final verification diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: factory-final-${{ needs.prepare.outputs.issue_number }}
          path: ${{ runner.temp }}/final-artifacts
          if-no-files-found: warn
          retention-days: 14

  publish:
    needs: [prepare, agent, verify-final]
    if: needs.verify-final.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      FACTORY_DELIVERY_STATUS: success
    steps: &publication-steps
      - name: Check out factory control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.control_sha }}
          path: control
          persist-credentials: false

      # One commit is enough to apply the patch. The lease below names the
      # expected remote value explicitly instead of reading a tracking ref;
      # publication-base.mjs fetches whatever a new branch's push needs.
      - name: Check out fresh application base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          path: workspace

      - name: Download preserved Code Agent patch and metadata
        id: patch_copy
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: factory-patch-${{ needs.prepare.outputs.issue_number }}
          path: agent-artifacts

      # The agent job tolerates a failed upload of the small copy; the complete
      # factory-agent-N record carries the same files.
      - name: Fall back to the complete Code Agent artifact
        if: steps.patch_copy.outcome == 'failure'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: factory-agent-${{ needs.prepare.outputs.issue_number }}
          path: agent-artifacts

      - name: Apply preserved patch to the task branch
        run: |
          node control/.github/scripts/apply-patch.mjs \
            --workspace workspace \
            --patch agent-artifacts/agent.patch \
            --branch "${{ needs.prepare.outputs.work_branch }}"

      # A new work branch whose base fell behind only on factory files is
      # published on the current branch head, so its workflow files match the
      # repository's; otherwise the verified base stays. See QA_PIPELINE.md.
      - name: Choose the publication base
        env:
          BASE_REF: ${{ needs.prepare.outputs.base_ref }}
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          WORK_BRANCH: ${{ needs.prepare.outputs.work_branch }}
        run: |
          node control/.github/scripts/publication-base.mjs \
            --workspace workspace \
            --patch agent-artifacts/agent.patch \
            --branch "$WORK_BRANCH" \
            --base-ref "$BASE_REF" \
            --base-sha "$BASE_SHA" \
            --record agent-artifacts/publication-base.json

      - name: Commit and push task branch
        working-directory: workspace
        env:
          BASE_REF: ${{ needs.prepare.outputs.base_ref }}
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          ISSUE_NUMBER: ${{ needs.prepare.outputs.issue_number }}
          WORK_BRANCH: ${{ needs.prepare.outputs.work_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet && [[ "$BASE_REF" != "$WORK_BRANCH" ]]; then
            echo "::error::No application diff was saved; GitHub cannot create a build PR. The failed report and logs remain available."
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No new application changes; reusing the existing work branch commit."
          else
            git commit -m "feat: apply Code Agent task #${ISSUE_NUMBER}"
            if [[ "$BASE_REF" == "$WORK_BRANCH" ]]; then
              lease="refs/heads/${WORK_BRANCH}:${BASE_SHA}"
            else
              lease="refs/heads/${WORK_BRANCH}:"
            fi
            if ! git push --force-with-lease="$lease" origin "HEAD:refs/heads/${WORK_BRANCH}" 2> "$RUNNER_TEMP/push.log"; then
              cat "$RUNNER_TEMP/push.log" >&2
              if grep -q 'without `workflows` permission' "$RUNNER_TEMP/push.log"; then
                echo "::error::GitHub refused ${WORK_BRANCH} because the pushed commits would change workflow files, which the task token may not do. The task was verified on ${BASE_SHA}; the target branch moved since with changes the publisher could not restack onto (see Choose the publication base). The verified patch is in the factory-patch-${ISSUE_NUMBER} artifact: apply it with git apply --3way on the current target branch, push ${WORK_BRANCH} with credentials allowed to change workflows, and open the PR by hand."
              fi
              exit 1
            fi
            cat "$RUNNER_TEMP/push.log" >&2
          fi

      - name: Create or update Pull Request
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node control/.github/scripts/publish-pr.mjs \
            --metadata agent-artifacts/task-metadata.json \
            --summary agent-artifacts/change-summary.json --status "$FACTORY_DELIVERY_STATUS" \
            --publication agent-artifacts/publication-base.json

  # Preserve failed work without treating publication as successful acceptance.
  publish-failed:
    needs: [prepare, agent, verify-final]
    if: >-
      always() && !cancelled() &&
      needs.prepare.outputs.status == 'ready' &&
      needs.prepare.outputs.comment_kind != 'reply' &&
      needs.agent.outputs.handoff != 'true' &&
      needs.agent.outputs.patch_available == 'true' &&
      (needs.agent.result != 'success' || needs.verify-final.result != 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      FACTORY_DELIVERY_STATUS: failed
    steps: *publication-steps

  preview-build-failed:
    needs: [prepare, agent, publish-failed]
    if: always() && !cancelled() && needs.publish-failed.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Initialize failed preview timing output
        run: echo "FACTORY_TIMINGS_FILE=$RUNNER_TEMP/final-artifacts/timings.jsonl" >> "$GITHUB_ENV"

      - name: Check out factory control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.control_sha }}
          path: control
          persist-credentials: false

      # The patch carries full blob ids against this commit, so applying it
      # needs the base tree only, not the repository history.
      - name: Check out fresh application base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          path: workspace
          persist-credentials: false

      - name: Download Code Agent patch
        id: patch_copy
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: factory-patch-${{ needs.prepare.outputs.issue_number }}
          path: agent-artifacts

      # The agent job tolerates a failed upload of the small copy; the complete
      # factory-agent-N record carries the same files.
      - name: Fall back to the complete Code Agent artifact
        if: steps.patch_copy.outcome == 'failure'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: factory-agent-${{ needs.prepare.outputs.issue_number }}
          path: agent-artifacts

      - name: Apply patch to the task branch
        run: |
          node control/.github/scripts/apply-patch.mjs \
            --workspace workspace \
            --patch agent-artifacts/agent.patch \
            --branch "${{ needs.prepare.outputs.work_branch }}"

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          # Source tarballs use an isolated local store, not the shared registry cache.
          # Check the already checked-out descriptor before setup-node arms its post step.
          cache: ${{ hashFiles('workspace/factory-source.json') == '' && 'pnpm' || '' }}
          cache-dependency-path: workspace/pnpm-lock.yaml

      # The official CLI installs dist/ as its own pnpm root, which never reads the
      # application's .npmrc, and pnpm 11 ignores scoped registries passed in
      # the environment. Only the user-level file reaches that nested install.
      - name: Expose the factory registry to nested pnpm roots
        run: cat control/.npmrc >> ~/.npmrc

      - name: Restore the selected source baseline packages
        run: |
          if [[ -f control/.github/scripts/source-snapshot.mjs ]]; then
            node control/.github/scripts/source-snapshot.mjs restore workspace agent-artifacts/task-metadata.json
          elif [[ -f workspace/factory-source.json ]]; then
            echo "Pinned control plane cannot restore the selected source baseline." >&2
            exit 1
          fi

      - name: Install application dependencies
        timeout-minutes: 15
        working-directory: workspace
        run: node ../control/.github/scripts/timed-command.mjs install pnpm install --frozen-lockfile

      - name: Create isolated failed preview build configuration
        run: |
          mkdir -p "$RUNNER_TEMP/final-artifacts"
          node control/.github/scripts/create-runtime-config.mjs \
            --output "$RUNNER_TEMP/final.yml" \
            --database "$RUNNER_TEMP/final/database.sqlite"

      - name: Attempt packaging the failed implementation
        working-directory: workspace
        env:
          APP_CONFIG_FILE: ${{ runner.temp }}/final.yml
          NODE_ENV: production
        run: |
          set -o pipefail
          node ../control/.github/scripts/timed-command.mjs preview-build pnpm build --target linux-x64 --node-version 24 --tar 2>&1 | tee $RUNNER_TEMP/final-artifacts/preview-build.log

      # The preview workflow downloads this artifact and reads both files from its
      # root: `dist.tar.gz` to deploy and `task-metadata.json` to know which PR and
      # target branch the build belongs to. They are staged into one directory
      # first because `upload-artifact` keeps the structure below the paths' common
      # ancestor, and these two live in unrelated directories of the job.
      - name: Stage the deployable build and its metadata
        run: |
          mkdir -p "$RUNNER_TEMP/deployable"
          cp workspace/storage/exports/dist.tar.gz "$RUNNER_TEMP/deployable/dist.tar.gz"
          cp agent-artifacts/task-metadata.json "$RUNNER_TEMP/deployable/task-metadata.json"

      - name: Upload the deployable build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: factory-dist-${{ needs.prepare.outputs.issue_number }}
          overwrite: true
          path: ${{ runner.temp }}/deployable
          if-no-files-found: error
          retention-days: 14

      - name: Stop the failed preview source registry
        if: always()
        continue-on-error: true
        run: |
          if [[ -f workspace/factory-source.json ]]; then
            node control/.github/scripts/source-snapshot.mjs stop
          fi

      - name: Summarize failed preview packaging timings
        if: always()
        run: node control/.github/scripts/timing-summary.mjs

      - name: Upload failed preview packaging diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: factory-preview-build-${{ needs.prepare.outputs.issue_number }}
          path: ${{ runner.temp }}/final-artifacts
          if-no-files-found: warn
          retention-days: 14

  report-failure:
    needs:
      [
        prepare,
        agent,
        verify-final,
        publish,
        publish-failed,
        preview-build-failed,
      ]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.prepare.outputs.status == 'ready' &&
      needs.prepare.outputs.comment_kind != 'reply' &&
      needs.agent.outputs.handoff != 'true' &&
      (needs.agent.result != 'success' ||
       needs.verify-final.result != 'success' ||
       needs.publish.result != 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out factory control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.control_sha }}
          path: control
          persist-credentials: false

      - name: Download failure diagnostics
        id: patch_copy
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: factory-patch-${{ needs.prepare.outputs.issue_number }}
          path: failure-artifacts

      # The agent job tolerates a failed upload of the small copy; the complete
      # factory-agent-N record carries the same files.
      - name: Fall back to the complete Code Agent artifact
        if: steps.patch_copy.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: factory-agent-${{ needs.prepare.outputs.issue_number }}
          path: failure-artifacts

      - name: Mark Issue as failed
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FACTORY_CHECKPOINT_AVAILABLE: ${{ needs.agent.outputs.checkpoint_available }}
          FACTORY_PREVIEW_BUILD_RESULT: ${{ needs.preview-build-failed.result }}
          # This job deliberately runs on cancellation (always()) so the Issue
          # leaves agent:running; the notice says it was cancelled. cancelled()
          # is not available in env, and a cancelled run cancels its jobs.
          FACTORY_RUN_CANCELLED: ${{ contains(needs.*.result, 'cancelled') }}
          FACTORY_RUN_TIMED_OUT: ${{ needs.agent.outputs.timed_out }}
        run: node control/.github/scripts/mark-failure.mjs "${{ needs.prepare.outputs.issue_number }}" failure-artifacts

  dispatch-reports:
    # The dispatched report runs wait only a few minutes for this run to
    # complete, so dispatch after the comment reply jobs have finished too.
    needs:
      [
        prepare,
        agent,
        verify-final,
        publish,
        publish-failed,
        preview-build-failed,
        report-failure,
        reply,
        publish-reply,
      ]
    # prepare exposes status=ready before its artifact upload; a failed prepare
    # has no factory-task-N for the reports to read.
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.status == 'ready' && needs.prepare.outputs.comment_kind != 'reply'
    runs-on: ubuntu-24.04
    # Six requests at up to 70 s each (dispatch-task-reports.sh) plus checkout.
    # Continuations have no workflow_run fallback, so the last reports must fit.
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      actions: write
    steps:
      # Isolated from application execution and from all model/media secrets.
      # The dispatcher comes from this workflow file's own revision, not the
      # task's pinned control SHA: continuations, recoveries and evaluation
      # samples pin an older control plane whose dispatcher ignores its
      # arguments, and each step below would then request every report. It
      # carries no task logic, and the steps below are its only callers.
      - name: Check out the report dispatcher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: dispatcher
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/dispatch-task-reports.sh
      # One step per report (including continuations): report-dispatch-gate.yml
      # reads each step by name, so a failed request makes only that report's
      # workflow_run copy do the work, not all six. Each step runs even after an
      # earlier one failed; the job's continue-on-error keeps the task result.
      - name: Request report-task-progress.yml
        id: request-report-task-progress
        if: ${{ !cancelled() }}
        env: &report-dispatch-env
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_ATTEMPT: ${{ github.run_attempt }}
          FACTORY_REPORT_REF: ${{ github.event.repository.default_branch }}
          FACTORY_TASK_PUBLISHED: ${{ needs.publish.result == 'success' || needs.publish-failed.result == 'success' }}
        run: bash dispatcher/.github/scripts/dispatch-task-reports.sh report-task-progress.yml
      - name: Request report-task-usage.yml
        id: request-report-task-usage
        if: ${{ !cancelled() }}
        env: *report-dispatch-env
        run: bash dispatcher/.github/scripts/dispatch-task-reports.sh report-task-usage.yml
      - name: Request publish-agent-history.yml
        id: request-publish-agent-history
        if: ${{ !cancelled() }}
        env: *report-dispatch-env
        run: bash dispatcher/.github/scripts/dispatch-task-reports.sh publish-agent-history.yml
      - name: Request publish-retro.yml
        id: request-publish-retro
        if: ${{ !cancelled() }}
        env: *report-dispatch-env
        run: bash dispatcher/.github/scripts/dispatch-task-reports.sh publish-retro.yml
      - name: Request publish-visual-report.yml
        id: request-publish-visual-report
        if: ${{ !cancelled() }}
        env: *report-dispatch-env
        run: bash dispatcher/.github/scripts/dispatch-task-reports.sh publish-visual-report.yml
      - name: Request deploy-preview.yml
        id: request-deploy-preview
        if: ${{ !cancelled() }}
        env: *report-dispatch-env
        run: bash dispatcher/.github/scripts/dispatch-task-reports.sh deploy-preview.yml

  reply:
    env:
      FACTORY_CONTROL_SHA: ${{ needs.prepare.outputs.control_sha }}
    needs: [prepare, agent, verify-final, publish, publish-failed]
    if: >-
      always() && !cancelled() &&
      needs.prepare.result == 'success' &&
      needs.prepare.outputs.status == 'ready' &&
      needs.prepare.outputs.build_comment_id != '' &&
      needs.agent.outputs.handoff != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.control_sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ (needs.publish.result == 'success' || needs.publish-failed.result == 'success') && needs.prepare.outputs.work_branch || needs.prepare.outputs.base_sha }}
          path: workspace
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: factory-task-${{ needs.prepare.outputs.issue_number }}
          path: task
      - name: Build reply prompt
        env:
          BUILD_RESULT: ${{ needs.publish-failed.result == 'success' && 'failure' || needs.publish.result }}
        run: node control/.github/scripts/comment-reply.mjs prompt task/task-metadata.json "$RUNNER_TEMP"
      - name: Install pinned Code Agent
        timeout-minutes: 10
        env: *agent-install-env
        run: node control/.github/scripts/install-agent.mjs
      - name: Answer source comment from current code
        env: *agent-run-env
        run: |
          CODE_AGENT_INVOCATION_TIMEOUT_SECONDS=900 node control/.github/scripts/run-agent.mjs \
            --workspace workspace \
            --prompt "$RUNNER_TEMP/comment-prompt.md" \
            --log "$RUNNER_TEMP/comment-artifacts/comment-agent.jsonl" \
            --agentDir "$RUNNER_TEMP/comment-agent"
      - name: Collect comment reply diagnostics
        if: always()
        env: *agent-run-env
        run: node control/.github/scripts/agent-invocation-record.mjs stage-reply "$RUNNER_TEMP" task/task-metadata.json

      - name: Save reply for trusted publisher
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: factory-comment-reply-${{ needs.prepare.outputs.build_comment_id }}
          path: ${{ runner.temp }}/comment-artifacts
          if-no-files-found: error
          retention-days: 14

  publish-reply:
    needs: [prepare, reply]
    if: always() && needs.reply.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.control_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: factory-task-${{ needs.prepare.outputs.issue_number }}
          path: task
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: factory-comment-reply-${{ needs.prepare.outputs.build_comment_id }}
          path: reply
      - name: Publish quoted reply
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/comment-reply.mjs publish task/task-metadata.json reply

  # Question rounds skip dispatch-reports, so they request their history here.
  # A /build round's history is already requested by dispatch-reports.
  dispatch-reply-history:
    needs: [prepare, reply, publish-reply]
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.status == 'ready' && needs.prepare.outputs.build_comment_id != '' && needs.prepare.outputs.comment_kind == 'reply'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Request comment interaction history
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_ATTEMPT: ${{ github.run_attempt }}
          REPORT_REF: ${{ github.event.repository.default_branch }}
        run: |
          gh workflow run publish-agent-history.yml --repo "$GITHUB_REPOSITORY" --ref "$REPORT_REF" \
            --field "run_id=$SOURCE_RUN_ID" --field "attempt=$SOURCE_ATTEMPT"
