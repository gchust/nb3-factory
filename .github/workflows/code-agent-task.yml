name: Code Agent NocoBase Task

on:
  issues:
    types: [opened, reopened]
  repository_dispatch:
    types: [code-agent-task, code-agent-continue, pi-task] # Legacy dispatches remain readable.
  workflow_dispatch:
    inputs:
      issue_number:
        description: Open owner-authored Issue number to run again
        required: true
        type: number

permissions: {}

concurrency:
  group: code-agent-global
  queue: max

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: read
    outputs:
      status: ${{ steps.prepare.outputs.status }}
      issue_number: ${{ steps.prepare.outputs.issue_number }}
      target_branch: ${{ steps.prepare.outputs.target_branch }}
      work_branch: ${{ steps.prepare.outputs.work_branch }}
      default_branch: ${{ steps.prepare.outputs.default_branch }}
      base_ref: ${{ steps.prepare.outputs.base_ref }}
      base_sha: ${{ steps.prepare.outputs.base_sha }}
    steps:
      - name: Check out factory control plane
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: control
          persist-credentials: false

      - name: Resolve Issue and target branch
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node control/.github/scripts/prepare-task.mjs \
            --event "$GITHUB_EVENT_PATH" \
            --metadata "$RUNNER_TEMP/task-metadata.json" \
            --output "$GITHUB_OUTPUT"

      - name: Save normalized task metadata
        if: steps.prepare.outputs.status == 'ready'
        uses: actions/upload-artifact@v4
        with:
          name: factory-task-${{ steps.prepare.outputs.issue_number }}
          path: ${{ runner.temp }}/task-metadata.json
          if-no-files-found: error
          retention-days: 14

  agent:
    needs: prepare
    env:
      CODE_AGENT_ENGINE: ${{ vars.CODE_AGENT_ENGINE }}
    if: needs.prepare.outputs.status == 'ready'
    runs-on: ubuntu-latest
    # GitHub-hosted runners allow at most six hours per job. The factory uses
    # five hours as a soft runner budget, then checkpoints and continues in a
    # new run. Repair attempts remain unlimited across those runs.
    timeout-minutes: 360
    permissions:
      actions: read
      contents: write
    outputs:
      handoff: ${{ steps.outcome.outputs.handoff }}
    steps:
      - name: Check out factory control plane
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.default_branch }}
          path: control
          persist-credentials: false

      - name: Start five-hour runner budget
        run: echo "FACTORY_RUN_DEADLINE_EPOCH_SECONDS=$(($(date +%s) + 18000))" >> "$GITHUB_ENV"

      - name: Check out application base
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          path: workspace
          fetch-depth: 0
          persist-credentials: false

      - name: Download handoff checkpoint
        if: github.event_name == 'repository_dispatch' && github.event.action == 'code-agent-continue'
        uses: actions/download-artifact@v4
        with:
          name: factory-handoff-${{ needs.prepare.outputs.issue_number }}
          path: handoff
          run-id: ${{ github.event.client_payload.previous_run_id }}
          github-token: ${{ github.token }}

      - name: Restore handoff checkpoint
        if: github.event_name == 'repository_dispatch' && github.event.action == 'code-agent-continue'
        run: |
          node control/.github/scripts/apply-patch.mjs \
            --workspace workspace \
            --patch handoff/agent.patch \
            --branch "${{ needs.prepare.outputs.work_branch }}"

      - name: Download normalized task
        uses: actions/download-artifact@v4
        with:
          name: factory-task-${{ needs.prepare.outputs.issue_number }}
          path: task

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: workspace/pnpm-lock.yaml

      - name: Install application dependencies
        working-directory: workspace
        run: |
          pnpm install --frozen-lockfile
          pnpm plugin:skills:sync

      - name: Build the implementation prompt
        run: |
          mkdir -p "$RUNNER_TEMP/agent-artifacts"
          cp task/task-metadata.json "$RUNNER_TEMP/agent-artifacts/task-metadata.json"
          node control/.github/scripts/build-prompt.mjs \
            --metadata task/task-metadata.json \
            --template control/.github/prompts/implement.md \
            --output "$RUNNER_TEMP/implement.md"

      - name: Install pinned Code Agent
        env:
          CODE_AGENT_VERSION: ${{ vars.CODE_AGENT_VERSION || vars.PI_VERSION }}
        run: node control/.github/scripts/install-agent.mjs

      - name: Run Code Agent implementation
        id: implementation
        if: >-
          needs.prepare.outputs.base_ref != needs.prepare.outputs.work_branch &&
          !(github.event_name == 'repository_dispatch' && github.event.action == 'code-agent-continue')
        env:
          CODE_AGENT_API_ENDPOINT: ${{ secrets.CODE_AGENT_API_ENDPOINT || secrets.PI_API_ENDPOINT }}
          CODE_AGENT_API_KEY: ${{ secrets.CODE_AGENT_API_KEY || secrets.PI_API_KEY }}
          CODE_AGENT_API_TYPE: ${{ vars.CODE_AGENT_API_TYPE || vars.PI_API_TYPE || 'openai-completions' }}
          CODE_AGENT_MODEL: ${{ vars.CODE_AGENT_MODEL || vars.PI_MODEL }}
          CODE_AGENT_THINKING: ${{ vars.CODE_AGENT_THINKING || vars.PI_THINKING || 'max' }}
          CODE_AGENT_AUTH_HEADER: ${{ vars.CODE_AGENT_AUTH_HEADER || vars.PI_AUTH_HEADER || 'true' }}
          CODE_AGENT_SUPPORTS_DEVELOPER_ROLE: ${{ vars.CODE_AGENT_SUPPORTS_DEVELOPER_ROLE || vars.PI_SUPPORTS_DEVELOPER_ROLE }}
          CODE_AGENT_SUPPORTS_REASONING_EFFORT: ${{ vars.CODE_AGENT_SUPPORTS_REASONING_EFFORT || vars.PI_SUPPORTS_REASONING_EFFORT || 'true' }}
          CODE_AGENT_INVOCATION_TIMEOUT_SECONDS: ${{ vars.CODE_AGENT_INVOCATION_TIMEOUT_SECONDS || vars.PI_INVOCATION_TIMEOUT_SECONDS || '0' }}
        run: |
          set +e
          node control/.github/scripts/run-agent.mjs \
            --workspace workspace \
            --prompt "$RUNNER_TEMP/implement.md" \
            --log "$RUNNER_TEMP/agent-artifacts/agent-implement.jsonl" \
            --agentDir "$RUNNER_TEMP/code-agent"
          status=$?
          set -e
          if [[ "$status" -eq 75 ]]; then
            echo "handoff=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$status"

      - name: Install pinned Agent Browser
        if: steps.implementation.outputs.handoff != 'true'
        env:
          AGENT_BROWSER_VERSION: ${{ vars.AGENT_BROWSER_VERSION || '0.36.0' }}
        run: |
          npm install --global "agent-browser@${AGENT_BROWSER_VERSION}"
          agent-browser --version

      - name: Verify and repair until successful
        id: verify
        if: steps.implementation.outputs.handoff != 'true'
        env:
          CODE_AGENT_API_ENDPOINT: ${{ secrets.CODE_AGENT_API_ENDPOINT || secrets.PI_API_ENDPOINT }}
          CODE_AGENT_API_KEY: ${{ secrets.CODE_AGENT_API_KEY || secrets.PI_API_KEY }}
          CODE_AGENT_API_TYPE: ${{ vars.CODE_AGENT_API_TYPE || vars.PI_API_TYPE || 'openai-completions' }}
          CODE_AGENT_MODEL: ${{ vars.CODE_AGENT_MODEL || vars.PI_MODEL }}
          CODE_AGENT_THINKING: ${{ vars.CODE_AGENT_THINKING || vars.PI_THINKING || 'max' }}
          CODE_AGENT_AUTH_HEADER: ${{ vars.CODE_AGENT_AUTH_HEADER || vars.PI_AUTH_HEADER || 'true' }}
          CODE_AGENT_SUPPORTS_DEVELOPER_ROLE: ${{ vars.CODE_AGENT_SUPPORTS_DEVELOPER_ROLE || vars.PI_SUPPORTS_DEVELOPER_ROLE }}
          CODE_AGENT_SUPPORTS_REASONING_EFFORT: ${{ vars.CODE_AGENT_SUPPORTS_REASONING_EFFORT || vars.PI_SUPPORTS_REASONING_EFFORT || 'true' }}
          CODE_AGENT_INVOCATION_TIMEOUT_SECONDS: ${{ vars.CODE_AGENT_INVOCATION_TIMEOUT_SECONDS || vars.PI_INVOCATION_TIMEOUT_SECONDS || '0' }}
        run: |
          set +e
          control/.github/scripts/verify-and-repair.sh \
            control \
            workspace \
            "$RUNNER_TEMP/implement.md" \
            task/task-metadata.json \
            "$RUNNER_TEMP/agent-artifacts" \
            "$RUNNER_TEMP/repair-state"
          status=$?
          set -e
          if [[ "$status" -eq 75 ]]; then
            echo "handoff=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$status"

      - name: Create deterministic patch
        if: >-
          success() ||
          steps.implementation.outputs.handoff == 'true' ||
          steps.verify.outputs.handoff == 'true'
        env:
          ALLOW_EMPTY_PATCH: ${{ needs.prepare.outputs.base_ref == needs.prepare.outputs.work_branch || steps.implementation.outputs.handoff == 'true' || steps.verify.outputs.handoff == 'true' }}
        run: |
          node control/.github/scripts/create-patch.mjs \
            --workspace workspace \
            --patch "$RUNNER_TEMP/agent-artifacts/agent.patch" \
            --summary "$RUNNER_TEMP/agent-artifacts/change-summary.json" \
            --allow-empty "$ALLOW_EMPTY_PATCH"

      - name: Prepare runner handoff metadata
        id: handoff
        if: steps.implementation.outputs.handoff == 'true' || steps.verify.outputs.handoff == 'true'
        env:
          CURRENT_CONTINUATION: ${{ github.event.client_payload.continuation || '0' }}
        run: |
          next_continuation=$((CURRENT_CONTINUATION + 1))
          node control/.github/scripts/handoff.mjs prepare \
            --issue "${{ needs.prepare.outputs.issue_number }}" \
            --run-id "${{ github.run_id }}" \
            --continuation "$next_continuation" \
            --phase agent \
            --output "$RUNNER_TEMP/agent-artifacts/handoff.json"
          echo "continuation=$next_continuation" >> "$GITHUB_OUTPUT"

      - name: Upload Code Agent patch and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-agent-${{ needs.prepare.outputs.issue_number }}
          path: ${{ runner.temp }}/agent-artifacts
          if-no-files-found: warn
          retention-days: 14

      - name: Upload handoff checkpoint
        if: steps.handoff.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: factory-handoff-${{ needs.prepare.outputs.issue_number }}
          path: ${{ runner.temp }}/agent-artifacts
          if-no-files-found: error
          retention-days: 14

      - name: Dispatch continuation run
        if: steps.handoff.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node control/.github/scripts/handoff.mjs dispatch \
            --issue "${{ needs.prepare.outputs.issue_number }}" \
            --previous-run-id "${{ github.run_id }}" \
            --continuation "${{ steps.handoff.outputs.continuation }}"

      - name: Record agent outcome
        id: outcome
        if: always()
        run: |
          if [[ "${{ steps.handoff.outcome }}" == "success" ]]; then
            echo "handoff=true" >> "$GITHUB_OUTPUT"
          else
            echo "handoff=false" >> "$GITHUB_OUTPUT"
          fi

  verify-final:
    needs: [prepare, agent]
    if: needs.agent.result == 'success' && needs.agent.outputs.handoff != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out factory control plane
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.default_branch }}
          path: control
          persist-credentials: false

      - name: Check out fresh application base
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          path: workspace
          fetch-depth: 0
          persist-credentials: false

      - name: Download Code Agent patch and diagnostics
        uses: actions/download-artifact@v4
        with:
          name: factory-agent-${{ needs.prepare.outputs.issue_number }}
          path: agent-artifacts

      - name: Apply patch to the task branch
        run: |
          node control/.github/scripts/apply-patch.mjs \
            --workspace workspace \
            --patch agent-artifacts/agent.patch \
            --branch "${{ needs.prepare.outputs.work_branch }}"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: workspace/pnpm-lock.yaml

      - name: Install application dependencies
        working-directory: workspace
        run: pnpm install --frozen-lockfile

      - name: Create clean final verification configuration
        run: |
          mkdir -p "$RUNNER_TEMP/final-artifacts"
          node control/.github/scripts/create-runtime-config.mjs \
            --output "$RUNNER_TEMP/final.yml" \
            --database "$RUNNER_TEMP/final/database.sqlite"

      - name: Independently verify the applied patch
        run: |
          set -o pipefail
          control/.github/scripts/verify.sh \
            workspace \
            "$RUNNER_TEMP/final.yml" \
            "$RUNNER_TEMP/final-artifacts/verify-final" \
            2>&1 | tee "$RUNNER_TEMP/final-artifacts/verify-final.log"

      - name: Upload final verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-final-${{ needs.prepare.outputs.issue_number }}
          path: ${{ runner.temp }}/final-artifacts
          if-no-files-found: warn
          retention-days: 14

  publish:
    needs: [prepare, agent, verify-final]
    if: needs.verify-final.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Check out factory control plane
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.default_branch }}
          path: control
          persist-credentials: false

      - name: Check out fresh application base
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          path: workspace
          fetch-depth: 0

      - name: Download verified Code Agent patch and metadata
        uses: actions/download-artifact@v4
        with:
          name: factory-agent-${{ needs.prepare.outputs.issue_number }}
          path: agent-artifacts

      - name: Apply verified patch to the task branch
        run: |
          node control/.github/scripts/apply-patch.mjs \
            --workspace workspace \
            --patch agent-artifacts/agent.patch \
            --branch "${{ needs.prepare.outputs.work_branch }}"

      - name: Commit and push task branch
        working-directory: workspace
        env:
          BASE_REF: ${{ needs.prepare.outputs.base_ref }}
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          ISSUE_NUMBER: ${{ needs.prepare.outputs.issue_number }}
          WORK_BRANCH: ${{ needs.prepare.outputs.work_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No new application changes; reusing the verified work branch commit."
          else
            git commit -m "feat: apply Code Agent task #${ISSUE_NUMBER}"
            if [[ "$BASE_REF" == "$WORK_BRANCH" ]]; then
              lease="refs/heads/${WORK_BRANCH}:${BASE_SHA}"
            else
              lease="refs/heads/${WORK_BRANCH}:"
            fi
            git push --force-with-lease="$lease" origin "HEAD:refs/heads/${WORK_BRANCH}"
          fi

      - name: Create or update Pull Request
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node control/.github/scripts/publish-pr.mjs \
            --metadata agent-artifacts/task-metadata.json \
            --summary agent-artifacts/change-summary.json

  report-failure:
    needs: [prepare, agent, verify-final, publish]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.prepare.outputs.status == 'ready' &&
      needs.agent.outputs.handoff != 'true' &&
      (needs.agent.result != 'success' ||
       needs.verify-final.result != 'success' ||
       needs.publish.result != 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out factory control plane
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.default_branch }}
          path: control
          persist-credentials: false

      - name: Mark Issue as failed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node control/.github/scripts/mark-failure.mjs "${{ needs.prepare.outputs.issue_number }}"
