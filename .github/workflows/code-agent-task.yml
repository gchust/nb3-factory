      - name: Locate the pnpm store
        id: pnpm_store
        if: hashFiles('workspace/factory-source.json') == ''
        working-directory: workspace
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore the agent job's pnpm store
        if: steps.pnpm_store.outputs.path != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          key: node-cache-Linux-x64-pnpm-${{ hashFiles('workspace/pnpm-lock.yaml') }}
          restore-keys: |
            node-cache-Linux-x64-pnpm-

      # The official CLI installs dist/ as its own pnpm root, which never reads the
      # application's .npmrc, and pnpm 11 ignores scoped registries passed in
      # the environment. Only the user-level file reaches that nested install.
      - name: Expose the factory registry to nested pnpm roots
        run: cat control/.npmrc >> ~/.npmrc

      - name: Restore the selected source baseline packages
        run: |
          if [[ -f control/.github/scripts/source-snapshot.mjs ]]; then
            node control/.github/scripts/source-snapshot.mjs restore workspace agent-artifacts/task-metadata.json
          elif [[ -f workspace/factory-source.json ]]; then
            echo "Pinned control plane cannot restore the selected source baseline." >&2
            exit 1
          fi

      - name: Install application dependencies
        timeout-minutes: 15
        working-directory: workspace
        run: node ../control/.github/scripts/timed-command.mjs install pnpm install --frozen-lockfile

      - name: Create isolated failed preview build configuration
        run: |
          mkdir -p "$RUNNER_TEMP/final-artifacts"
          node control/.github/scripts/create-runtime-config.mjs \
            --output "$RUNNER_TEMP/final.yml" \
            --database "$RUNNER_TEMP/final/database.sqlite"

      - name: Attempt packaging the failed implementation
        working-directory: workspace
        env:
          APP_CONFIG_FILE: ${{ runner.temp }}/final.yml
          NODE_ENV: production
        run: |
          set -o pipefail
          node ../control/.github/scripts/timed-command.mjs preview-build pnpm build --target linux-x64 --node-version 24 --tar 2>&1 | tee $RUNNER_TEMP/final-artifacts/preview-build.log

      # The preview workflow downloads this artifact and reads both files from its
      # root: `dist.tar.gz` to deploy and `task-metadata.json` to know which PR and
      # target branch the build belongs to. They are staged into one directory
      # first because `upload-artifact` keeps the structure below the paths' common
      # ancestor, and these two live in unrelated directories of the job.
      - name: Stage the deployable build and its metadata
        run: |
          mkdir -p "$RUNNER_TEMP/deployable"
          cp workspace/storage/exports/dist.tar.gz "$RUNNER_TEMP/deployable/dist.tar.gz"
          cp agent-artifacts/task-metadata.json "$RUNNER_TEMP/deployable/task-metadata.json"

      - name: Upload the deployable build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: factory-dist-${{ needs.prepare.outputs.issue_number }}
          overwrite: true
          path: ${{ runner.temp }}/deployable
          if-no-files-found: error
          retention-days: 14

      - name: Stop the failed preview source registry
        if: always()
        continue-on-error: true
        run: |
          if [[ -f workspace/factory-source.json ]]; then
            node control/.github/scripts/source-snapshot.mjs stop
          fi

      - name: Summarize failed preview packaging timings
        if: always()
        # Diagnostics only: a failure here must not report a package that was
        # uploaded above as missing.
        continue-on-error: true
        run: node control/.github/scripts/timing-summary.mjs

      - name: Upload failed preview packaging diagnostics
        if: always()
        # Diagnostics only: a failure here must not report a package that was
        # uploaded above as missing.
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: factory-preview-build-${{ needs.prepare.outputs.issue_number }}
          path: ${{ runner.temp }}/final-artifacts
          if-no-files-found: warn
          retention-days: 14

  # Runs only when the run itself was cancelled. A job that hit its
  # timeout-minutes is also 'cancelled' in needs.*, so report-failure cannot
  # tell the two apart from its needs, and a step-level cancelled() there is
  # always false: an always() job is not cancelled with the run.
  run-cancelled:
    needs:
      [
        prepare,
        agent,
        verify-final,
        publish,
        publish-failed,
        preview-build-failed,
      ]
    if: cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Record that the run was cancelled
        run: 'true'

  report-failure:
    needs:
      [
        prepare,
        agent,
        verify-final,
        publish,
        publish-failed,
        preview-build-failed,
        run-cancelled,
      ]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.prepare.outputs.status == 'ready' &&
      needs.prepare.outputs.comment_kind != 'reply' &&
      needs.agent.outputs.handoff != 'true' &&
      (needs.agent.result != 'success' ||
       needs.verify-final.result != 'success' ||
       needs.publish.result != 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out factory control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.control_sha }}
          path: control
          persist-credentials: false
          # mark-failure.mjs and everything it imports live here.
          sparse-checkout: .github/scripts

      - name: Download failure diagnostics
        id: patch_copy
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: factory-patch-${{ needs.prepare.outputs.issue_number }}
          path: failure-artifacts

      # The agent job tolerates a failed upload of the small copy; the complete
      # factory-agent-N record carries the same files.
      - name: Fall back to the complete Code Agent artifact
        if: steps.patch_copy.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: factory-agent-${{ needs.prepare.outputs.issue_number }}
          path: failure-artifacts

      # This job deliberately runs on cancellation (always()) so the Issue
      # leaves agent:running; the notice says it was cancelled. Only a real
      # cancellation of the run counts (run-cancelled): GitHub also reports a
      # job that hit its timeout-minutes as cancelled, which is a failure.
      - name: Mark Issue as failed
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FACTORY_CHECKPOINT_AVAILABLE: ${{ needs.agent.outputs.checkpoint_available }}
          FACTORY_PREVIEW_BUILD_RESULT: ${{ needs.preview-build-failed.result }}
          FACTORY_RUN_CANCELLED: ${{ needs.run-cancelled.result == 'success' }}
          FACTORY_RUN_TIMED_OUT: ${{ needs.agent.outputs.timed_out }}
          FACTORY_RERUN_REJECTED: ${{ needs.agent.outputs.rerun_rejected }}
        run: node control/.github/scripts/mark-failure.mjs "${{ needs.prepare.outputs.issue_number }}" failure-artifacts

  dispatch-reports:
    # The dispatched report runs wait only a few minutes for this run to
    # complete, so dispatch after the comment reply jobs have finished too.
    needs:
      [
        prepare,
        agent,
        verify-final,
        publish,
        publish-failed,
        preview-build-failed,
        report-failure,
        reply,
        publish-reply,
      ]
    # prepare exposes status=ready before its artifact upload; a failed prepare
    # has no factory-task-N for the reports to read. A "Re-run all jobs" that
    # prepare rejected still runs this job with every request marked handled
    # and none dispatched, so the workflow_run copies skip that empty attempt.
    if: >-
      always() &&
      ((needs.prepare.result == 'success' && needs.prepare.outputs.status == 'ready' && needs.prepare.outputs.comment_kind != 'reply') ||
       needs.prepare.outputs.rerun_rejected == 'true')
    runs-on: ubuntu-24.04
    # Up to seven requests at 70 s each (dispatch-task-reports.sh) plus checkout.
    # Continuations have no workflow_run fallback, so the last reports must fit.
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      actions: write
    steps:
      # Isolated from application execution and from all model/media secrets.
      # The dispatcher comes from this workflow file's own revision, not the
      # task's pinned control SHA: continuations, recoveries and evaluation
      # samples pin an older control plane whose dispatcher ignores its
      # arguments, and each step below would then request every report. It
      # carries no task logic, and the steps below are its only callers.
      - name: Check out the report dispatcher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: dispatcher
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/dispatch-task-reports.sh
      # One step per report (including continuations): report-dispatch-gate.yml
      # reads each step by name, so a failed request makes only that report's
      # workflow_run copy do the work, not all six. Each step runs even after an
      # earlier one failed; the job's continue-on-error keeps the task result.
      - name: Request report-task-progress.yml
        id: request-report-task-progress
        if: ${{ !cancelled() }}
        env: &report-dispatch-env
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_ATTEMPT: ${{ github.run_attempt }}
          FACTORY_REPORT_REF: ${{ github.event.repository.default_branch }}
          FACTORY_TASK_PUBLISHED: ${{ needs.publish.result == 'success' || needs.publish-failed.result == 'success' }}
          # A rejected Re-run requests no report; see dispatch-task-reports.sh.
          # Rejected in prepare ("Re-run all jobs") it requests nothing at all.
          FACTORY_RERUN_REJECTED: ${{ needs.agent.outputs.rerun_rejected == 'true' || needs.prepare.outputs.rerun_rejected == 'true' }}
          FACTORY_PREPARE_REJECTED: ${{ needs.prepare.outputs.rerun_rejected == 'true' }}
        run: bash dispatcher/.github/scripts/dispatch-task-reports.sh report-task-progress.yml
      - name: Request report-task-usage.yml
        id: request-report-task-usage
        if: ${{ !cancelled() }}
        env: *report-dispatch-env
        run: bash dispatcher/.github/scripts/dispatch-task-reports.sh report-task-usage.yml
      - name: Request publish-agent-history.yml
        id: request-publish-agent-history
        if: ${{ !cancelled() }}
        env: *report-dispatch-env
        run: bash dispatcher/.github/scripts/dispatch-task-reports.sh publish-agent-history.yml
      - name: Request publish-retro.yml
        id: request-publish-retro
        if: ${{ !cancelled() }}
        env: *report-dispatch-env
        run: bash dispatcher/.github/scripts/dispatch-task-reports.sh publish-retro.yml
      - name: Request publish-visual-report.yml
        id: request-publish-visual-report
        if: ${{ !cancelled() }}
        env: *report-dispatch-env
        run: bash dispatcher/.github/scripts/dispatch-task-reports.sh publish-visual-report.yml
      - name: Request deploy-preview.yml
        id: request-deploy-preview
        if: ${{ !cancelled() }}
        env: *report-dispatch-env
        run: bash dispatcher/.github/scripts/dispatch-task-reports.sh deploy-preview.yml
      # A comment round was started with GITHUB_TOKEN, so its completion emits
      # no workflow_run for the comment queue; request the queue directly so the
      # next instruction starts now instead of at a late hourly sweep. The queue
      # waits for this run to complete before it reconciles.
      - name: Request comment-build-queue.yml
        id: request-comment-build-queue
        if: ${{ !cancelled() && needs.prepare.outputs.build_comment_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_ATTEMPT: ${{ github.run_attempt }}
          FACTORY_REPORT_REF: ${{ github.event.repository.default_branch }}
          ISSUE_NUMBER: ${{ needs.prepare.outputs.issue_number }}
        run: bash dispatcher/.github/scripts/dispatch-task-reports.sh comment-build-queue.yml

  reply:
    env:
      FACTORY_CONTROL_SHA: ${{ needs.prepare.outputs.control_sha }}
    needs: [prepare, agent, verify-final, publish, publish-failed]
    if: >-
      always() && !cancelled() &&
      needs.prepare.result == 'success' &&
      needs.prepare.outputs.status == 'ready' &&
      needs.prepare.outputs.build_comment_id != '' &&
      needs.agent.outputs.handoff != 'true' &&
      needs.agent.outputs.rerun_rejected != 'true'
    runs-on: ubuntu-24.04
    # 10 install + 15 reply budget, plus checkouts, setup and the upload.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.control_sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ (needs.publish.result == 'success' || needs.publish-failed.result == 'success') && needs.prepare.outputs.work_branch || needs.prepare.outputs.base_sha }}
          path: workspace
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: factory-task-${{ needs.prepare.outputs.issue_number }}
          path: task
      - name: Build reply prompt
        env:
          BUILD_RESULT: ${{ needs.publish-failed.result == 'success' && 'failure' || needs.publish.result }}
        run: node control/.github/scripts/comment-reply.mjs prompt task/task-metadata.json "$RUNNER_TEMP"
      - name: Install pinned Code Agent
        timeout-minutes: 10
        env: *agent-install-env
        run: node control/.github/scripts/install-agent.mjs
      - name: Answer source comment from current code
        env: *agent-run-env
        run: |
          CODE_AGENT_INVOCATION_TIMEOUT_SECONDS=900 node control/.github/scripts/run-agent.mjs \
            --workspace workspace \
            --prompt "$RUNNER_TEMP/comment-prompt.md" \
            --log "$RUNNER_TEMP/comment-artifacts/comment-agent.jsonl" \
            --agentDir "$RUNNER_TEMP/comment-agent"
      - name: Collect comment reply diagnostics
        if: always()
        env: *agent-run-env
        run: node control/.github/scripts/agent-invocation-record.mjs stage-reply "$RUNNER_TEMP" task/task-metadata.json

      - name: Save reply for trusted publisher
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: factory-comment-reply-${{ needs.prepare.outputs.build_comment_id }}
          path: ${{ runner.temp }}/comment-artifacts
          if-no-files-found: error
          retention-days: 14

  publish-reply:
    needs: [prepare, reply]
    if: ${{ !cancelled() && needs.reply.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.control_sha }}
          persist-credentials: false
          # comment-reply.mjs and everything it imports live here.
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: factory-task-${{ needs.prepare.outputs.issue_number }}
          path: task
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: factory-comment-reply-${{ needs.prepare.outputs.build_comment_id }}
          path: reply
      - name: Publish quoted reply
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/comment-reply.mjs publish task/task-metadata.json reply

  # Question rounds skip dispatch-reports, so they request their history here.
  # A /build round's history is already requested by dispatch-reports.
  # Uses the same retrying dispatcher and step name as dispatch-reports, and
  # report-dispatch-gate.yml reads this job too, so the workflow_run copy of
  # publish-agent-history does not publish the round a second time.
  dispatch-reply-history:
    needs: [prepare, reply, publish-reply]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.status == 'ready' && needs.prepare.outputs.build_comment_id != '' && needs.prepare.outputs.comment_kind == 'reply' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      # From this workflow file's revision, as in dispatch-reports.
      - name: Check out the report dispatcher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: dispatcher
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/dispatch-task-reports.sh
      - name: Request publish-agent-history.yml
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_ATTEMPT: ${{ github.run_attempt }}
          FACTORY_REPORT_REF: ${{ github.event.repository.default_branch }}
        run: bash dispatcher/.github/scripts/dispatch-task-reports.sh publish-agent-history.yml
      # As in dispatch-reports: start the Issue's next queued instruction now.
      - name: Request comment-build-queue.yml
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_ATTEMPT: ${{ github.run_attempt }}
          FACTORY_REPORT_REF: ${{ github.event.repository.default_branch }}
          ISSUE_NUMBER: ${{ needs.prepare.outputs.issue_number }}
        run: bash dispatcher/.github/scripts/dispatch-task-reports.sh comment-build-queue.yml
