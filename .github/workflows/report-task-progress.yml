name: Report Task Progress

on:
  repository_dispatch:
    types: [factory-progress]
  workflow_run:
    workflows: [Code Agent NocoBase Task]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Task run ID (not Issue number)
        required: true
        type: string
      attempt:
        description: Exact source run attempt
        required: true
        type: string
      issue:
        description: Source Issue number (optional; only selects the queue)
        required: false
        type: string

permissions: {}

# Serialize comment updates per Issue: a run's snapshots and its final report
# stay in order, and a continuation's first snapshots cannot race its
# predecessor's final report on the same comment, while other Issues' updates
# never queue behind them. Snapshots carry their Issue and the task's report
# dispatcher passes it; a workflow_run copy or a manual request without it
# falls back to its source run's group (expressions cannot parse the run's
# title). The publisher still derives the Issue from the source run and
# rejects late snapshots from an older run/attempt or a completed run.
concurrency:
  group: >-
    ${{ (github.event.client_payload.snapshot.issue || inputs.issue) &&
    format('factory-live-progress-issue-{0}', github.event.client_payload.snapshot.issue || inputs.issue) ||
    format('factory-live-progress-{0}', github.event.client_payload.snapshot.runId || inputs.run_id || github.event.workflow_run.id) }}
  queue: max

jobs:
  # The task usually requested this run itself; see report-dispatch-gate.yml.
  # A skipped task run (an Issue from someone without repository access) ran
  # nothing to report on, so it does not start this chain either.
  dispatch-gate:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'skipped'
    uses: ./.github/workflows/report-dispatch-gate.yml
    with:
      workflow: report-task-progress.yml
    permissions:
      actions: read

  report:
    needs: dispatch-gate
    if: >-
      !cancelled() && needs.dispatch-gate.outputs.covered != 'true' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      # The publisher needs only the scripts directory, and its builtin-only
      # imports run on the runner's bundled Node, so no Node download either.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Update the task's single progress comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/task-progress.mjs publish
