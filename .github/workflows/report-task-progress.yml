name: Report Task Progress

on:
  repository_dispatch:
    types: [factory-progress]
  workflow_run:
    workflows: [Code Agent NocoBase Task]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Task run ID (not Issue number)
        required: true
        type: string
      attempt:
        description: Exact source run attempt
        required: true
        type: string

permissions: {}

# Serialize short comment updates, not business runs. The publisher additionally
# rejects late snapshots from an older run/attempt or an already completed run.
concurrency:
  group: factory-live-progress
  queue: max

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Update the task's single progress comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/task-progress.mjs publish
