name: Deploy Task Preview

on:
  workflow_run:
    workflows: [Code Agent NocoBase Task]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Code Agent task run ID with a published build PR (including failed builds)
        required: true
        type: string
      attempt:
        description: Run attempt (leave empty for latest)
        required: false
        type: string
      force:
        description: Replace a running preview even when it already serves this commit
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  # The task usually requested this run itself; see report-dispatch-gate.yml.
  # A skipped task run (an Issue from someone without repository access) ran
  # nothing to report on, so it does not start this chain either.
  dispatch-gate:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'skipped'
    uses: ./.github/workflows/report-dispatch-gate.yml
    with:
      workflow: deploy-preview.yml
    permissions:
      actions: read

  # Waits for the source run in a job that holds no concurrency group, so the
  # global preview lock below is never held while the task's own
  # dispatch-reports job is still finishing (up to ten minutes); select then
  # reads a completed run at once. Same condition as the job it feeds, and the
  # attempt it settled on is passed through so a re-run started meanwhile
  # cannot make the locked job wait again.
  wait-for-source:
    needs: dispatch-gate
    if: >-
      !cancelled() && needs.dispatch-gate.outputs.covered != 'true' &&
      (github.event_name == 'workflow_dispatch' || contains(fromJSON('["success","failure","timed_out","cancelled"]'), github.event.workflow_run.conclusion))
    outputs:
      attempt: ${{ steps.wait.outputs.attempt }}
    runs-on: ubuntu-24.04
    # wait-for-task-run.mjs gives up after 11 minutes.
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: control
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
      - name: Wait for the source task run to complete
        id: wait
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
          SOURCE_ATTEMPT: ${{ inputs.attempt || github.event.workflow_run.run_attempt }}
        run: |
          node control/.github/scripts/wait-for-task-run.mjs \
            --run-id "$SOURCE_RUN_ID" --attempt "$SOURCE_ATTEMPT"

  # A task that hit the agent job's six-hour limit is reported as cancelled yet
  # still publishes a failed PR; select deploys only a published build, so a
  # cancel before publication deploys nothing.
  deploy-preview:
    needs: [dispatch-gate, wait-for-source]
    if: >-
      !cancelled() && needs.wait-for-source.result == 'success' &&
      needs.dispatch-gate.outputs.covered != 'true' &&
      (github.event_name == 'workflow_dispatch' || contains(fromJSON('["success","failure","timed_out","cancelled"]'), github.event.workflow_run.conclusion))
    runs-on: ubuntu-24.04
    # The bounded steps alone take up to 45 minutes: Publish 10, Deploy 30 and
    # the public check's 5. Checkout, the ~84 MB download, the tailnet,
    # the deploy key and making room come on top, so 45 minutes could cut a
    # slow deploy off before its own limits and skip the PR notice. The source
    # wait runs in wait-for-source, outside the lock, so this holds the lock
    # only for deploying.
    timeout-minutes: 60
    # Serialized with teardown-preview in preview-teardown.yml. At job level, so
    # a copy the dispatch gate covers or skips never queues behind a deploy.
    concurrency:
      group: factory-preview-deploy
      queue: max
    permissions:
      actions: read
      # Write, for one thing only: the temporary release asset the host fetches
      # the payload from. Nothing here writes to a branch.
      contents: write
      pull-requests: write
    env:
      SOURCE_RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
      # The attempt wait-for-source settled on; see that job.
      SOURCE_ATTEMPT: ${{ needs.wait-for-source.outputs.attempt || inputs.attempt || github.event.workflow_run.run_attempt }}
      PREVIEW_HOST: ${{ vars.FACTORY_PREVIEW_HOST || '100.120.77.102' }}
      PREVIEW_USER: ${{ vars.FACTORY_PREVIEW_USER || 'root' }}
      PREVIEW_DOMAIN: ${{ vars.FACTORY_PREVIEW_DOMAIN || 'nfvd.net' }}
      # The preview host reaches GitHub through its own egress; this is that proxy.
      # Unused when the host can reach it directly.
      PREVIEW_FETCH_PROXY: ${{ vars.FACTORY_PREVIEW_FETCH_PROXY || 'http://192.168.2.250:7890' }}
      PREVIEW_RELEASE: factory-previews
      # Only a deliberate replay asks for the running preview to be replaced. An
      # automatic deploy never does: the same build is requested twice when this
      # workflow is dispatched by the task and by the completion event, and the
      # second request must leave the first one's instance alone.
      PREVIEW_FORCE: ${{ inputs.force || 'false' }}
      # A preview is optional infrastructure. When its credentials are absent
      # this workflow stays a no-op rather than failing the task's run record.
      PREVIEW_ENABLED: ${{ secrets.FACTORY_PREVIEW_SSH_KEY != '' && secrets.FACTORY_TAILSCALE_OAUTH_CLIENT_ID != '' && secrets.FACTORY_TAILSCALE_OAUTH_CLIENT_SECRET != '' }}
    steps:
      # Trusted control code only. The build artifact is data here: it is
      # published unchanged and never executed on the runner.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: control
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x

      - name: Select a published build with a deployable archive
        id: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node control/.github/scripts/deploy-preview.mjs select \
            --run-id "$SOURCE_RUN_ID" --attempt "$SOURCE_ATTEMPT" \
            --source "$RUNNER_TEMP/preview-source.json"

      # Before the download: without credentials nothing is deployed, so the
      # build (~84 MB packed, ~744 MB unpacked) is not fetched or unpacked either.
      - name: Skip without preview credentials
        if: steps.source.outputs.ready == 'true' && env.PREVIEW_ENABLED != 'true'
        run: |
          echo "::warning::PREVIEW SKIPPED: set FACTORY_PREVIEW_SSH_KEY, FACTORY_TAILSCALE_OAUTH_CLIENT_ID and FACTORY_TAILSCALE_OAUTH_CLIENT_SECRET to deploy previews."

      - name: Download the deployable build
        if: steps.source.outputs.ready == 'true' && env.PREVIEW_ENABLED == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # By ID: the name is shared by every attempt of the run, and select
          # chose the one this attempt's packaging job uploaded.
          artifact-ids: ${{ steps.source.outputs.artifact_id }}
          merge-multiple: true
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/dist-artifact

      - name: Unpack the deployable build
        if: steps.source.outputs.ready == 'true' && env.PREVIEW_ENABLED == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/build"
          tar -xzf "$RUNNER_TEMP/dist-artifact/dist.tar.gz" -C "$RUNNER_TEMP/build"
          test -f "$RUNNER_TEMP/build/dist/package.json"

      - name: Resolve the pull request and the dependency identity
        id: prepare
        if: steps.source.outputs.ready == 'true' && env.PREVIEW_ENABLED == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/preview"
          node control/.github/scripts/deploy-preview.mjs prepare \
            --run-id "$SOURCE_RUN_ID" \
            --source "$RUNNER_TEMP/preview-source.json" \
            --artifacts "$RUNNER_TEMP/dist-artifact" \
            --build "$RUNNER_TEMP/build" \
            --domain "$PREVIEW_DOMAIN" \
            --output "$RUNNER_TEMP/preview"

      - name: Join the tailnet
        if: steps.prepare.outputs.ready == 'true' && env.PREVIEW_ENABLED == 'true'
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.FACTORY_TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.FACTORY_TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:ci
          # Keep public DNS on the runner; the preview host is a Tailscale IP.
          args: --accept-dns=false

      - name: Install the deploy key
        if: steps.prepare.outputs.ready == 'true' && env.PREVIEW_ENABLED == 'true'
        env:
          PREVIEW_SSH_KEY: ${{ secrets.FACTORY_PREVIEW_SSH_KEY }}
        run: |
          bash control/.github/scripts/preview-connect.sh

      - name: Send the host scripts
        id: scripts
        if: steps.prepare.outputs.ready == 'true' && env.PREVIEW_ENABLED == 'true'
        run: |
          set -euo pipefail
          ssh_opts=(-i ~/.ssh/preview_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          remote="$PREVIEW_USER@$PREVIEW_HOST"

          # The host always runs the scripts from this repository, so a fix is
          # deployed by pushing, never by editing files on the machine. These are
          # kilobytes; the payload is what is too big to come this way.
          tar -czf "$RUNNER_TEMP/preview-scripts.tar.gz" -C control/.github/scripts/preview .
          ssh "${ssh_opts[@]}" "$remote" 'mkdir -p /srv/nb3-preview/scripts /srv/nb3-preview/tmp'
          scp -q -i ~/.ssh/preview_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$RUNNER_TEMP/preview-scripts.tar.gz" "$remote:/srv/nb3-preview/tmp/scripts.tar.gz"
          ssh "${ssh_opts[@]}" "$remote" \
            'tar -xzf /srv/nb3-preview/tmp/scripts.tar.gz -C /srv/nb3-preview/scripts && chmod +x /srv/nb3-preview/scripts/*.sh'

      # Before anything is packaged or uploaded. The host refuses a new preview
      # beyond its instance limit, and finding that out only after a payload
      # (~84 MB with dependencies) was published as a public release asset is how most deploys
      # failed once open build PRs outnumbered the slots. A full host first gives
      # up previews of closed PRs, then of failed builds, oldest first; when only
      # successful builds of open PRs remain, this deploy is skipped and the PR
      # is told why, rather than the run failing.
      - name: Make room on the preview host
        id: capacity
        if: steps.scripts.outcome == 'success'
        env:
          PR: ${{ steps.prepare.outputs.pr }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ssh_opts=(-i ~/.ssh/preview_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          remote="$PREVIEW_USER@$PREVIEW_HOST"
          ssh "${ssh_opts[@]}" "$remote" \
            "bash /srv/nb3-preview/scripts/preview-capacity.sh --pr '$PR'" \
            > "$RUNNER_TEMP/preview/capacity.txt"
          node control/.github/scripts/deploy-preview.mjs capacity \
            --run-id "$SOURCE_RUN_ID" \
            --listing "$RUNNER_TEMP/preview/capacity.txt" \
            --output "$RUNNER_TEMP/preview"
          while read -r victim reason; do
            [[ "$victim" =~ ^[1-9][0-9]*$ ]] || { echo "::error::unexpected eviction entry"; exit 1; }
            # -n: without it ssh reads the rest of the eviction list as its stdin.
            ssh -n "${ssh_opts[@]}" "$remote" "bash /srv/nb3-preview/scripts/preview-destroy.sh '$victim'"
            # Its public payload assets go with it, as they would at teardown.
            # </dev/null: like ssh -n, so nothing it runs can read the eviction list.
            bash control/.github/scripts/delete-preview-payloads.sh "$victim" </dev/null ||
              echo "::warning::Could not delete the payload assets of evicted PR #$victim."
            # The notice is a courtesy; the eviction it describes already happened.
            node control/.github/scripts/deploy-preview.mjs evicted \
              --run-id "$SOURCE_RUN_ID" --output "$RUNNER_TEMP/preview" \
              --pr "$victim" --reason "$reason" </dev/null ||
              echo "::warning::Could not tell PR #$victim that its preview was evicted."
          done < "$RUNNER_TEMP/preview/evict.txt"

      # Step limits, well inside the job's 60 minutes: a stalled transfer fails
      # this step, so the report below still tells the PR, instead of the job
      # being cancelled at its limit with no notice. ServerAliveInterval drops
      # an ssh session whose Tailscale path went silent within a minute.
      - name: Publish the payload for the host to fetch
        id: publish
        if: steps.capacity.outputs.room == 'true'
        timeout-minutes: 10
        env:
          PR: ${{ steps.prepare.outputs.pr }}
          DEPS_KEY: ${{ steps.prepare.outputs.deps_key }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ssh_opts=(-i ~/.ssh/preview_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          remote="$PREVIEW_USER@$PREVIEW_HOST"

          # Unpacked, the dependency tree is ~740 MB of a ~744 MB build (packed,
          # ~82 of ~84 MB) and changes only with the dependency set, so ask the
          # host before shipping it: a cache hit sends ~2 MB.
          present="$(ssh "${ssh_opts[@]}" "$remote" "${{ steps.prepare.outputs.probe }}")"
          if [[ "$present" == present ]]; then
            echo "Dependency cache hit; sending the application tree only."
            tar -czf "$RUNNER_TEMP/payload.tar.gz" \
              -C "$RUNNER_TEMP/build" -T "$RUNNER_TEMP/preview/slim-entries.txt"
          else
            echo "Dependency cache miss; sending the full build."
            cp "$RUNNER_TEMP/dist-artifact/dist.tar.gz" "$RUNNER_TEMP/payload.tar.gz"
          fi
          ls -lh "$RUNNER_TEMP/payload.tar.gz"

          # A temporary release asset is the rendezvous: this runner uploads to
          # GitHub in seconds, and the host fetches it over its own egress, which
          # measured 815 KB/s where pushing the same bytes over Tailscale to the
          # host measured 17 KB/s. The repository is public, so the fetch needs no
          # credential on the host — and the asset is deleted when the PR closes.
          #
          # The name carries the payload's digest, so one name always means the
          # same bytes. One name per pull request, replaced with `--clobber`, is
          # what reported a live preview as a failed deployment (PR #159,
          # 2026-09-21): the same run was deployed twice, the second upload
          # replaced the asset, and a fetch seconds later was still answered with
          # the previous bytes — so the digest check refused a payload that had
          # in fact been published.
          digest="$(sha256sum "$RUNNER_TEMP/payload.tar.gz" | cut -d' ' -f1)"
          asset="preview-pr-$PR-${digest:0:16}.tar.gz"
          if ! gh release view "$PREVIEW_RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$PREVIEW_RELEASE" --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "Factory preview payloads" \
              --notes "Temporary build payloads the preview host fetches. One asset per deployed payload, deleted when its pull request closes."
          fi
          # Named before it is uploaded: an asset takes its name from the file, and
          # the URL the host is given is built from that name.
          cp "$RUNNER_TEMP/payload.tar.gz" "$RUNNER_TEMP/$asset"
          gh release upload "$PREVIEW_RELEASE" --repo "$GITHUB_REPOSITORY" --clobber \
            "$RUNNER_TEMP/$asset"
          echo "payload_asset=$asset" >> "$GITHUB_OUTPUT"
          echo "payload_sha256=$digest" >> "$GITHUB_OUTPUT"

      - name: Deploy the preview
        id: deploy
        if: steps.publish.outcome == 'success'
        # The host fetches the packed payload, ~84 MB with dependencies or ~2 MB
        # on a dependency cache hit (factory-dist and factory-previews assets,
        # 2026-10-06), in about two minutes at 815 KB/s. A transfer slower than
        # 50 KB/s for two minutes counts as stalled and resumes; one that stays
        # just above that floor could still take ~28 minutes, hence the limit.
        timeout-minutes: 30
        env:
          PR: ${{ steps.prepare.outputs.pr }}
          SHA: ${{ steps.prepare.outputs.sha }}
          DEPS_KEY: ${{ steps.prepare.outputs.deps_key }}
          # Recorded on the host, so a full host can tell a failed build's
          # preview, which may give way, from a successful one, which never does.
          BUILD_STATUS: ${{ steps.prepare.outputs.build_status }}
        run: |
          set -euo pipefail
          # Built from the asset name this run published, so the URL the host
          # fetches and the asset that was just uploaded cannot drift apart.
          asset_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$PREVIEW_RELEASE/${{ steps.publish.outputs.payload_asset }}"
          redeploy=""
          if [[ "${PREVIEW_FORCE:-false}" == 'true' ]]; then redeploy="--redeploy"; fi
          ssh -i ~/.ssh/preview_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$PREVIEW_USER@$PREVIEW_HOST" \
            "bash /srv/nb3-preview/scripts/preview-deploy.sh \
               --pr '$PR' \
               --sha '$SHA' \
               --deps-key '$DEPS_KEY' \
               --domain '$PREVIEW_DOMAIN' \
               --payload '/srv/nb3-preview/tmp/payload-pr-$PR.tar.gz' \
               --payload-url '$asset_url' \
               --payload-sha256 '${{ steps.publish.outputs.payload_sha256 }}' \
               --fetch-proxy '$PREVIEW_FETCH_PROXY' \
               --build-status '$BUILD_STATUS' \
               $redeploy"

      - name: Verify the public preview URL
        id: public
        if: steps.deploy.outcome == 'success'
        # preview-public-check.mjs gives up after 120 s, but a DNS question or
        # probe in flight at that moment still has to return; 5 minutes bounds
        # the step without cutting its own diagnosis short.
        timeout-minutes: 5
        env:
          PREVIEW_URL: ${{ steps.prepare.outputs.url }}
        run: |
          node control/.github/scripts/preview-public-check.mjs
          test -s "$RUNNER_TEMP/preview-public.html"

      # After a failed deploy, not after a manual cancel: a cancelled run has no
      # outcome worth telling the pull request about.
      - name: Report the preview on the pull request
        if: ${{ !cancelled() && steps.prepare.outputs.ready == 'true' && env.PREVIEW_ENABLED == 'true' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node control/.github/scripts/deploy-preview.mjs publish \
            --run-id "$SOURCE_RUN_ID" \
            --output "$RUNNER_TEMP/preview" \
            --status "${{ steps.public.outcome == 'success' && 'success' || steps.capacity.outcome == 'success' && steps.capacity.outputs.room == 'false' && 'skipped' || 'failed' }}"
