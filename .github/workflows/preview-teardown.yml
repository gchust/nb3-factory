name: Reclaim Task Preview

on:
  pull_request_target:
    types: [closed]

permissions: {}

concurrency:
  group: factory-preview-teardown-${{ github.event.pull_request.number }}
  queue: max

jobs:
  teardown-preview:
    # pull_request_target, not pull_request: this needs the preview credentials,
    # and only pull_request_target runs with secrets for a pull request that came
    # from a fork. Nothing from the pull request is ever checked out — only the
    # default branch, whose scripts do the work.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.event.pull_request.head.ref, 'agent/issue-') ||
       startsWith(github.event.pull_request.head.ref, 'pi/issue-'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      # Write, to delete the temporary payload asset this pull request published.
      contents: write
    env:
      PREVIEW_HOST: ${{ vars.FACTORY_PREVIEW_HOST || '100.120.77.102' }}
      PREVIEW_USER: ${{ vars.FACTORY_PREVIEW_USER || 'root' }}
      PREVIEW_RELEASE: factory-previews
      PREVIEW_ENABLED: ${{ secrets.FACTORY_PREVIEW_SSH_KEY != '' && secrets.FACTORY_TAILSCALE_OAUTH_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: control
          persist-credentials: false

      - name: Skip without preview credentials
        if: env.PREVIEW_ENABLED != 'true'
        run: |
          echo "::warning::PREVIEW TEARDOWN SKIPPED: no preview credentials are configured."

      - name: Join the tailnet
        if: env.PREVIEW_ENABLED == 'true'
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.FACTORY_TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.FACTORY_TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:ci
          targets: ${{ env.PREVIEW_HOST }}

      - name: Install the deploy key
        if: env.PREVIEW_ENABLED == 'true'
        env:
          PREVIEW_SSH_KEY: ${{ secrets.FACTORY_PREVIEW_SSH_KEY }}
        run: |
          bash control/.github/scripts/preview-connect.sh

      - name: Remove the preview
        if: env.PREVIEW_ENABLED == 'true'
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          [[ "$PR" =~ ^[1-9][0-9]*$ ]] || { echo "::error::unexpected pull request number"; exit 1; }
          ssh -i ~/.ssh/preview_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "$PREVIEW_USER@$PREVIEW_HOST" \
            "bash /srv/nb3-preview/scripts/preview-destroy.sh '$PR'"

      # The payload asset is the one thing a closed preview leaves behind on
      # GitHub, and it is public: the build is not something to keep lying around
      # once nothing is serving it.
      - name: Delete the temporary payload
        env:
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete-asset "$PREVIEW_RELEASE" "preview-pr-$PR.tar.gz" \
            --repo "$GITHUB_REPOSITORY" --yes ||
            echo "no payload asset for PR #$PR; nothing to delete"
