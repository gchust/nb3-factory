name: Reclaim Task Preview

on:
  pull_request_target:
    types: [closed, reopened]

permissions: {}

jobs:
  teardown-preview:
    # pull_request_target, not pull_request: this needs the preview credentials,
    # and only pull_request_target runs with secrets for a pull request that came
    # from a fork. Nothing from the pull request is ever checked out — only the
    # default branch, whose scripts do the work.
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'agent/issue-')
    runs-on: ubuntu-24.04
    # Three removal attempts of up to ~3 minutes each (the host waits that
    # long for the deploy lock), with 45 s of pauses, after the SSH check and
    # sending the scripts.
    timeout-minutes: 20
    # The deploy job's group and queue, so deploys and teardowns run in the
    # order they reach it. A deploy for this PR that holds the group first
    # finishes and is then removed here; one that gets it later sees the closed
    # PR (deploy-preview.mjs checks inside the group) and skips. With a group of
    # its own, a late deploy could outlive its teardown. At job level, so the
    # run of every other closed PR skips without queuing behind a deploy.
    concurrency:
      group: factory-preview-deploy
      queue: max
    # No continue-on-error: a failed teardown leaves a public preview running,
    # and a green run would hide that nothing reclaims it.
    permissions:
      # Write, to delete the temporary payload asset this pull request published.
      contents: write
    env:
      PREVIEW_HOST: ${{ vars.FACTORY_PREVIEW_HOST || '100.120.77.102' }}
      PREVIEW_USER: ${{ vars.FACTORY_PREVIEW_USER || 'root' }}
      PREVIEW_RELEASE: factory-previews
      PREVIEW_ENABLED: ${{ secrets.FACTORY_PREVIEW_SSH_KEY != '' && secrets.FACTORY_TAILSCALE_OAUTH_CLIENT_ID != '' && secrets.FACTORY_TAILSCALE_OAUTH_CLIENT_SECRET != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: control
          persist-credentials: false

      - name: Skip without preview credentials
        if: env.PREVIEW_ENABLED != 'true'
        run: |
          echo "::warning::PREVIEW TEARDOWN SKIPPED: no preview credentials are configured."

      # From the trusted control checkout; see deploy-preview.yml.
      - name: Connect to the preview host
        if: env.PREVIEW_ENABLED == 'true'
        uses: ./control/.github/actions/preview-connect
        with:
          tailscale-oauth-client-id: ${{ secrets.FACTORY_TAILSCALE_OAUTH_CLIENT_ID }}
          tailscale-oauth-secret: ${{ secrets.FACTORY_TAILSCALE_OAUTH_CLIENT_SECRET }}
          ssh-key: ${{ secrets.FACTORY_PREVIEW_SSH_KEY }}

      # As the deploy does, so a fix to preview-destroy.sh or preview-lib.sh
      # applies to this teardown rather than to the one after the next deploy.
      # A failure here leaves the scripts the last deploy sent, which still
      # remove a preview; leaving it running would be worse.
      - name: Send the host scripts
        if: env.PREVIEW_ENABLED == 'true'
        continue-on-error: true
        timeout-minutes: 3
        run: |
          bash control/.github/scripts/preview-send-scripts.sh control/.github/scripts/preview

      - name: Remove the preview
        if: env.PREVIEW_ENABLED == 'true'
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          [[ "$PR" =~ ^[1-9][0-9]*$ ]] || { echo "::error::unexpected pull request number"; exit 1; }
          # A dropped connection (`kex_exchange_identification: Connection
          # reset by peer`, PR #426) left the preview running. preview-destroy.sh
          # is idempotent, so a retry after a partial run is safe.
          for attempt in 1 2 3; do
            if ssh -n -i ~/.ssh/preview_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
              "$PREVIEW_USER@$PREVIEW_HOST" \
              "bash /srv/nb3-preview/scripts/preview-destroy.sh '$PR'"; then
              exit 0
            fi
            (( attempt < 3 )) || break
            echo "::warning::Removing the preview failed (attempt $attempt); retrying in $(( attempt * 15 )) s."
            sleep $(( attempt * 15 ))
          done
          echo "::error::Could not remove the preview for PR #$PR after 3 attempts; it is still running."
          exit 1

      # The payload assets are the one thing a closed preview leaves behind on
      # GitHub, and they are public: the build is not something to keep lying
      # around once nothing is serving it. They go even when removing the
      # preview failed; that failure still fails the job.
      - name: Delete the temporary payloads
        if: ${{ !cancelled() }}
        env:
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          bash control/.github/scripts/delete-preview-payloads.sh "$PR"

  # A reopened build PR gets its preview back: its latest published build is
  # deployed again through the ordinary replay path (Deploy Task Preview with
  # that run ID), which re-checks everything itself — the run, its artifact,
  # that the PR is open and still names that run. The teardown's closed mark
  # does not stop it: the deploy starts after the mark was written. Holds no
  # preview credentials and no concurrency group; the deploy queues in its own.
  restore-preview:
    if: >-
      github.event.action == 'reopened' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'agent/issue-')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # To dispatch deploy-preview.yml.
      actions: write
    steps:
      - name: Redeploy the latest published build
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          # Data only: matched against a fixed pattern, never executed.
          PR_BODY: ${{ github.event.pull_request.body }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # publish-pr.mjs writes this line for the task run that published the
          # PR's current build; deploy-preview.mjs requires it to match.
          prefix="- [GitHub Actions 运行记录](https://github.com/$GITHUB_REPOSITORY/actions/runs/"
          run_id="$(printf '%s\n' "$PR_BODY" | grep -F -- "$prefix" | tail -n 1 \
            | sed -nE 's#.*/actions/runs/([1-9][0-9]*)\).*#\1#p' || true)"
          if [[ ! "$run_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "::notice::PR #$PR names no task run of this repository; no preview to restore."
            exit 0
          fi
          gh workflow run deploy-preview.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH" \
            --field "run_id=$run_id"
          echo "Requested a preview of task run $run_id for reopened PR #$PR."
