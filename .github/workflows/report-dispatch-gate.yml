name: Report dispatch gate

# Each task report is requested twice: the task's dispatch-reports job
# dispatches it explicitly (the only path for bot-started continuations), and
# GitHub also raises workflow_run when the task completes. When the explicit
# request for the caller's own workflow went out, the workflow_run copy would
# only repeat the same work: wait
# for the run, download its artifacts, and for previews upload the ~84 MB
# payload again, while holding a global queue. Callers run this only for
# workflow_run events and skip their work when it reports `covered`.
#
# Each report has its own `Request <workflow>` step in the task, and the gate
# reads only the caller's, so one failed request does not make all six
# workflow_run copies redo their work. Runs from before that split have one
# combined step, which still counts for every report.
#
# It fails open: an API error or an older run without either step leaves
# `covered` false, and the caller does the work as before.

on:
  workflow_call:
    inputs:
      workflow:
        description: The caller's workflow file, as the task's request step names it
        required: true
        type: string
    outputs:
      covered:
        description: "'true' when the source run's dispatch-reports job already requested this report"
        value: ${{ jobs.check.outputs.covered }}

permissions: {}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      actions: read
    outputs:
      covered: ${{ steps.check.outputs.covered }}
    steps:
      - name: Check whether the task already dispatched this report
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          WORKFLOW: ${{ inputs.workflow }}
        run: |
          set -euo pipefail
          covered=false
          if [[ "$RUN_ID" =~ ^[1-9][0-9]*$ && "$ATTEMPT" =~ ^[1-9][0-9]*$ && "$WORKFLOW" =~ ^[a-z-]+\.yml$ ]]; then
            # The step names are the contract with code-agent-task.yml. Three
            # attempts ride out a transient API error; at most about 70 s.
            found=''
            for attempt in 1 2 3; do
              if found="$(timeout --kill-after=5s 20s gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/attempts/$ATTEMPT/jobs?per_page=100" \
                --jq '[.jobs[] | select(.name == "dispatch-reports" or .name == "dispatch-reply-history") | .steps[]? |
                  select((.name == "Request '"$WORKFLOW"'" or .name == "Explicitly request task reports (including continuations)") and .conclusion == "success")] | length')"; then
                break
              fi
              found=''
              if [[ "$attempt" -lt 3 ]]; then sleep $((attempt * 3)); fi
            done
            if [[ -n "$found" ]]; then
              [[ "$found" =~ ^[1-9] ]] && covered=true
            else
              echo "::warning::Could not read the source run's jobs; doing the work here."
            fi
          fi
          echo "covered=$covered" >> "$GITHUB_OUTPUT"
          echo "$WORKFLOW already dispatched by run $RUN_ID attempt $ATTEMPT: $covered"
