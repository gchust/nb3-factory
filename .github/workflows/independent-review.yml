name: Independent code and Skill review

on:
  workflow_dispatch:
    inputs:
      issue:
        description: Executed task Issue (not preset)
        required: true
        type: string
      run:
        description: Exact delivered task run ID
        required: true
        type: string
      attempt:
        description: Exact task attempt
        default: '1'
        type: string

env:
  # Only the public Agent settings agent-configuration.mjs reads. Never pass
  # the whole vars context: each step prints its env in the public log, so
  # every repository variable would reach every step, model runs included.
  FACTORY_AGENT_CONFIG_JSON: >-
    {
    "CODE_AGENT_ENGINE": ${{ toJSON(vars.CODE_AGENT_ENGINE) }},
    "CODE_AGENT_VERSION": ${{ toJSON(vars.CODE_AGENT_VERSION) }},
    "PI_VERSION": ${{ toJSON(vars.PI_VERSION) }},
    "CODEBUDDY_VERSION": ${{ toJSON(vars.CODEBUDDY_VERSION) }},
    "CLAUDE_CODE_VERSION": ${{ toJSON(vars.CLAUDE_CODE_VERSION) }},
    "CODEX_VERSION": ${{ toJSON(vars.CODEX_VERSION) }},
    "OPENCODE_VERSION": ${{ toJSON(vars.OPENCODE_VERSION) }},
    "CODE_AGENT_MODEL": ${{ toJSON(vars.CODE_AGENT_MODEL) }},
    "PI_MODEL": ${{ toJSON(vars.PI_MODEL) }},
    "CODEBUDDY_MODEL": ${{ toJSON(vars.CODEBUDDY_MODEL) }},
    "CLAUDE_CODE_MODEL": ${{ toJSON(vars.CLAUDE_CODE_MODEL) }},
    "CODEX_MODEL": ${{ toJSON(vars.CODEX_MODEL) }},
    "OPENCODE_MODEL": ${{ toJSON(vars.OPENCODE_MODEL) }},
    "CODE_AGENT_API_TYPE": ${{ toJSON(vars.CODE_AGENT_API_TYPE) }},
    "PI_API_TYPE": ${{ toJSON(vars.PI_API_TYPE) }},
    "CODE_AGENT_THINKING": ${{ toJSON(vars.CODE_AGENT_THINKING) }},
    "PI_THINKING": ${{ toJSON(vars.PI_THINKING) }},
    "CODEBUDDY_THINKING": ${{ toJSON(vars.CODEBUDDY_THINKING) }},
    "CODE_AGENT_AUTH_HEADER": ${{ toJSON(vars.CODE_AGENT_AUTH_HEADER) }},
    "PI_AUTH_HEADER": ${{ toJSON(vars.PI_AUTH_HEADER) }},
    "CODE_AGENT_SUPPORTS_DEVELOPER_ROLE": ${{ toJSON(vars.CODE_AGENT_SUPPORTS_DEVELOPER_ROLE) }},
    "PI_SUPPORTS_DEVELOPER_ROLE": ${{ toJSON(vars.PI_SUPPORTS_DEVELOPER_ROLE) }},
    "CODE_AGENT_SUPPORTS_REASONING_EFFORT": ${{ toJSON(vars.CODE_AGENT_SUPPORTS_REASONING_EFFORT) }},
    "PI_SUPPORTS_REASONING_EFFORT": ${{ toJSON(vars.PI_SUPPORTS_REASONING_EFFORT) }},
    "CODE_AGENT_MODEL_REASONING": ${{ toJSON(vars.CODE_AGENT_MODEL_REASONING) }},
    "CODE_AGENT_INVOCATION_TIMEOUT_SECONDS": ${{ toJSON(vars.CODE_AGENT_INVOCATION_TIMEOUT_SECONDS) }},
    "PI_INVOCATION_TIMEOUT_SECONDS": ${{ toJSON(vars.PI_INVOCATION_TIMEOUT_SECONDS) }},
    "CODE_AGENT_IDLE_TIMEOUT_SECONDS": ${{ toJSON(vars.CODE_AGENT_IDLE_TIMEOUT_SECONDS) }},
    "CLAUDE_CODE_EFFORT": ${{ toJSON(vars.CLAUDE_CODE_EFFORT) }},
    "CLAUDE_CODE_QA_EFFORT": ${{ toJSON(vars.CLAUDE_CODE_QA_EFFORT) }},
    "CODEX_REASONING_EFFORT": ${{ toJSON(vars.CODEX_REASONING_EFFORT) }},
    "CODEX_QA_REASONING_EFFORT": ${{ toJSON(vars.CODEX_QA_REASONING_EFFORT) }},
    "OPENCODE_VARIANT": ${{ toJSON(vars.OPENCODE_VARIANT) }},
    "OPENCODE_QA_VARIANT": ${{ toJSON(vars.OPENCODE_QA_VARIANT) }},
    "CODEBUDDY_BASE_URL": ${{ toJSON(vars.CODEBUDDY_BASE_URL) }},
    "CODEBUDDY_INTERNET_ENVIRONMENT": ${{ toJSON(vars.CODEBUDDY_INTERNET_ENVIRONMENT) }},
    "ANTHROPIC_BASE_URL": ${{ toJSON(vars.ANTHROPIC_BASE_URL) }},
    "CODEX_BASE_URL": ${{ toJSON(vars.CODEX_BASE_URL) }},
    "OPENCODE_BASE_URL": ${{ toJSON(vars.OPENCODE_BASE_URL) }},
    "CODE_AGENT_PROVIDER_ID": ${{ toJSON(vars.CODE_AGENT_PROVIDER_ID) }},
    "FACTORY_QA_THINKING": ${{ toJSON(vars.FACTORY_QA_THINKING) }},
    "FACTORY_REVIEW_THINKING": ${{ toJSON(vars.FACTORY_REVIEW_THINKING) }},
    "FACTORY_BUILD_REVIEW": ${{ toJSON(vars.FACTORY_BUILD_REVIEW) }},
    "FACTORY_BUILD_REVIEW_TIMEOUT_SECONDS": ${{ toJSON(vars.FACTORY_BUILD_REVIEW_TIMEOUT_SECONDS) }},
    "FACTORY_BUILD_REVIEW_IDLE_TIMEOUT_SECONDS": ${{ toJSON(vars.FACTORY_BUILD_REVIEW_IDLE_TIMEOUT_SECONDS) }},
    "AGENT_BROWSER_VERSION": ${{ toJSON(vars.AGENT_BROWSER_VERSION) }}
    }

permissions: {}
# One review per Issue at a time. Each review run has one comment and one
# history asset, keyed on the run id: a re-run of publish updates both in place
# instead of adding another. Parallel reviews of one Issue would interleave their
# comments and release uploads. (A run_id group never serialized anything.)
concurrency:
  group: factory-independent-review-${{ inputs.issue }}
  queue: max

jobs:
  prepare:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      ready: ${{ steps.bind.outcome == 'success' }}
      sha: ${{ steps.bind.outputs.sha }}
      control_sha: ${{ steps.pin.outputs.sha }}
      # The exact evidence artifacts; review and publish download these
      # originals themselves rather than a re-uploaded copy of them.
      source_run: ${{ steps.select.outputs.source_run }}
      task: ${{ steps.select.outputs.task }}
      agent: ${{ steps.select.outputs.agent }}
      final: ${{ steps.select.outputs.final }}
      # This job's own upload, by ID: after "Re-run failed jobs" a skipped
      # prepare keeps its first attempt's artifact, while github.run_attempt
      # names the new attempt, so a name built from it would not be found.
      input_artifact: ${{ steps.input.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: control
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
      - name: Pin trusted evaluator
        id: pin
        run: |
          echo "sha=$(git -C control rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "FACTORY_CONTROL_SHA=$(git -C control rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Resolve exact source artifact IDs
        id: select
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_ISSUE: ${{ inputs.issue }}
          SOURCE_RUN: ${{ inputs.run }}
          SOURCE_ATTEMPT: ${{ inputs.attempt || '1' }}
        run: |
          node control/.github/scripts/independent-review.mjs select --issue "$SOURCE_ISSUE" --run "$SOURCE_RUN" --attempt "$SOURCE_ATTEMPT" --output input
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.select.outputs.ready == 'true'
        with:
          artifact-ids: ${{ steps.select.outputs.task }}
          merge-multiple: true
          run-id: ${{ steps.select.outputs.source_run }}
          github-token: ${{ github.token }}
          path: input/task
      - name: Bind the rubric to its actual delivered commit
        id: bind
        if: steps.select.outputs.ready == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node control/.github/scripts/independent-review.mjs bind --input input
      # Only what this job produced. Binding reads the task evidence alone; the
      # agent and final evidence stays in the source run's artifacts, which the
      # later jobs download by exact ID, so this job never fetches them.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: input
        if: always() && steps.select.outputs.ready == 'true'
        with:
          name: factory-review-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            input/source.json
            input/binding.json
          retention-days: 14
          if-no-files-found: error

  review:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    # 10 install + 15 review budget, plus checkouts and three evidence downloads.
    timeout-minutes: 35
    permissions:
      contents: read
      # To download the source run's artifacts by ID.
      actions: read
    outputs:
      # By ID, so publish finds it after "Re-run failed jobs" too.
      review_artifact: ${{ steps.review-upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.control_sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          path: workspace
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
      # The same layout prepare bound: the evidence originals under their role
      # directories, and prepare's source.json and binding.json beside them.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.task }}
          merge-multiple: true
          run-id: ${{ needs.prepare.outputs.source_run }}
          github-token: ${{ github.token }}
          path: input/task
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.agent }}
          merge-multiple: true
          run-id: ${{ needs.prepare.outputs.source_run }}
          github-token: ${{ github.token }}
          path: input/agent
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.final }}
          merge-multiple: true
          run-id: ${{ needs.prepare.outputs.source_run }}
          github-token: ${{ github.token }}
          path: input/final
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.input_artifact }}
          merge-multiple: true
          path: input
      - name: Prepare separate review input
        run: node control/.github/scripts/independent-review.mjs prompt --input input --workspace workspace --output "$RUNNER_TEMP/review"
      - name: Install selected pinned reviewer
        # A hung registry otherwise holds the runner until the job limit.
        timeout-minutes: 10
        env:
          CODE_AGENT_ENGINE: ${{ vars.CODE_AGENT_ENGINE }}
          CODE_AGENT_VERSION: ${{ vars.CODE_AGENT_VERSION }}
          PI_VERSION: ${{ vars.PI_VERSION }}
          CODEBUDDY_VERSION: ${{ vars.CODEBUDDY_VERSION }}
          CLAUDE_CODE_VERSION: ${{ vars.CLAUDE_CODE_VERSION }}
          CODEX_VERSION: ${{ vars.CODEX_VERSION }}
          OPENCODE_VERSION: ${{ vars.OPENCODE_VERSION }}
          FACTORY_AGENT_INSTALL_RECORD: ${{ runner.temp }}/agent-install.json
        run: node control/.github/scripts/install-agent.mjs
      - name: Read-only independent review
        env:
          CODE_AGENT_ENGINE: ${{ vars.CODE_AGENT_ENGINE }}
          FACTORY_AGENT_INSTALL_RECORD: ${{ runner.temp }}/agent-install.json
          # Explicit engine selection; adding a CLI must not fall through to Pi.
          # This mapping is shared by implementation, repair/QA, and comment reply.
          CODE_AGENT_API_ENDPOINT: ${{ (vars.CODE_AGENT_ENGINE == '' || vars.CODE_AGENT_ENGINE == 'pi') && (secrets.CODE_AGENT_API_ENDPOINT || secrets.PI_API_ENDPOINT) || '' }}
          CODE_AGENT_API_KEY: ${{ (vars.CODE_AGENT_ENGINE == '' || vars.CODE_AGENT_ENGINE == 'pi') && (secrets.CODE_AGENT_API_KEY || secrets.PI_API_KEY) || '' }}
          CODEBUDDY_AUTH_TOKEN: ${{ vars.CODE_AGENT_ENGINE == 'codebuddy' && secrets.CODEBUDDY_AUTH_TOKEN || '' }}
          CODEBUDDY_API_KEY: ${{ vars.CODE_AGENT_ENGINE == 'codebuddy' && secrets.CODEBUDDY_API_KEY || '' }}
          CODEBUDDY_MODEL: ${{ vars.CODE_AGENT_ENGINE == 'codebuddy' && vars.CODEBUDDY_MODEL || '' }}
          CODEBUDDY_THINKING: ${{ vars.CODEBUDDY_THINKING || 'max' }}
          CODEBUDDY_BASE_URL: ${{ vars.CODE_AGENT_ENGINE == 'codebuddy' && vars.CODEBUDDY_BASE_URL || '' }}
          CODEBUDDY_INTERNET_ENVIRONMENT: ${{ vars.CODE_AGENT_ENGINE == 'codebuddy' && vars.CODEBUDDY_INTERNET_ENVIRONMENT || '' }}
          CODE_AGENT_API_TYPE: ${{ vars.CODE_AGENT_API_TYPE || vars.PI_API_TYPE || 'openai-completions' }}
          CODE_AGENT_MODEL: ${{ vars.CODE_AGENT_MODEL || vars.PI_MODEL }}
          CODE_AGENT_THINKING: ${{ vars.CODE_AGENT_THINKING || vars.PI_THINKING || 'max' }}
          CODE_AGENT_AUTH_HEADER: ${{ vars.CODE_AGENT_AUTH_HEADER || vars.PI_AUTH_HEADER || 'true' }}
          CODE_AGENT_SUPPORTS_DEVELOPER_ROLE: ${{ vars.CODE_AGENT_SUPPORTS_DEVELOPER_ROLE || vars.PI_SUPPORTS_DEVELOPER_ROLE }}
          CODE_AGENT_SUPPORTS_REASONING_EFFORT: ${{ vars.CODE_AGENT_SUPPORTS_REASONING_EFFORT || vars.PI_SUPPORTS_REASONING_EFFORT || 'true' }}
          CODE_AGENT_INVOCATION_TIMEOUT_SECONDS: 900
          ANTHROPIC_API_KEY: ${{ vars.CODE_AGENT_ENGINE == 'claude-code' && secrets.ANTHROPIC_API_KEY || '' }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ vars.CODE_AGENT_ENGINE == 'claude-code' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          ANTHROPIC_BASE_URL: ${{ vars.CODE_AGENT_ENGINE == 'claude-code' && vars.ANTHROPIC_BASE_URL || '' }}
          CLAUDE_CODE_MODEL: ${{ vars.CLAUDE_CODE_MODEL }}
          CLAUDE_CODE_EFFORT: ${{ vars.CLAUDE_CODE_EFFORT }}
          CLAUDE_CODE_QA_EFFORT: ${{ vars.CLAUDE_CODE_QA_EFFORT }}
          CODEX_API_KEY: ${{ vars.CODE_AGENT_ENGINE == 'codex' && secrets.CODEX_API_KEY || '' }}
          CODEX_MODEL: ${{ vars.CODEX_MODEL }}
          CODEX_BASE_URL: ${{ vars.CODE_AGENT_ENGINE == 'codex' && vars.CODEX_BASE_URL || '' }}
          CODEX_REASONING_EFFORT: ${{ vars.CODEX_REASONING_EFFORT }}
          CODEX_QA_REASONING_EFFORT: ${{ vars.CODEX_QA_REASONING_EFFORT }}
          OPENCODE_API_KEY: ${{ vars.CODE_AGENT_ENGINE == 'opencode' && secrets.OPENCODE_API_KEY || '' }}
          OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL }}
          OPENCODE_BASE_URL: ${{ vars.CODE_AGENT_ENGINE == 'opencode' && vars.OPENCODE_BASE_URL || '' }}
          OPENCODE_VARIANT: ${{ vars.OPENCODE_VARIANT }}
          OPENCODE_QA_VARIANT: ${{ vars.OPENCODE_QA_VARIANT }}
          CODE_AGENT_IDLE_TIMEOUT_SECONDS: ${{ vars.CODE_AGENT_IDLE_TIMEOUT_SECONDS }}
          FACTORY_AGENT_ROLE: review
          FACTORY_CONTROL_SHA: ${{ needs.prepare.outputs.control_sha }}
          FACTORY_TIMINGS_FILE: ${{ runner.temp }}/review/timings.jsonl
        run: |
          node control/.github/scripts/run-agent.mjs --workspace workspace --prompt "$RUNNER_TEMP/review/review-prompt.md" --log "$RUNNER_TEMP/review/agent-review.jsonl" --agentDir "$RUNNER_TEMP/reviewer"
          test -z "$(git -C workspace status --porcelain --untracked-files=all)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: review-upload
        if: always()
        with:
          name: factory-independent-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/review
          retention-days: 14
          if-no-files-found: warn

  publish:
    needs: [prepare, review]
    # After a failed review too, so the Issue says the review did not complete;
    # not after a manual cancel, which has nothing to publish.
    # An empty artifact-ids input would download every artifact of the run.
    if: ${{ !cancelled() && needs.prepare.outputs.ready == 'true' && needs.prepare.outputs.input_artifact != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      # To download the source run's artifacts by ID.
      actions: read
    steps:
      # A fresh job revalidates model-produced JSON against the original input.
      # No model credential, application install, or application script runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.control_sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          path: workspace
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
      # Validation hashes the runtime evidence the reviewer cited, so the same
      # originals land here under the same paths the review job saw.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.task }}
          merge-multiple: true
          run-id: ${{ needs.prepare.outputs.source_run }}
          github-token: ${{ github.token }}
          path: input/task
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.agent }}
          merge-multiple: true
          run-id: ${{ needs.prepare.outputs.source_run }}
          github-token: ${{ github.token }}
          path: input/agent
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.final }}
          merge-multiple: true
          run-id: ${{ needs.prepare.outputs.source_run }}
          github-token: ${{ github.token }}
          path: input/final
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.input_artifact }}
          merge-multiple: true
          path: input
      # An empty artifact-ids would download every artifact of the run.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.review.outputs.review_artifact != ''
        continue-on-error: true
        with:
          artifact-ids: ${{ needs.review.outputs.review_artifact }}
          merge-multiple: true
          path: review
      - name: Independently validate review identity and references
        id: validation
        if: needs.review.result == 'success'
        run: node control/.github/scripts/independent-review.mjs validate --input input --workspace workspace --output review
      - name: Pack only review outputs for long-term retention
        id: archive
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          VALIDATION_STATUS: ${{ steps.validation.outcome }}
        run: node control/.github/scripts/independent-review.mjs archive --input input --output review --archive "$RUNNER_TEMP/review-archive" --status "$VALIDATION_STATUS"
      - name: Upload independent review history
        id: release
        if: ${{ !cancelled() && steps.archive.outputs.asset != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ steps.archive.outputs.asset }}
        run: |
          set -euo pipefail
          # The first history publisher creates the shared release, whichever it is.
          if ! gh release view factory-history --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create factory-history --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "工厂运行历史" --notes "已脱敏的工厂可观察交互记录。"
          fi
          gh release upload factory-history "$RUNNER_TEMP/review-archive/$ASSET" --repo "$GITHUB_REPOSITORY" --clobber
          echo "url=https://github.com/$GITHUB_REPOSITORY/releases/download/factory-history/$ASSET" >> "$GITHUB_OUTPUT"
      - name: Publish results without altering the business verdict
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VALIDATION_STATUS: ${{ steps.validation.outcome }}
          REVIEW_ARCHIVE_URL: ${{ steps.release.outputs.url }}
        run: node control/.github/scripts/independent-review.mjs publish --input input --output review --status "$VALIDATION_STATUS"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: factory-validated-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: review/validated-review.json
          retention-days: 14
          if-no-files-found: warn
      - name: Preserve publication failure without rebuilding the application
        if: ${{ !cancelled() && (steps.archive.outcome != 'success' || steps.release.outcome != 'success') }}
        run: exit 1
