name: Code Agent PR Completed

on:
  # Metadata only: always use default-branch control code, including for older
  # application branches. Never check out or execute the PR's application code.
  pull_request_target:
    types: [closed]

permissions: {}

jobs:
  complete:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.event.pull_request.head.ref, 'agent/issue-') ||
       startsWith(github.event.pull_request.head.ref, 'pi/issue-'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: read
    steps:
      - name: Check out factory control plane
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Complete source Issue and wake next task
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/complete-pr.mjs "$GITHUB_EVENT_PATH"
