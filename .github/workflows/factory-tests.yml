name: Factory regression tests

on:
  pull_request:
    paths: ['.github/**']
  push:
    branches: [develop]
    paths: ['.github/**']

permissions:
  contents: read

jobs:
  factory-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Run control-plane regression tests
        run: node --test .github/scripts/tests/*.test.mjs
