name: Factory regression tests

# The factory also guards what it owns at the application root, and the
# template-owned guidance there that it must never edit (.github/AGENTS.md).
# No path filter: application-format checks the whole application root with
# Prettier, so a pull request touching only client/, server/, database/ or a
# root config file must run it too. The jobs take one to ten minutes.
on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request supersedes its earlier checks. Develop pushes and
# manual runs always finish: a shared group without a queue would let a third
# push replace a pending second one, and queue: max cannot be combined with
# cancel-in-progress, so each of them gets a group of its own.
concurrency:
  group: factory-tests-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which pull requests reach the browser tool. The control-plane suite and the
  # application format check still run on every change: the failed-delivery
  # smoke fixture applies to application files, and the format check covers the
  # whole application root.
  changes:
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'agent/issue-')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      browser: ${{ steps.files.outputs.browser }}
    steps:
      - name: List the changed files
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # A rename lists its old path as previous_filename: a file moved out of
          # .github/ is a factory change too.
          files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" --jq '.[] | .filename, (.previous_filename // empty)')"
          # The listing stops at 3000 files; a change that large runs everything.
          count="$(grep -c . <<<"$files" || true)"
          browser=false
          if (( count >= 3000 )) || grep -Eq '^(\.github/|package\.json$|pnpm-lock\.yaml$)' <<<"$files"; then
            browser=true
          fi
          echo "browser=$browser" >> "$GITHUB_OUTPUT"
          echo "$count changed file(s); browser preflight: $browser"

  factory-tests:
    # Build task PRs change the application, including its guidance, and are
    # verified by the task itself before a maintainer merges them into develop.
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'agent/issue-')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
      - name: Run control-plane regression tests
        # Concurrently, except the suites that touch the process table (browser
        # acceptance stops application processes, stale-app-port kills port
        # listeners), which run alone afterwards; see the script.
        run: bash .github/scripts/run-factory-tests.sh
      - name: Verify deterministic browser fixtures
        run: python3 .github/scripts/tests/browser-fixtures.test.py
      - name: Run preview DNS regression tests
        run: python3 .github/scripts/tests/preview-dns-sync.test.py
      - name: Render the shared report review example
        run: |
          node .github/reports/render-review-example.mjs "$RUNNER_TEMP/report.example.html"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: factory-report-example
          path: ${{ runner.temp }}/report.example.html
          retention-days: 14

  application-format:
    # Build task PRs change the application, including its guidance, and are
    # verified by the task itself before a maintainer merges them into develop.
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'agent/issue-')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
      - name: Check the application root as build verification formats it
        # Build tasks run this check over the whole application; a badly
        # formatted file here fails the first round of every task.
        run: node .github/scripts/check-application-format.mjs .

  browser-preflight:
    # Build task PRs change the application, including its guidance, and are
    # verified by the task itself before a maintainer merges them into develop.
    # Other pull requests skip it only when the file listing succeeded and shows no change
    # to the factory or its root manifests: a skipped job satisfies a required
    # check, so a failed listing runs it. Pushes and dispatches always run it.
    needs: changes
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' ||
      (!startsWith(github.head_ref, 'agent/issue-') && (needs.changes.result != 'success' || needs.changes.outputs.browser == 'true')))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
      # The build task's cache: same key and path, which the task's agent job
      # saves from develop, so pull requests can restore it. Saved here only
      # outside pull requests, whose caches no other branch could restore.
      - name: Restore the Agent Browser npm cache
        id: browser_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/agent-browser-npm
          key: agent-browser-npm-v2-${{ runner.os }}-${{ vars.AGENT_BROWSER_VERSION || '0.36.0' }}
      # The same version, override included, that build tasks install.
      - name: Install the pinned QA browser tool
        timeout-minutes: 5
        env:
          AGENT_BROWSER_VERSION: ${{ vars.AGENT_BROWSER_VERSION || '0.36.0' }}
          npm_config_cache: ${{ runner.temp }}/agent-browser-npm
        run: |
          npm install --global --prefer-offline "agent-browser@${AGENT_BROWSER_VERSION}"
          agent-browser --version
      - name: Save the Agent Browser npm cache
        if: github.event_name != 'pull_request' && steps.browser_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/agent-browser-npm
          key: ${{ steps.browser_cache.outputs.cache-primary-key }}
      - name: Exercise the real guarded browser without an application or model
        run: |
          export AGENT_BROWSER_EXECUTABLE_PATH="$(command -v google-chrome || command -v chromium)"
          # Each invocation uses a new namespace and cold browser, with no retry.
          for attempt in 1 2 3; do
            node .github/scripts/browser-preflight.mjs "$RUNNER_TEMP/browser-preflight/$attempt/report.json"
            node --input-type=module - "$RUNNER_TEMP/browser-preflight/$attempt/report.json" <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const {capabilities:c}=JSON.parse(readFileSync(process.argv[2]));
          assert.equal(c.moduleWorkerRequest,true,'Guarded module Worker must receive immediate messages and block external fetch');
          assert.equal(c.moduleBlobWorkerRequest,true,'Guarded blob Worker must retain transfers and message order');
          assert.equal(c.workerNetworkLeak,false,'Worker guard must not leak a forbidden request');
          NODE
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: factory-browser-preflight
          path: ${{ runner.temp }}/browser-preflight
          retention-days: 3
