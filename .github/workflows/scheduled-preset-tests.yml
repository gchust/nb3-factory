name: Preset build tests
run-name: "Preset tests · ${{ github.event_name == 'schedule' && 'daily' || github.event_name == 'workflow_dispatch' && (inputs.dry_run && 'preview' || 'manual') || 'initialize' }}"

on:
  # Only develop, the default branch, creates the factory:daily label; pushes
  # elsewhere would only start skipped runs.
  push:
    branches: [develop]
    paths:
      - '.github/workflows/scheduled-preset-tests.yml'
      - '.github/scripts/scheduled-preset-tests.mjs'
  # GitHub cron uses UTC: 18:23 is 02:23 the next day in UTC+8. That is only
  # the planned time: scheduled runs here start hours late (19:00 ran three to
  # five hours late, and daily-findings' off-hour 20:17 still runs 2.7 to five
  # hours late). Dispatch the workflow by hand when the time matters.
  schedule:
    - cron: '23 18 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '仅预览（可选）；默认立即搭建 factory:daily 标签案例；每日 UTC+8 02:23 自动搭建'
        required: true
        default: false
        type: boolean

permissions: {}

# Serialize only the launcher; keep manual and scheduled requests queued, not replaced.
# Child builds retain their existing per-Issue queue and active-case guard.
concurrency:
  group: factory-scheduled-preset-tests
  cancel-in-progress: false
  queue: max

jobs:
  initialize-label:
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The script imports only factory scripts.
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
      - name: Make the daily selection label available after merge (no build)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/scheduled-preset-tests.mjs --init-label

  launch:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The script imports only factory scripts.
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
      - name: Discover daily presets and dispatch independent build tests
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: node .github/scripts/scheduled-preset-tests.mjs
