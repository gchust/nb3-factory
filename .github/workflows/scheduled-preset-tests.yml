name: Preset build tests (manual legacy)
run-name: "Preset tests · ${{ github.event_name == 'schedule' && 'daily' || github.event_name == 'workflow_dispatch' && (inputs.dry_run && 'preview' || 'manual') || 'initialize' }}"

on:
  push:
    paths:
      - '.github/workflows/scheduled-preset-tests.yml'
      - '.github/scripts/scheduled-preset-tests.mjs'
  # Legacy manual entry. Automatic builds now use bounded Evaluation batches.
  workflow_dispatch:
    inputs:
      dry_run:
        description: '仅预览（可选）；默认立即搭建 factory:daily 标签案例；无自动定时'
        required: true
        default: false
        type: boolean

permissions: {}

# Serialize only the launcher; keep manual and scheduled requests queued, not replaced.
# Child builds retain their existing per-Issue queue and active-case guard.
concurrency:
  group: factory-scheduled-preset-tests
  cancel-in-progress: false
  queue: max

jobs:
  initialize-label:
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Make the daily selection label available after merge (no build)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/scheduled-preset-tests.mjs --init-label

  launch:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Discover daily presets and dispatch independent build tests
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: node .github/scripts/scheduled-preset-tests.mjs
