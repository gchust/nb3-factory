name: Refresh NocoBase Template

on:
  pull_request:
    branches: [develop]
    paths:
      - '.github/workflows/refresh-template.yml'
      - '.github/scripts/template-*.mjs'
      - '.github/scripts/overlay-factory.mjs'
      - '.github/scripts/publish-template.sh'
      # Run by the job below, directly, through the overlay or through verify.sh;
      # workflow-policy.test.mjs derives this list from the imports.
      - '.github/scripts/assert-current-template.mjs'
      - '.github/scripts/factory-eslint.mjs'
      - '.github/scripts/create-runtime-config.mjs'
      - '.github/scripts/install-browser-fonts.sh'
      - '.github/scripts/verify.sh'
      - '.github/scripts/apply-database.sh'
      - '.github/scripts/browser-smoke.mjs'
      - '.github/scripts/format-changes.mjs'
      - '.github/scripts/integration-checks.mjs'
      - '.github/scripts/required-checks.mjs'
      - '.github/scripts/stop-stale-app.sh'
      - '.github/scripts/timed-command.mjs'
      - '.github/scripts/timing.mjs'
      # Copied into the application by the overlay.
      # overlay-factory.mjs reads these from the control checkout.
      - '.npmrc'
      - 'README.MD'
      - 'package.json'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Generate and verify only; do not update develop
        type: boolean
        default: false

permissions: {}

# Serialize template refresh runs independently from application tasks.
# Publishing refuses a develop that moved during generation, so preset syncs
# (sync-issue-presets.yml, which commits to develop) share this queue. Pull
# request checks never publish and get a queue per PR, so a stack of PR pushes
# cannot hold a publish back. (queue: max cannot be combined with
# cancel-in-progress, so a superseded PR run still starts; its first step
# notices the newer head and the remaining steps skip.)
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('template-refresh-pr-{0}', github.event.pull_request.number) || 'template-refresh-global' }}
  queue: max

jobs:
  generate:
    # Publishing is owner-only. A PR check, from this repository or a fork,
    # holds no secrets and only read permission, and must not be skipped (a
    # skipped check passes). Build task PRs (agent/issue-N) are the exception:
    # they change the application, are verified by the task itself and never
    # land on develop, so a README or package.json change there must not start
    # a two-hour regeneration (factory-tests.yml skips them the same way).
    if: >-
      (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner) ||
      (github.event_name == 'pull_request' && !startsWith(github.head_ref, 'agent/issue-'))
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      # The supersede check reads the pull request's live head.
      pull-requests: read
    outputs:
      base_sha: ${{ steps.base.outputs.sha }}
    steps:
      - name: Require develop as the selected workflow branch
        if: github.event_name == 'workflow_dispatch'
        env:
          SELECTED_REF: ${{ github.ref }}
        run: |
          if [[ "$SELECTED_REF" != "refs/heads/develop" ]]; then
            echo "Run this workflow from develop." >&2
            exit 1
          fi

      # queue: max cannot be combined with cancel-in-progress, so a PR run
      # that a newer push already superseded still reaches a runner. Stop it
      # here, before the hour of generation and verification, instead of
      # spending it on a commit that is no longer the pull request's head.
      # The newer run reports on that head. An API failure fails open.
      - name: Stop when a newer push superseded this pull request run
        id: supersede
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          live_head="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha || true)"
          if [[ -n "$live_head" && "$live_head" != "$RUN_HEAD_SHA" ]]; then
            echo "::notice::Pull request #$PR_NUMBER moved from $RUN_HEAD_SHA to $live_head; the run for that head verifies it. Skipping the rest of this run."
            echo "superseded=true" >> "$GITHUB_OUTPUT"
          else
            echo "superseded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out current factory control plane
        if: steps.supersede.outputs.superseded != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # PRs verify their merge commit; manual publication still checks out develop.
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'develop' }}
          path: control
          persist-credentials: false

      - name: Record the exact develop commit
        id: base
        if: steps.supersede.outputs.superseded != 'true'
        working-directory: control
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.supersede.outputs.superseded != 'true'
        with:
          version: 11.7.0
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.supersede.outputs.superseded != 'true'
        with:
          node-version: 24.x

      # The official CLI installs dist/ as its own pnpm root, which never reads the
      # application's .npmrc, and pnpm 11 ignores scoped registries passed in
      # the environment. Only the user-level file reaches that nested install.
      - name: Expose the factory registry to nested pnpm roots
        if: steps.supersede.outputs.superseded != 'true'
        run: cat control/.npmrc >> ~/.npmrc

      - name: Pin the actual published application generator
        if: steps.supersede.outputs.superseded != 'true'
        run: node control/.github/scripts/template-creator.mjs pin control

      - name: Create a fresh application from the latest published template
        if: steps.supersede.outputs.superseded != 'true'
        # Takes seconds (--no-install); a hung registry fetch must not hold the
        # global refresh queue until the 120-minute job limit.
        timeout-minutes: 10
        env:
          CI: true
        run: |
          mkdir -p "$RUNNER_TEMP/template-generation" "$RUNNER_TEMP/template-diagnostics"
          cp control/.npmrc "$RUNNER_TEMP/template-generation/.npmrc"
          cd "$RUNNER_TEMP/template-generation"
          # Current create-app uses the template's database defaults; verification
          # supplies an isolated SQLite connection via create-runtime-config.mjs.
          pnpm create "@nocobase/app@$FACTORY_CREATOR_VERSION" nb3-factory \
            --no-install --template=default --template-tag=latest

      - name: Restore factory controls without changing template guidance
        if: steps.supersede.outputs.superseded != 'true'
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          node control/.github/scripts/overlay-factory.mjs \
            control "$RUNNER_TEMP/template-generation/nb3-factory" "$BASE_SHA"
          node control/.github/scripts/template-creator.mjs record "$RUNNER_TEMP/template-generation/nb3-factory/factory-template.json"

      # The store is keyed on the template version and the generated lockfile,
      # with the store of any earlier template under the prefix as a fallback,
      # so a new template release downloads only what changed. hashFiles()
      # reads the workspace only and the application is generated in
      # RUNNER_TEMP, so the key is computed here.
      # A cache saved by a pull_request run is scoped to that PR's merge ref and
      # no other PR can restore it, so only workflow_dispatch runs, which run
      # from develop, save (as source-baseline.yml does).
      - name: Locate the pnpm store
        id: pnpm-store
        if: steps.supersede.outputs.superseded != 'true'
        working-directory: ${{ runner.temp }}/template-generation/nb3-factory
        run: |
          echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
          node --input-type=module <<'KEY' >> "$GITHUB_OUTPUT"
          import { createHash } from 'node:crypto';
          import { existsSync, readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const pnpm = execFileSync('pnpm', ['--version'], { encoding: 'utf8' }).trim();
          const { templateVersion } = JSON.parse(readFileSync('factory-template.json', 'utf8'));
          const hash = createHash('sha256');
          for (const file of ['package.json', 'pnpm-lock.yaml']) if (existsSync(file)) hash.update(readFileSync(file));
          const prefix = `template-pnpm-store-${process.env.RUNNER_OS}-pnpm${pnpm}-`;
          console.log(`prefix=${prefix}`);
          console.log(`key=${prefix}${templateVersion}-${hash.digest('hex').slice(0, 16)}`);
          KEY

      - name: Restore the template pnpm store
        id: pnpm-cache
        if: steps.supersede.outputs.superseded != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ steps.pnpm-store.outputs.key }}
          restore-keys: ${{ steps.pnpm-store.outputs.prefix }}

      - name: Install and lock the new application dependencies
        timeout-minutes: 15
        if: steps.supersede.outputs.superseded != 'true'
        run: |
          cd "$RUNNER_TEMP/template-generation/nb3-factory"
          # Verification runs on SQLite. Keep the template's own declaration when
          # it has one: `pnpm add …@latest` resolves under pnpm's
          # minimumReleaseAge and rewrote ^0.1.0-beta.4 to an exact, older
          # 0.1.0-beta.3 without the ./testing export the template's tests use.
          if ! node -e 'process.exit(require("./package.json").dependencies?.["@nocobase/db-sqlite"] ? 0 : 1)'; then
            pnpm add @nocobase/db-sqlite@latest
          fi
          pnpm install --no-frozen-lockfile

      - name: Install, register, and inspect the required Pro plugin baseline
        timeout-minutes: 15
        if: steps.supersede.outputs.superseded != 'true'
        env:
          CI: true
        run: |
          # One deadline for every pnpm call in this step, a minute inside its
          # 15-minute limit, so template-plugins.mjs stops a hung call itself.
          export FACTORY_PLUGIN_STEP_DEADLINE=$(( $(date +%s) + 14 * 60 ))
          APP_ROOT="$RUNNER_TEMP/template-generation/nb3-factory"
          node control/.github/scripts/template-plugins.mjs install \
            "$APP_ROOT" "$RUNNER_TEMP/template-diagnostics"
          node control/.github/scripts/template-mail-config.mjs "$APP_ROOT"
          # Re-registration can be a no-op; always sync before inspecting Skills.
          pnpm --dir "$APP_ROOT" exec nocobase skills sync
          node control/.github/scripts/template-plugins.mjs inspect \
            "$APP_ROOT" "$RUNNER_TEMP/template-diagnostics"

      # Saved after the plugin install so the store holds the Pro plugins too,
      # and before verification builds anything into it.
      - name: Drop store entries the generated lockfile no longer uses
        if: github.event_name == 'workflow_dispatch' && steps.pnpm-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        working-directory: ${{ runner.temp }}/template-generation/nb3-factory
        run: pnpm store prune

      - name: Save the template pnpm store before verification
        if: github.event_name == 'workflow_dispatch' && steps.pnpm-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}

      - name: Format the generated application and plugin registrations
        if: steps.supersede.outputs.superseded != 'true'
        run: |
          cd "$RUNNER_TEMP/template-generation/nb3-factory"
          format_paths=(package.json README.MD eslint.config.js factory-template.json client/plugins.ts server/plugins.ts cli/plugins.ts server/config/index.ts server/config/mail.ts tests/logic vitest.config.ts)
          # New templates create config.yml through config init, not create-app.
          # Verification uses an external APP_CONFIG_FILE; do not generate secrets here.
          if [[ -f config.yml ]]; then
            format_paths+=(config.yml)
          fi
          # Newer templates ship pnpm-workspace.yaml that fails prettier --check.
          if [[ -f pnpm-workspace.yaml ]]; then
            format_paths+=(pnpm-workspace.yaml)
          fi
          pnpm exec prettier --write "${format_paths[@]}"

      - name: Install Chinese browser fonts
        timeout-minutes: 10
        if: steps.supersede.outputs.superseded != 'true'
        run: bash control/.github/scripts/install-browser-fonts.sh

      # Factory regression tests already run on every PR that changes these
      # scripts (factory-tests.yml); a refresh that may publish runs them here.
      # Like factory-tests, unset the run identity: handoff, recovery and budget
      # fixtures read GITHUB_RUN_ID/GITHUB_RUN_ATTEMPT, and a Re-run (attempt 2)
      # would otherwise fail them.
      - name: Run factory regression tests before publication
        if: github.event_name != 'pull_request'
        # The suite takes about 3 minutes in factory-tests.yml. A hang must not
        # hold template-refresh-global (and sync-issue-presets) for two hours.
        timeout-minutes: 15
        run: env -u GITHUB_RUN_ID -u GITHUB_RUN_ATTEMPT node --test --test-concurrency=1 control/.github/scripts/tests/*.test.mjs

      - name: Verify factory, application, clean database, and browser login
        if: steps.supersede.outputs.superseded != 'true'
        # 96-162 s in recent runs; bounded for the same reason as the tests.
        timeout-minutes: 20
        run: |
          set -o pipefail
          # The published AGENTS.md and CLAUDE.md are exactly what the template generated.
          node control/.github/scripts/template-guidance.mjs check "$RUNNER_TEMP/template-generation/nb3-factory"
          node control/.github/scripts/create-runtime-config.mjs \
            --output "$RUNNER_TEMP/template-verification.yml" \
            --database "$RUNNER_TEMP/template-verification/database.sqlite"
          control/.github/scripts/verify.sh \
            "$RUNNER_TEMP/template-generation/nb3-factory" \
            "$RUNNER_TEMP/template-verification.yml" \
            "$RUNNER_TEMP/template-diagnostics" \
            2>&1 | tee "$RUNNER_TEMP/template-diagnostics/verify.log"

      - name: Package only the verified baseline as one new root commit
        if: steps.supersede.outputs.superseded != 'true'
        run: |
          cd "$RUNNER_TEMP/template-generation/nb3-factory"
          git init --initial-branch=template
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const files = execFileSync('git', ['diff', '--cached', '--name-only', '-z'], { encoding: 'utf8' }).split('\0');
          // The owner explicitly versions the generated root config and GitHub issue settings.
          const runtimeFiles = files.filter(file => !['config.yml', '.github/ISSUE_TEMPLATE/config.yml'].includes(file) && /(^|\/)(config\.yml|\.env($|\.)|node_modules\/|dist\/|storage\/)/.test(file));
          if (runtimeFiles.length) {
            throw new Error(`Runtime files were staged; refusing to package them: ${runtimeFiles.join(', ')}`);
          }
          NODE
          git commit -m "chore: regenerate baseline from latest NocoBase template"
          mkdir -p "$RUNNER_TEMP/template-artifact"
          git bundle create "$RUNNER_TEMP/template-artifact/template.bundle" refs/heads/template
          cp factory-template.json "$RUNNER_TEMP/template-diagnostics/factory-template.json"
          echo "Fresh template verified. Dry run: ${{ github.event_name == 'pull_request' || inputs.dry_run }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Save the verified baseline
        if: steps.supersede.outputs.superseded != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-template
          path: ${{ runner.temp }}/template-artifact/template.bundle
          if-no-files-found: error
          retention-days: 14

      - name: Save verification logs and browser screenshot
        if: always() && steps.supersede.outputs.superseded != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: template-diagnostics
          path: ${{ runner.temp }}/template-diagnostics
          if-no-files-found: warn
          retention-days: 14

  publish:
    needs: generate
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the recorded control commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.generate.outputs.base_sha }}
          path: control
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-template
          path: template-artifact

      - name: Back up and advance develop without executing generated code
        env:
          BASE_SHA: ${{ needs.generate.outputs.base_sha }}
          BACKUP_BRANCH: factory-backup/develop-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          bash control/.github/scripts/publish-template.sh \
            control template-artifact/template.bundle "$BASE_SHA" "$BACKUP_BRANCH"
