name: Isolated Hub and Host publishing smoke

on:
  pull_request:
    paths: ['.github/workflows/hub-smoke.yml', '.github/scripts/hub-smoke.mjs', '.github/scripts/tests/hub-smoke.test.mjs']
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact NocoBase source SHA for the temporary Hub
        default: cde9a8ea11b54dd436f65c9f696cc58f0969a7ee
        required: true
        type: string
      issue:
        description: Delivered counter task Issue
        default: '216'
        required: true
        type: string
      run:
        description: Delivered task run with an unexpired dist artifact
        default: '35874919352'
        required: true
        type: string
      attempt:
        description: Exact source attempt
        default: '1'
        required: true
        type: string

permissions: {}

jobs:
  hub-smoke:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    env:
      SOURCE_SHA: ${{ inputs.source_sha || 'cde9a8ea11b54dd436f65c9f696cc58f0969a7ee' }}
      TASK_ISSUE: ${{ inputs.issue || '216' }}
      TASK_RUN: ${{ inputs.run || '35874919352' }}
      TASK_ATTEMPT: ${{ inputs.attempt || '1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Install isolated pinned browser test dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/hub-browser" --ignore-scripts --no-audit --no-fund playwright@1.55.0
          echo "FACTORY_HUB_BROWSER_DIR=$RUNNER_TEMP/hub-browser" >> "$GITHUB_ENV"
      - name: Select an already independently verified counter artifact
        id: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          node control/.github/scripts/hub-smoke.mjs select "$RUNNER_TEMP/business"
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.source.outputs.artifact_id }}
          merge-multiple: true
          run-id: ${{ env.TASK_RUN }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/business
      - name: Bind the artifact to the actual delivered PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node control/.github/scripts/hub-smoke.mjs bind "$RUNNER_TEMP/business"
      - uses: actions/checkout@v4
        with:
          repository: nocobase/nocobase3
          ref: ${{ env.SOURCE_SHA }}
          path: source
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      - name: Prepare exact Hub source packages in an isolated local registry
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          pnpm install --frozen-lockfile
          pnpm local-registry:prepare
      - name: Create and verify a temporary Hub application
        working-directory: source
        run: pnpm local-registry:verify --template hub --dialect sqlite --workdir "$RUNNER_TEMP/hub-source"
      - name: Install browser fonts
        run: bash control/.github/scripts/install-browser-fonts.sh
      - name: Publish, deploy, use and inspect the verified counter through Hub and Host
        run: node control/.github/scripts/hub-smoke.mjs run "$RUNNER_TEMP/hub-source/crm" "$RUNNER_TEMP/business" "$RUNNER_TEMP/hub-evidence"
      - name: Preserve explicit scope and outcome
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          mkdir -p "$RUNNER_TEMP/hub-evidence"
          node -e 'require("node:fs").writeFileSync(process.argv[1], JSON.stringify({version:1,status:process.env.RESULT,sourceSha:process.env.SOURCE_SHA,taskIssue:process.env.TASK_ISSUE,taskRun:process.env.TASK_RUN,taskAttempt:process.env.TASK_ATTEMPT,runId:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,scope:"Temporary loopback Hub/Host; existing business artifact; no production deployment or model invocation"},null,2))' "$RUNNER_TEMP/hub-evidence/run.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hub-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hub-evidence
          retention-days: 14
          if-no-files-found: error
      - name: Stop this run's isolated registry
        if: always()
        working-directory: source
        run: node scripts/local-registry.mjs stop
