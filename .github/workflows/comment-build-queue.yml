name: Comment build queue

on:
  issue_comment:
    types: [created, edited]
  workflow_run:
    workflows: [Code Agent NocoBase Task]
    types: [completed]
  # Comment builds are dispatched with GITHUB_TOKEN, so their completion
  # emits no workflow_run here; this sweep closes their receipts, starts the
  # next queued instruction and re-sends a lost dispatch. A new comment on the
  # Issue reconciles it immediately.
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue queue to reconcile
        required: true
        type: number

permissions: {}

# Only this workflow writes queue receipts. Keep admission and completion
# atomic relative to other queue events, including events for the same Issue.
concurrency:
  group: factory-comment-build-queue
  queue: max

jobs:
  reconcile:
    if: >-
      github.event_name != 'issue_comment' ||
      (!github.event.issue.pull_request &&
       github.event.comment.user.type != 'Bot' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: read
    steps:
      # Never execute application branch code or interpolate comment text.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Reconcile comment build queue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/dispatch-comment-builds.mjs "$GITHUB_EVENT_PATH"
