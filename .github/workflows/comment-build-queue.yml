name: Comment build queue

on:
  issue_comment:
    types: [created, edited]
  workflow_run:
    workflows: [Code Agent NocoBase Task]
    types: [completed]
  # Comment builds are dispatched with GITHUB_TOKEN, so their completion
  # emits no workflow_run here. Each finished comment round requests this
  # workflow for its Issue instead (dispatch-reports / dispatch-reply-history
  # in code-agent-task.yml), with its own run_id. GitHub starts this hourly
  # schedule hours late, so it is only the backstop that closes receipts,
  # starts the next queued instruction and re-sends a lost dispatch. A new
  # comment on the Issue reconciles it immediately.
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue queue to reconcile
        required: true
        type: number
      run_id:
        description: Finished task run to wait for before reconciling (set by the task itself)
        required: false
        default: ''
        type: string

permissions: {}

jobs:
  # A task requests this run from its own last job, so its run is still in
  # progress here. Wait for it outside the queue's lock, so other Issues'
  # events do not queue behind the wait.
  wait-for-source:
    if: github.event_name == 'workflow_dispatch' && inputs.run_id != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      # The runner's bundled Node is older than the one the scripts are tested on.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
      - name: Wait for the source task run to complete
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.run_id }}
        run: node .github/scripts/dispatch-comment-builds.mjs --wait-run "$SOURCE_RUN_ID"

  reconcile:
    needs: wait-for-source
    # A skipped task run (an Issue from someone without repository access)
    # finished no build, so its completion event is not a reason to sweep.
    # !cancelled(): wait-for-source is skipped for every other event, and a
    # failed wait still reconciles (an unfinished run reads as still active).
    if: >-
      !cancelled() &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'skipped') &&
      (github.event_name != 'issue_comment' ||
      (!github.event.issue.pull_request &&
       github.event.comment.user.type != 'Bot' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Only this workflow writes queue receipts. Keep admission and completion
    # atomic relative to other queue events, including events for the same Issue.
    # At job level, so an event the job condition drops never waits in this queue.
    concurrency:
      group: factory-comment-build-queue
      queue: max
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: read
    steps:
      # Never execute application branch code or interpolate comment text.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      # The runner's bundled Node is older than the one the scripts are tested on.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
      - name: Reconcile comment build queue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/dispatch-comment-builds.mjs "$GITHUB_EVENT_PATH"
