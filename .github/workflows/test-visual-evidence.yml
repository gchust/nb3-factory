name: Test visual evidence
on:
  push:
    branches: [feat/pr-visual-evidence]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Export source for local verification
        run: git archive --format=tar HEAD > "$RUNNER_TEMP/factory-source.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: factory-source
          path: ${{ runner.temp }}/factory-source.tar
          retention-days: 1
      - name: Test factory controls
        run: node --test .github/scripts/tests/*.test.mjs
      - name: Install the same recorder used by the task workflow
        run: npm install --prefix "$RUNNER_TEMP/recorder" agent-browser@0.36.0
      - name: Install video encoder
        run: sudo apt-get update -qq && sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Smoke-test real browser recording without a model API
        env:
          RECORDER_BIN: ${{ runner.temp }}/recorder/node_modules/.bin
        run: PATH="$RECORDER_BIN:$PATH" bash .github/scripts/tests/recording-smoke.sh
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      - name: Install pinned application lint dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint changed factory scripts
        run: pnpm exec eslint .github/scripts/visual-report.mjs .github/scripts/publish-visual-report.mjs .github/scripts/tests/visual-report.test.mjs .github/scripts/tests/browser-acceptance.test.mjs .github/scripts/tests/template-refresh.test.mjs .github/scripts/publish-pr.mjs --max-warnings 0
      - name: Verify native attachment CLI distribution
        run: |
          curl --fail --silent --show-error --location --retry 2 --max-time 120 https://github.com/cli/cli/releases/download/v2.100.0/gh_2.100.0_linux_amd64.tar.gz -o "$RUNNER_TEMP/gh.tar.gz"
          tar -xzf "$RUNNER_TEMP/gh.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/gh_2.100.0_linux_amd64/bin/gh" pr comment --help | grep -- --attach
