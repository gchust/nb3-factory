name: Apply per-Issue concurrency fix

on:
  push:
    branches: [fix/per-issue-concurrency]

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/per-issue-concurrency
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Apply focused concurrency change
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/code-agent-task.yml')
          text = workflow.read_text()
          old = '''concurrency:
            group: code-agent-global
            queue: max
          '''
          expression = '$' + '{{ github.event.issue.number || github.event.client_payload.issue_number || inputs.issue_number || github.run_id }}'
          new = f'''# Retries and cross-run handoffs for one Issue must stay serialized, but
          # independent application tasks should not block each other.
          concurrency:
            group: code-agent-task-{expression}
            queue: max
          '''
          if old not in text:
              raise SystemExit('expected global task concurrency block was not found')
          workflow.write_text(text.replace(old, new, 1))

          refresh = Path('.github/workflows/refresh-template.yml')
          text = refresh.read_text()
          old = '# Share the whole-workflow queue with business tasks, including their publisher.\n'
          new = '# Serialize template refresh runs independently from application tasks.\n'
          if old not in text:
              raise SystemExit('expected refresh concurrency comment was not found')
          refresh.write_text(text.replace(old, new, 1))

          tests = Path('.github/scripts/tests/workflow-policy.test.mjs')
          text = tests.read_text()
          marker = "test('PR completion uses only trusted control-plane code for both branch generations', () => {"
          addition = r'''test('different Issues run concurrently while one Issue stays serialized', () => {
            assert.doesNotMatch(workflow, /group: code-agent-global/);
            assert.match(
              workflow,
              /group: code-agent-task-\$\{\{ github\.event\.issue\.number \|\| github\.event\.client_payload\.issue_number \|\| inputs\.issue_number \|\| github\.run_id \}\}/,
            );
            assert.match(workflow, /queue: max/);
          });

          '''
          if marker not in text:
              raise SystemExit('workflow policy insertion point was not found')
          tests.write_text(text.replace(marker, addition + marker, 1))

          readme = Path('README.MD')
          text = readme.read_text()
          replacements = {
              'Queue["全局串行队列"]': 'Queue["按 Issue 分组的并发队列"]',
              '同一目标分支只能同时有一个未合并的 Code Agent PR。整个仓库的 Code Agent 任务也使用一个 `queue: max` 并发组，因此一次只运行一个，最多排队 100 个任务。': '同一目标分支只能同时有一个未合并的 Code Agent PR。同一个 Issue 的重跑和跨 Runner continuation 共用一个 `queue: max` 并发组，避免同一任务重叠执行；不同 Issue 使用不同并发组，可以同时搭建不同应用。',
              '刷新与搭建任务共用串行队列；': '模板刷新自身串行，并且不再阻塞独立的搭建任务；',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'expected README text was not found: {old}')
              text = text.replace(old, new, 1)
          readme.write_text(text)
          PY

      - name: Verify workflow policy tests
        run: node --test .github/scripts/tests/workflow-policy.test.mjs

      - name: Upload generated files
        uses: actions/upload-artifact@v4
        with:
          name: per-issue-concurrency-files
          path: |
            .github/workflows/code-agent-task.yml
            .github/workflows/refresh-template.yml
            .github/scripts/tests/workflow-policy.test.mjs
            README.MD
          if-no-files-found: error
          retention-days: 1
