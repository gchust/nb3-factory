name: Publish Agent History

on:
  workflow_run:
    workflows: [Code Agent NocoBase Task]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed task run ID (including comment-only runs)
        required: true
        type: string
      attempt:
        description: Run attempt (leave empty for latest)
        required: false
        type: string

permissions: {}

jobs:
  # The task usually requested this run itself; see report-dispatch-gate.yml.
  # A skipped task run (an Issue from someone without repository access) ran
  # nothing to report on, so it does not start this chain either.
  dispatch-gate:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'skipped'
    uses: ./.github/workflows/report-dispatch-gate.yml
    with:
      workflow: publish-agent-history.yml
    permissions:
      actions: read

  # Waits for the source run in a job that holds no concurrency group, so the
  # locked job below never holds it while the task's own dispatch-reports job
  # is still finishing (up to ten minutes); its select then reads a completed
  # run at once. Same condition as the job it feeds.
  wait-for-source:
    needs: dispatch-gate
    if: >-
      !cancelled() && needs.dispatch-gate.outputs.covered != 'true' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'skipped')
    outputs:
      attempt: ${{ steps.wait.outputs.attempt }}
    runs-on: ubuntu-24.04
    # wait-for-task-run.mjs gives up after 11 minutes.
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: control
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
      - name: Wait for the source task run to complete
        id: wait
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
          SOURCE_ATTEMPT: ${{ inputs.attempt || github.event.workflow_run.run_attempt }}
        run: |
          node control/.github/scripts/wait-for-task-run.mjs \
            --run-id "$SOURCE_RUN_ID" --attempt "$SOURCE_ATTEMPT"

  publish:
    needs: [dispatch-gate, wait-for-source]
    if: >-
      !cancelled() && needs.wait-for-source.result == 'success' &&
      needs.dispatch-gate.outputs.covered != 'true' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # At job level, so an event the job condition drops never waits in this queue.
    concurrency:
      group: factory-agent-history
      queue: max
    permissions:
      actions: read
      contents: write
      issues: write
    env:
      SOURCE_RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
      # The attempt wait-for-source settled on, so a re-run started meanwhile
      # cannot make this job, holding its group, wait for a newer attempt.
      SOURCE_ATTEMPT: ${{ needs.wait-for-source.outputs.attempt || inputs.attempt || github.event.workflow_run.run_attempt }}
    steps:
      # Artifact content is data, never application code to execute.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: control
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x

      - name: Resolve completed task attempt and evidence IDs
        id: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node control/.github/scripts/agent-history.mjs select \
            --run "$SOURCE_RUN_ID" --attempt "$SOURCE_ATTEMPT" \
            --source "$RUNNER_TEMP/history-source.json"

      # IDs were selected inside this attempt's job timestamps. Separate role
      # directories prevent identical filenames in different jobs overwriting.
      - name: Download task input
        id: task
        if: steps.source.outputs.task != ''
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.source.outputs.task }}
          merge-multiple: true
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/history-evidence/task
      - name: Download implementation and QA
        id: agent
        if: steps.source.outputs.agent != ''
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.source.outputs.agent }}
          merge-multiple: true
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/history-evidence/agent
      - name: Download independent final verification
        id: final
        if: steps.source.outputs.final != ''
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.source.outputs.final }}
          merge-multiple: true
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/history-evidence/final
      - name: Download comment interactions
        id: reply
        if: steps.source.outputs.reply != ''
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.source.outputs.reply }}
          merge-multiple: true
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/history-evidence/reply

      - name: Pack the agent interaction history
        id: pack
        if: steps.source.outputs.ready == 'true'
        continue-on-error: true
        env:
          DOWNLOADS: '{"task":"${{ steps.task.outcome }}","agent":"${{ steps.agent.outcome }}","final":"${{ steps.final.outcome }}","reply":"${{ steps.reply.outcome }}"}'
        run: |
          node control/.github/scripts/agent-history.mjs pack \
            --artifacts "$RUNNER_TEMP/history-evidence" --output "$RUNNER_TEMP/history" \
            --manifest "$RUNNER_TEMP/history/manifest.json" --source "$RUNNER_TEMP/history-source.json" \
            --downloads "$DOWNLOADS" --issue "${{ steps.source.outputs.issue }}" \
            --run "${{ steps.source.outputs.run }}" --attempt "${{ steps.source.outputs.attempt }}"

      - name: Upload the archive to the history release
        id: release
        if: steps.pack.outputs.asset != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ steps.pack.outputs.asset }}
        run: |
          set -euo pipefail
          if ! gh release view factory-history --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create factory-history --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "工厂运行历史" --notes "已归档 Agent 交互与终验诊断；完整性和缺失说明见各 Issue。"
          fi
          gh release upload factory-history "$RUNNER_TEMP/history/$ASSET" \
            --repo "$GITHUB_REPOSITORY" --clobber
          echo "asset_url=https://github.com/$GITHUB_REPOSITORY/releases/download/factory-history/$ASSET" >> "$GITHUB_OUTPUT"

      - name: Report published or missing history on the task Issue
        if: ${{ !cancelled() && steps.source.outputs.ready == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node control/.github/scripts/agent-history.mjs publish \
            --manifest "$RUNNER_TEMP/history/manifest.json" --source "$RUNNER_TEMP/history-source.json" \
            --issue "${{ steps.source.outputs.issue }}" --run "${{ steps.source.outputs.run }}" \
            --attempt "${{ steps.source.outputs.attempt }}" --asset-url "${{ steps.release.outputs.asset_url }}" \
            --fallback-url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID"

      - name: Keep publication failures visible without rebuilding the application
        if: ${{ !cancelled() && (steps.pack.outcome == 'failure' || steps.release.outcome == 'failure' || steps.task.outcome == 'failure' || steps.agent.outcome == 'failure' || steps.final.outcome == 'failure' || steps.reply.outcome == 'failure') }}
        run: exit 1
