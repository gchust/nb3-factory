name: Reset framework findings

# Starts the cross-report framework findings index over. Runs that started
# before the reset keep their archived reports but are no longer counted.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type RESET to count only builds that start from now on (published reports stay unchanged)
        required: true
        type: string

permissions: {}

jobs:
  reset:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && inputs.confirm == 'RESET'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Serializes with report and classification publication on gh-pages.
    concurrency:
      group: factory-task-usage
      queue: max
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: control
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
      - name: Move the findings baseline to now
        id: reset
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node control/.github/scripts/report-pages.mjs reset-findings
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.reset.outputs.commit_sha }}
          path: report-site
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: report-site
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
