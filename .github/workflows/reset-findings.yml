name: Reset framework findings

# Starts the cross-report framework findings index over. Runs that started
# before the reset keep their archived reports but are no longer counted.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type RESET to count only builds that start from now on (published reports stay unchanged)
        required: true
        type: string

permissions: {}

jobs:
  reset:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && inputs.confirm == 'RESET'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Serializes with report and classification publication on gh-pages.
    concurrency:
      group: factory-task-usage
      queue: max
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: control
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.x
      - name: Move the findings baseline to now
        id: reset
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node control/.github/scripts/report-pages.mjs reset-findings
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.reset.outputs.commit_sha }}
          path: report-site
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: report-site
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        id: deployment
