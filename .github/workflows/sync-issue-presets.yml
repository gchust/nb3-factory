name: Sync preset Issue choices

on:
  issues:
    types: [opened, labeled, unlabeled, edited, deleted, transferred]
  label:
    types: [edited, deleted]
  # The job writes the default branch (develop) only; pushes elsewhere would
  # only start skipped runs.
  push:
    branches: [develop]
    paths:
      - '.github/workflows/sync-issue-presets.yml'
      - '.github/scripts/issue-presets.mjs'
      - '.github/scripts/sync-issue-presets.mjs'
  workflow_dispatch:

permissions: {}

jobs:
  sync:
    if: >-
      (github.event_name != 'push' || github.ref_name == github.event.repository.default_branch) &&
      (github.event_name != 'issues' || github.event.label.name == 'factory:preset' ||
       contains(github.event.issue.labels.*.name, 'factory:preset')) &&
      (github.event_name != 'label' || github.event.label.name == 'factory:preset' ||
       github.event.changes.name.from == 'factory:preset')
    # Shares the template refresh queue: this commits to develop, and a refresh
    # refuses to publish when develop moved while it was generating. Job-level,
    # so the many unrelated issues events skip at once instead of waiting
    # behind a refresh of up to two hours.
    concurrency:
      group: template-refresh-global
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          # The preset form is read and written through the contents API.
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
      - name: Update preset choices on the default branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/sync-issue-presets.mjs
