name: Test continuation reports

on:
  push:
    branches: [fix/continuation-report-dispatch]

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Factory regression tests
        run: node --test .github/scripts/tests/*.test.mjs
      - name: Export exact source for local verification
        run: git archive --format=tar HEAD > "$RUNNER_TEMP/factory-source.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: factory-source
          path: ${{ runner.temp }}/factory-source.tar
          retention-days: 2
  backfill:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch only the missing reports for existing Issue 24 runs
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          for run in 34142344386 34162456590; do
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/report-task-usage.yml/dispatches" \
              -f "ref=$DEFAULT_BRANCH" -f "inputs[run_id]=$run" -f 'inputs[attempt]=1'
          done
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/publish-visual-report.yml/dispatches" \
            -f "ref=$DEFAULT_BRANCH" -f 'inputs[run_id]=34162456590'
