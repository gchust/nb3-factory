name: Apply default PR base patch
on:
  push:
    branches: [fix/default-pr-base]
    paths: [.github/workflows/apply-default-pr-base.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'gchust/nb3-factory'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Apply the locally tested patch after checksum verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD^)" = 2e0182772952c84d5e3191321f1efd4348614cd9
          python3 - <<'PY'
          import base64, hashlib, os, pathlib, subprocess, zlib
          shas = ['6d4d26b509a9b146114c5a47da317cedf045742c', 'bc9e1c163797a6b6a4551dd3afb0556217c4c6ac', '9b3aa860b56d065681879284bcd598c66cc6bee8', 'f8b7351776843cbe5da04c1e4584ff15c2be6572', '3b8d8a5ef633d6ace8b1df9aeb949cac21077f22', '11ac13d123fe43495529f98958f37d26bf83da14']
          chunks = []
          for sha in shas:
              raw = subprocess.check_output(['gh', 'api', f'repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs/{sha}', '--jq', '.content'])
              part = base64.b64decode(raw)
              assert hashlib.sha1(b'blob ' + str(len(part)).encode() + b'\0' + part).hexdigest() == sha
              chunks.append(part)
          patch = zlib.decompress(base64.b64decode(b''.join(chunks)))
          assert hashlib.sha256(patch).hexdigest() == 'cd956d4e832eac827f39541c16e460f6be511af9123a148d5d0c05ea628a4354'
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'default-pr-base.patch'
          target.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(target)], check=True)
          subprocess.run(['git', 'apply', str(target)], check=True)
          PY
          git diff --check
      - name: Run the complete factory regression suite
        run: node --test --test-concurrency=1 .github/scripts/tests/*.test.mjs
      - name: Verify browser fixtures and preview DNS
        run: |
          python3 .github/scripts/tests/browser-fixtures.test.py
          python3 .github/scripts/tests/preview-dns-sync.test.py
      - name: Publish the verified changes and remove this one-shot workflow
        run: |
          rm .github/workflows/apply-default-pr-base.yml
          git add .github
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: base fresh task PRs on develop without intermediate branches'
          git push origin HEAD:fix/default-pr-base
