name: Publish Task Visual Report

on:
  workflow_run:
    workflows: [Code Agent NocoBase Task]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Code Agent task run ID with a published build PR (including failed builds)
        required: true
        type: string
      attempt:
        description: Run attempt (leave empty for latest)
        required: false
        type: string

permissions: {}

concurrency:
  group: factory-visual-${{ inputs.run_id || github.event.workflow_run.id }}
  queue: max

jobs:
  # The task usually requested this run itself; see report-dispatch-gate.yml.
  # A skipped task run (an Issue from someone without repository access) ran
  # nothing to report on, so it does not start this chain either.
  dispatch-gate:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'skipped'
    uses: ./.github/workflows/report-dispatch-gate.yml
    with:
      workflow: publish-visual-report.yml
    permissions:
      actions: read

  # A task that hit the agent job's six-hour limit is reported as cancelled yet
  # still publishes a failed PR; select publishes only for a build PR, so a
  # manual cancel produces nothing.
  publish-media:
    needs: dispatch-gate
    if: >-
      !cancelled() && needs.dispatch-gate.outputs.covered != 'true' &&
      (github.event_name == 'workflow_dispatch' || contains(fromJSON('["success","failure","timed_out","cancelled"]'), github.event.workflow_run.conclusion))
    runs-on: ubuntu-24.04
    # Up to 11 minutes waiting for the source run (wait-for-task-run.mjs) plus
    # the media download and upload.
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
      pull-requests: write
    env:
      SOURCE_RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
      SOURCE_ATTEMPT: ${{ inputs.attempt || github.event.workflow_run.run_attempt }}
    steps:
      # Never check out the application PR or execute anything from its artifact.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: control
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x

      - name: Select a published build PR
        id: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node control/.github/scripts/publish-visual-report.mjs select \
            --run-id "$SOURCE_RUN_ID" --attempt "$SOURCE_ATTEMPT" --source "$RUNNER_TEMP/visual-source.json"

      - name: Download task evidence
        if: steps.source.outputs.ready == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # By ID: every attempt of the run uploads factory-agent-N under the
          # same name. merge-multiple, as in the factory's other downloads by ID,
          # keeps the files at the path itself, where prepare reads them.
          artifact-ids: ${{ steps.source.outputs.artifact_id }}
          merge-multiple: true
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/task-evidence

      - name: Collect the passing round or latest failed build evidence
        id: media
        if: steps.source.outputs.ready == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node control/.github/scripts/publish-visual-report.mjs prepare \
            --run-id "$SOURCE_RUN_ID" --source "$RUNNER_TEMP/visual-source.json" \
            --artifacts "$RUNNER_TEMP/task-evidence" --output "$RUNNER_TEMP/visual-report"

      - name: Preserve the standalone media package
        id: archive
        if: steps.media.outputs.ready == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: factory-visual-${{ env.SOURCE_RUN_ID }}
          path: ${{ runner.temp }}/visual-report
          if-no-files-found: error
          retention-days: 14

      - name: Install pinned GitHub CLI with attachment support
        if: steps.media.outputs.ready == 'true'
        continue-on-error: true
        env:
          MEDIA_ENABLED: ${{ secrets.FACTORY_MEDIA_TOKEN != '' }}
        run: |
          if [[ "$MEDIA_ENABLED" != 'true' ]]; then exit 0; fi
          version=2.100.0
          archive="gh_${version}_linux_amd64.tar.gz"
          mkdir -p "$RUNNER_TEMP/media-gh"
          cd "$RUNNER_TEMP/media-gh"
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 10 --max-time 120 \
            "https://github.com/cli/cli/releases/download/v${version}/${archive}" -o "$archive"
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 10 --max-time 120 \
            "https://github.com/cli/cli/releases/download/v${version}/gh_${version}_checksums.txt" -o checksums.txt
          grep " ${archive}\$" checksums.txt | sha256sum --check --strict
          tar -xzf "$archive"
          echo "FACTORY_GH_PATH=$RUNNER_TEMP/media-gh/gh_${version}_linux_amd64/bin/gh" >> "$GITHUB_ENV"

      - name: Publish PR screenshots and recordings (artifact fallback)
        id: publish
        if: steps.media.outputs.ready == 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FACTORY_MEDIA_TOKEN: ${{ secrets.FACTORY_MEDIA_TOKEN }}
          FACTORY_MEDIA_ARTIFACT_URL: ${{ steps.archive.outputs.artifact-url }}
        run: |
          node control/.github/scripts/publish-visual-report.mjs publish \
            --run-id "$SOURCE_RUN_ID" --output "$RUNNER_TEMP/visual-report"

      # continue-on-error above keeps the media package uploaded; this step
      # keeps the failure visible in the run instead of a green check. The
      # business PR is untouched, and the report is replayed, not rebuilt.
      - name: Keep publication failures visible without rebuilding the application
        if: ${{ !cancelled() && steps.publish.outcome == 'failure' }}
        run: |
          echo "::error::Publishing the visual report failed; the business PR is untouched. Replay it from Actions > Publish Task Visual Report with run_id=$SOURCE_RUN_ID and attempt=$SOURCE_ATTEMPT (see .github/REPORT_DISPATCH.md)."
          exit 1
