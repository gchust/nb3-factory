# Generated by sync-issue-presets.mjs; maintain cases using the factory:preset label.
name: 从预置案例重新搭建
description: 复制预置 Issue 的正文和人工评论，在独立新分支从头搭建
title: 从预置案例重新搭建
labels:
  - factory:build
  - agent:pending
body:
  - type: markdown
    attributes:
      value: |
        提交后复制原案例的正文及全部人工评论，不复制机器人回复、PR 或旧运行状态。
        从当前默认分支（develop）开始，在 agent/issue-<新 Issue 编号> 上搭建，PR 指向默认分支；不继承来源案例的分支。
        列表由 factory:preset 标签维护，包含已关闭的预置案例。列表同步完成后请刷新创建页面。
  - type: dropdown
    id: preset_issue
    attributes:
      label: 预置案例
      options:
        - "#155 - 基础数据系统：客户备忘录"
        - "#158 - 设备售后服务与巡检协同系统"
        - "#176 - 流程冒烟：单页计数器"
        - "#200 - 客户、联系人与商机管理"
        - "#201 - 员工 IT 报修与处理"
        - "#202 - 内部资料阅读与临时共享"
        - "#203 - 项目资料与私有附件"
        - "#204 - 自动化专项：受理与站内通知"
        - "#205 - 调度专项：过期待办标记"
        - "#206 - API 与结构查看：设备清单"
        - "#207 - 内部资料只读问答助手"
        - "#208 - 一条外部测试通知"
        - "#343 - 办公用品领用与库存核对"
        - "#344 - 员工入职、离职与账号恢复"
        - "#345 - 员工手册与制度问答"
    validations:
      required: true
  - type: dropdown
    id: build_review
    attributes:
      label: 框架评测
      description: 自动沿用来源预设或仓库默认；轻量只关闭额外框架评分，仍运行搭建、业务验收、独立终验、PR 和归档。
      options:
        - 自动
        - 轻量
        - 完整
      default: 0
    validations:
      required: true
  - type: input
    id: source_baseline
    attributes:
      label: 测试基线分支
      description: 可选，填写已验证的 factory-baseline/source- 分支；留空使用当前默认分支。不会继承来源案例的分支。
    validations:
      required: false
  - type: textarea
    id: additional_requirements
    attributes:
      label: 本次补充要求
      description: 可选，仅用于本次搭建，不修改原案例。
    validations:
      required: false
