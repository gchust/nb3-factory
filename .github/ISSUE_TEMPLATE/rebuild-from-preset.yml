# Generated by sync-issue-presets.mjs; maintain cases using the factory:preset label.
name: 从预置案例重新搭建
description: 复制预置 Issue 的正文和人工评论，在独立新分支从头搭建
title: '[Code Agent] 从预置案例重新搭建'
labels:
  - agent:pending
body:
  - type: markdown
    attributes:
      value: |
        提交后复制原案例的正文及全部人工评论，不复制机器人回复、PR 或旧运行状态。
        使用新的 issues-<Issue 编号> 目标分支，从当前默认分支开始；复制完成后只启动一次搭建。
        列表由 factory:preset 标签维护，包含已关闭的预置案例。列表同步完成后请刷新创建页面。
  - type: dropdown
    id: preset_issue
    attributes:
      label: 预置案例
      options:
        - "#155 - [预置案例] 客户备忘录（复制与重复搭建冒烟测试）"
        - "#158 - [预置案例 v1] 设备售后服务与巡检协同系统 · 综合回归"
        - "#176 - [预置案例] 流程冒烟：单页计数器（Issue → Agent → PR）"
    validations:
      required: true
  - type: textarea
    id: additional_requirements
    attributes:
      label: 本次补充要求
      description: 可选，仅用于本次搭建，不修改原案例。
    validations:
      required: false
  - type: checkboxes
    id: confirmation
    attributes:
      label: 确认
      options:
        - label: 我确认复制案例并由 Code Agent 创建新分支的 Pull Request。
          required: true
